  const feedback = createFeedback();
  const actionBox = el("div");
  const choicesBox = el("div", { class: "choices" });
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; answered = false;
    clearNode(wrap); clearNode(actionBox); clearNode(choicesBox); feedback.clear();
    const item = items[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("network") + "<span>Étape " + (i + 1) + "/" + items.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "chip", text: item.type === "order" ? "Ordonner" : "Scénario" })
    ]));
    if (item.type === "order") {
      const r = item.data;
      wrap.appendChild(el("h2", { text: r.title }));
      wrap.appendChild(el("p", { class: "card-sub", text: r.instruction }));
      currentPuzzle = createOrderList(r.steps, {});
      wrap.appendChild(currentPuzzle.root);
      const validateBtn = el("button", { class: "btn btn-primary btn-block", disabled: true, onclick: () => { validateBtn.disabled = true; checkOrderRound(r); } }, iconEl("check"), el("span", { text: "Valider l'ordre" }));
      const obs = new MutationObserver(() => { validateBtn.disabled = !currentPuzzle.isComplete(); });
      obs.observe(currentPuzzle.root, { childList: true, subtree: true });
      session.onCleanup(() => obs.disconnect());
      actionBox.appendChild(validateBtn);
    } else {
      const q = item.data;
      wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:14.5px;font-weight:600", text: q.t })));
      const scCopy = q;
      buildChoices(choicesBox, q.options, (i2, chosen) => {
        if (answered) return;
        answered = true;
        const ok = chosen.id === scCopy.correct;
        if (ok) { correct++; solved++; }
        session.addAnswer(ok);
        session.setScore(correct * 100);
        const ctrl = { };
        $$(".choice", choicesBox).forEach((b, bi) => {
          b.disabled = true;
          if (scCopy.options[bi].id === scCopy.correct) b.classList.add("good");
          else if (bi === i2) b.classList.add("bad");
        });
        feedback.show(ok ? "ok" : "ko", ok ? "Correct (+100 pts)" : "Incorrect", "<p>" + escapeHtml(scCopy.e) + "</p>");
        advance();
      });
      wrap.appendChild(choicesBox);
    }
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
  }
  function checkOrderRound(r) {
    if (answered) return;
    const ok = checkOrder(currentPuzzle.getOrder(), r.variants);
    answered = true;
    if (ok) { correct++; solved++; session.addAnswer(true); session.setScore(correct * 100); feedback.show("ok", "Ordre correct (+100 pts)", "<p>" + escapeHtml(r.explanation) + "</p>"); }
    else { session.addAnswer(false); feedback.show("ko", "Ordre incorrect", "<p>" + escapeHtml(r.explanation) + "</p>"); }
    advance();
  }
  let currentPuzzle = null;
  function advance() {
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= items.length ? "Terminer" : "Continuer", () => {
      if (idx + 1 >= items.length) {
        session.finish({
          score: correct * 100, win: solved >= 6,
          title: solved >= 6 ? "Circuit API maîtrisé" : "Série terminée",
          extras: [{ label: "Bonnes réponses", value: solved + "/" + items.length }]
        });
      } else load(idx + 1);
    }));
  }
  /* re-garde le puzzle courant pour la validation */
  return { start: () => { load(0); }, pause() { }, resume() { }, destroy() { } };
};

/* --- A1 : Puzzle arbre de Widgets --- */
GAME_FACTORIES["widget-tree"] = function (session) {
  const rounds = WIDGET_TREE_ROUNDS;
  let idx = 0, puzzle = null, firstTry = true, solved = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; firstTry = true; answered = false;
    clearNode(wrap); clearNode(actionBox); feedback.clear();
    const rd = rounds[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("layers") + "<span>Arbre " + (i + 1) + "/" + rounds.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: rd.title })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: rd.instruction }));
    puzzle = createOrderList(rd.blocks, {});
    wrap.appendChild(el("div", { class: "section-title", text: "Widgets disponibles" }));
    wrap.appendChild(puzzle.root);
    const validateBtn = el("button", { class: "btn btn-flutter btn-block", disabled: true, onclick: () => { validateBtn.disabled = true; validate(rd); } }, iconEl("check"), el("span", { text: "Valider l'arbre" }));
    const obs = new MutationObserver(() => { validateBtn.disabled = !puzzle.isComplete(); });
    obs.observe(puzzle.root, { childList: true, subtree: true });
    session.onCleanup(() => obs.disconnect());
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
  }
  function validate(rd) {
    const ok = checkOrder(puzzle.getOrder(), rd.variants);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (!ok) {
      firstTry = false;
      feedback.show("ko", "Hiérarchie incorrecte", "<p>Le framework ne peut pas construire l'arbre tel qu'écrit : un Widget doit être enfant d'un parent qui l'accepte (child, children…). Vérifie l'imbrication des parenthèses et le rôle de chaque Widget.</p>");
      clearNode(actionBox);
      actionBox.appendChild(el("button", { class: "btn btn-flutter btn-block", onclick: () => load(idx) }, iconEl("rotate"), el("span", { text: "Réessayer" })));
      return;
    }
    solved++;
    session.setScore(session.score + 100 + (firstTry ? 50 : 0));
    feedback.show("ok", "Arbre correct", "<p>" + escapeHtml(rd.explanation) + "</p>");
    const pre = el("pre", { class: "code" });
    rd.tree.forEach((line, i2) => {
      pre.appendChild(el("span", { text: (i2 === 0 ? "" : "  ") + line + "\n" }));
    });
    wrap.appendChild(pre);
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= rounds.length ? "Terminer" : "Arbre suivant", () => {
      if (idx + 1 >= rounds.length) {
        session.finish({
          score: session.score, win: solved === rounds.length,
          title: solved === rounds.length ? "Arbres maîtrisés" : "Série terminée",
          extras: [{ label: "Arbres réussis", value: solved + "/" + rounds.length }]
        });
      } else load(idx + 1);
    }));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

/* --- A3 : Tir sur cible UI --- */
GAME_FACTORIES["target-ui"] = function (session) {
  const TOTAL_TIME = 75;
  let remaining = TOTAL_TIME, cdId = null, promptTimer = null, level = 1, score = 0, correctCount = 0, idx = 0, answered = false, over = false, prompts = [];
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  session.body.appendChild(wrap);

  function promptTime() { return level === 1 ? 9 : level === 2 ? 7 : level === 3 ? 5.5 : 4.5; }
  function stopTimers() { if (cdId) { clearInterval(cdId); cdId = null; } if (promptTimer) { clearTimeout(promptTimer); promptTimer = null; } }
  session.onCleanup(stopTimers);

  function begin() {
    prompts = shuffle(TARGET_PROMPTS);
    idx = 0; score = 0; correctCount = 0; level = 1; over = false; remaining = TOTAL_TIME;
    session.setScore(0);
    session.startClock();
    session.setExtra("Niveau 1");
    cdId = setInterval(() => {
      remaining -= 0.5;
      if (remaining <= 0) { endGame(); return; }
    }, 500);
    nextPrompt();
  }
  function nextPrompt() {
    if (over) return;
    if (idx >= prompts.length) { prompts = shuffle(TARGET_PROMPTS); idx = 0; }
    const p = prompts[idx++];
    answered = false;
    clearNode(wrap);
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("target") + "<span>Niveau " + level + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "chip", html: icon("clock") + "<span>" + promptTime().toFixed(1) + " s</span>" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:15px;font-weight:650", text: p.q })));
    const grid = el("div", { class: "target-grid" });
    shuffle(p.options.slice()).forEach(opt => {
      grid.appendChild(el("button", {
        class: "target", text: opt,
        onclick: (e) => { if (answered) return; answered = true; pick(p, opt, e.currentTarget); }
      }));
    });
    wrap.appendChild(grid);
    feedback.clear();
    wrap.appendChild(feedback);
    promptTimer = setTimeout(() => {
      if (answered || over) return;
      answered = true;
      session.addAnswer(false);
      feedback.show("ko", "Trop lent", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>. " + escapeHtml(p.e) + "</p>");
      promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 2000);
    }, promptTime() * 1000);
  }
  function pick(p, opt, btn) {
    if (promptTimer) { clearTimeout(promptTimer); promptTimer = null; }
    const ok = opt === p.correct;
    session.addAnswer(ok);
    if (ok) {
      correctCount++;
      score += 100;
      level = Math.min(4, 1 + Math.floor(correctCount / 4));
      session.setScore(score);
      session.setExtra("Niveau " + level);
      btn.classList.add("good");
      feedback.show("ok", "Touché ! +100 pts", "<p>" + escapeHtml(p.e) + "</p>");
    } else {
      btn.classList.add("bad");
      $$(".target", wrap).forEach(t => { if (t.textContent === p.correct) t.classList.add("good"); });
      feedback.show("ko", "Raté", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>. " + escapeHtml(p.e) + "</p>");
    }
    promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1900);
  }
  function endGame() {
    if (over) return;
    over = true;
    stopTimers();
    session.finish({
      score, win: score >= 800,
      title: score >= 800 ? "Précision au rendez-vous" : "Fin du chrono",
      extras: [{ label: "Cibles touchées", value: String(correctCount) }, { label: "Niveau atteint", value: String(level) }]
    });
  }
  return {
    start: () => {
      clearNode(wrap);
      wrap.appendChild(gameIntro(GAMES["target-ui"]));
      wrap.appendChild(el("button", { class: "btn btn-flutter btn-block", onclick: begin }, iconEl("play"), el("span", { text: "Démarrer (75 s)" })));
    },
    pause() { stopTimers(); },
    resume() {
      if (over) return;
      if (!cdId) cdId = setInterval(() => { remaining -= 0.5; if (remaining <= 0) endGame(); }, 500);
      if (!promptTimer && !answered) {
        promptTimer = setTimeout(() => {
          promptTimer = null;
          if (answered || over) return;
          const p = prompts[idx - 1];
          answered = true;
          session.addAnswer(false);
          feedback.show("ko", "Trop lent", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>.</p>");
          promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1600);
        }, 2500);
      } else if (!promptTimer && answered) {
        promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1600);
      }
    },
    destroy() { stopTimers(); }
  };
};

  function clearAnim() { animTimers.forEach(t => clearTimeout(t)); animTimers = []; }
  session.onCleanup(clearAnim);

  function load(i) {
    idx = i; path = []; answered = false;
    clearNode(wrap); clearNode(actionBox); feedback.clear(); clearAnim();
    const sc = scenarios[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("network") + "<span>Couche " + (i + 1) + "/" + scenarios.length + "</span>" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, [
      el("div", { class: "card-title", html: icon("database") + "<span>Flux : " + escapeHtml(sc.token) + "</span>" }),
      el("p", { class: "card-sub", style: "margin-top:5px", text: sc.goal })
    ]));
    const tree = el("div", { class: "tree", role: "list" });
    sc.nodes.forEach(n => {
      const b = el("button", {
        class: "tree-node", style: "margin-left:" + ((n.level || 0) * 18) + "px", dataset: { id: n.id },
        onclick: () => {
          const last = path[path.length - 1];
          if (last && last.id === n.id) path.pop();
          else if (!path.some(p => p.id === n.id)) path.push(n);
          refresh(tree); validateBtn.disabled = path.length === 0;
        }
      }, [el("span", { text: n.label }), el("span", { class: "val", text: "" })]);
      tree.appendChild(b);
    });
    function refresh() {
      $$(".tree-node", tree).forEach(b => {
        const pos = path.findIndex(p => p.id === b.dataset.id);
        b.classList.toggle("selected", pos >= 0);
        b.classList.remove("visited");
        b.querySelector(".val").textContent = pos >= 0 ? "#" + (pos + 1) : "";
      });
    }
    wrap.appendChild(el("div", { class: "section-title", text: "Couches de l'application" }));
    wrap.appendChild(tree);
    const validateBtn = el("button", { class: "btn btn-flutter btn-block", disabled: true, onclick: () => validate(sc, tree) }, iconEl("check"), el("span", { text: "Valider le flux" }));
    actionBox.appendChild(validateBtn);
    actionBox.appendChild(el("button", { class: "btn btn-ghost btn-block", onclick: () => { path = []; refresh(); validateBtn.disabled = true; } }, iconEl("rotate"), el("span", { text: "Effacer" })));
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
  }
  function validate(sc, tree) {
    const ok = checkOrder(path.map(p => p.id), [sc.path]);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (!ok) {
      feedback.show("ko", "Flux incorrect", "<p>Repense le sens de circulation : les requêtes descendent des Widgets vers les sources, les états remontent et notifient l'UI. Chaque couche ne connaît que celle juste en dessous.</p>");
      return;
    }
    solved++;
    session.setScore(session.score + 100);
    path.forEach((p, i) => {
      animTimers.push(setTimeout(() => {
        const b = $$(".tree-node", tree).find(x => x.dataset.id === p.id);
        if (b) { b.classList.add("visited"); b.querySelector(".val").textContent = sc.values[p.id] || ""; }
      }, i * 350));
    });
    animTimers.push(setTimeout(() => {
      feedback.show("ok", "Flux correct (+100 pts)", "<p>" + escapeHtml(sc.explanation) + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Couche suivante", () => {
        if (idx + 1 >= scenarios.length) {
          session.finish({
            score: session.score, win: solved >= 4,
            title: solved >= 4 ? "Architecture Flutter maîtrisée" : "Série terminée",
            extras: [{ label: "Flux réussis", value: solved + "/" + scenarios.length }]
          });
        } else load(idx + 1);
      }));
    }, path.length * 350 + 250));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { clearAnim(); } };
};

/* --- B2 : Swipe Decision mobile --- */
GAME_FACTORIES["flutter-decision"] = function (session) {
  const scenarios = FLUTTER_DECISIONS.slice();
  let idx = 0, score = 0, good = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const choicesBox = el("div", { class: "choices" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; answered = false;
    clearNode(wrap); clearNode(actionBox); clearNode(choicesBox); feedback.clear();
    const sc = scenarios[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("phone") + "<span>Décision " + (i + 1) + "/" + scenarios.length + "</span>" })
    ]));
    const card = el("div", { class: "dec-card" }, el("p", { style: "font-size:14.5px;font-weight:600;line-height:1.5", text: sc.scenario }));
    wrap.appendChild(card);
    wrap.appendChild(el("div", { class: "section-title", text: "Ton choix" }));
    wrap.appendChild(choicesBox);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
    wrap.appendChild(el("p", { class: "swipe-hint", html: icon("hand") + "<span>Balayage facultatif : les boutons restent toujours disponibles.</span>" }));
    const scCopy = sc;
    buildChoices(choicesBox, sc.options, (pickIndex, item) => decide(scCopy, pickIndex, item));
    let sx = 0, sy = 0, tracking = false;
    function onStart(e) { const t = e.changedTouches ? e.changedTouches[0] : e; sx = t.clientX; sy = t.clientY; tracking = true; }
    function onEnd(e) {
      if (!tracking || answered) return;
      tracking = false;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const btns = $$(".choice", choicesBox);
        const target = dx < 0 ? btns[0] : btns[1];
        if (target && !target.disabled) target.click();
      }
    }
    card.addEventListener("touchstart", onStart, { passive: true });
    card.addEventListener("touchend", onEnd, { passive: true });
    session.onCleanup(() => { card.removeEventListener("touchstart", onStart); card.removeEventListener("touchend", onEnd); });
  }
  function decide(sc, pickIndex, item) {
    if (answered) return;
    answered = true;
    const opt = sc.options.find(o => o.id === item.id) || sc.options[pickIndex];
    const isGood = opt.verdict === "good";
    session.addAnswer(isGood);
    if (isGood) good++;
    const gained = isGood ? 100 : opt.verdict === "ok" ? 60 : 0;
    score += gained;
    session.setScore(score);
    $$(".choice", choicesBox).forEach((b, i) => {
      b.disabled = true;
      const o = sc.options[i];
      if (o && o.verdict === "good") b.classList.add("good");
      else if (i === pickIndex) b.classList.add("bad");
    });
    const verdictLabel = isGood ? "Solution solide" : opt.verdict === "ok" ? "Possible, avec des limites" : "Peu adaptée ici";
    feedback.show(isGood ? "ok" : opt.verdict === "ok" ? "info" : "ko", verdictLabel + " (+" + gained + " pts)",
      "<p><b>Pourquoi :</b> " + escapeHtml(sc.feedback[item.id] || "") + "</p><p style='margin-top:6px'>" + escapeHtml(sc.explanation) + "</p>");
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Scénario suivant", () => {
      if (idx + 1 >= scenarios.length) {
        session.finish({
          score, win: score >= 400,
          title: score >= 400 ? "Sens mobile aiguisé" : "Série terminée",
          extras: [{ label: "Décisions solides", value: good + "/" + scenarios.length }]
        });
      } else load(idx + 1);
    }));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

GAME_FACTORIES["flutter-arch-sort"] = function (session) {
  const rounds = FLUTTER_ARCH_ROUNDS.slice();
  let idx = 0, selected = null, validated = false, firstTry = true, solved = 0, answered = false, lockedItems = {};
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; selected = null; validated = false; firstTry = true; answered = false; lockedItems = {};
    clearNode(wrap); clearNode(actionBox); feedback.clear();
    const rd = rounds[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("layers") + "<span>Série " + (i + 1) + "/" + rounds.length + "</span>" })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: rd.intro }));
    wrap.appendChild(el("p", { class: "meta", text: "Touche un élément, puis la zone où le classer." }));
    const pool = el("div", { class: "pool" });
    const grid = el("div", { class: "class-grid", style: "grid-template-columns:1fr 1fr" });
    rd.zones.forEach(z => {
      const col = el("div", { class: "class-col", dataset: { zone: z.id } }, el("h4", { text: z.label }));
      col.addEventListener("click", () => place(col));
      grid.appendChild(col);
    });
    shuffle(rd.items).forEach(it => {
      const b = el("button", { class: "class-item", dataset: { id: it.id }, text: it.label, onclick: () => select(b) });
      pool.appendChild(b);
    });
    wrap.appendChild(el("div", { class: "section-title", text: "Briques du projet" }));
    wrap.appendChild(pool);
    wrap.appendChild(el("div", { class: "section-title", text: "Couches" }));
    wrap.appendChild(grid);
    const validateBtn = el("button", { class: "btn btn-flutter btn-block", disabled: true, onclick: () => validate(rd, grid) }, iconEl("check"), el("span", { text: "Valider le classement" }));
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
    wrap._pool = pool;
  }
  function select(btn) {
    if (validated) return;
    if (lockedItems[btn.dataset.id]) return;
    $$(".class-item.sel", wrap).forEach(b => b.classList.remove("sel"));
    if (selected === btn) { selected = null; return; }
    btn.classList.add("sel");
    selected = btn;
  }
  function place(col) {
    if (!selected || validated || lockedItems[selected.dataset.id]) return;
    col.appendChild(selected);
    selected.classList.remove("sel");
    selected = null;
    const vb = $(".btn", actionBox);
    if (vb) vb.disabled = false;
  }
  function validate(rd, grid) {
    const items = $$(".class-item", grid);
    let allCorrect = true;
    if (!answered) {
      allCorrect = items.every(b => b.parentElement.dataset.zone === rd.items.find(x => x.id === b.dataset.id).zone);
      session.addAnswer(allCorrect);
      answered = true;
      if (!allCorrect) firstTry = false;
    }
    let wrongCount = 0;
    items.forEach(b => {
      const it = rd.items.find(x => x.id === b.dataset.id);
      const ok = b.parentElement.dataset.zone === it.zone;
      b.classList.remove("good", "bad");
      b.classList.add(ok ? "good" : "bad");
      if (!ok) wrongCount++;
    });
    validated = true;
    if (wrongCount === 0) {
      solved++;
      session.setScore(session.score + (firstTry ? 100 : 60));
      const whys = rd.items.map(it => "• " + it.label + " → " + it.why).join("<br>");
      feedback.show("ok", "Classement correct (+" + (firstTry ? 100 : 60) + " pts)", "<p>" + whys + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= rounds.length ? "Terminer" : "Série suivante", () => {
        if (idx + 1 >= rounds.length) {
          session.finish({
            score: session.score, win: solved === rounds.length,
            title: solved === rounds.length ? "Architecture Flutter rangée" : "Série terminée",
            extras: [{ label: "Séries réussies", value: solved + "/" + rounds.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      items.forEach(b => {
        if (b.classList.contains("bad")) { b.classList.remove("bad"); wrap._pool.appendChild(b); }
        else lockedItems[b.dataset.id] = true;
      });
      feedback.show("ko", wrongCount + " élément(s) à corriger", "<p>Les éléments justes sont verrouillés. Replace les autres dans la bonne couche, puis revérifie.</p>");
      clearNode(actionBox);
      actionBox.appendChild(el("button", { class: "btn btn-flutter btn-block", onclick: () => { feedback.clear(); const vb = $(".btn", actionBox); if (vb) vb.disabled = false; } }, iconEl("rotate"), el("span", { text: "Corriger" })));
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

function makeCanvas() {
  const canvas = el("canvas", { class: "game", "aria-label": "Zone de jeu" });
  return canvas;
}
function setupHiDPI(canvas, w, h) {
  const dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.aspectRatio = w + " / " + h;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function buildDpad(onDir) {
  const dpad = el("div", { class: "dpad", "aria-label": "Commandes directionnelles" });
  const defs = [
    ["", "up", "Haut"], ["left", "left", "Gauche"], ["", "down", "Bas"], ["right", "right", "Droite"]
  ];
  const up = el("button", { "aria-label": "Haut", onclick: () => onDir("up") }); up.innerHTML = icon("arrowUp");
  const left = el("button", { "aria-label": "Gauche", onclick: () => onDir("left") }); left.innerHTML = icon("back");
  const down = el("button", { "aria-label": "Bas", onclick: () => onDir("down") }); down.innerHTML = icon("arrowDown");
  const right = el("button", { "aria-label": "Droite", onclick: () => onDir("right") }); right.innerHTML = icon("chevron");
  const center = el("div", {});
  dpad.appendChild(el("div", {})); dpad.appendChild(up); dpad.appendChild(el("div", {}));
  dpad.appendChild(left); dpad.appendChild(center); dpad.appendChild(right);
  dpad.appendChild(el("div", {})); dpad.appendChild(down); dpad.appendChild(el("div", {}));
  return dpad;
}
function attachSwipe(node, onDir) {
  let sx = 0, sy = 0, tracking = false;
  function start(e) { const t = e.changedTouches ? e.changedTouches[0] : e; sx = t.clientX; sy = t.clientY; tracking = true; }
  function end(e) {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    onDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }
  node.addEventListener("touchstart", start, { passive: true });
  node.addEventListener("touchend", end, { passive: true });
  return () => { node.removeEventListener("touchstart", start); node.removeEventListener("touchend", end); };
}

/* --- Serpent de code --- */
GAME_FACTORIES["snake"] = function (session) {
  const COLS = 16, ROWS = 20, OBJECTIF = 10;
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("target") + "<span>Objectif : " + OBJECTIF + " données</span>" }),
    el("span", { class: "grow" }),
    el("span", { class: "chip xp", html: icon("bolt") + "<span id='snake-n'>0</span>" })
  ]);
  const actionBox = el("div");
  session.body.appendChild(hud);
  session.body.appendChild(canvas);
  session.body.appendChild(actionBox);

  let ctx = null, cell = 24, snake = [], dir = { x: 0, y: -1 }, dirQueue = [], food = null, eaten = 0, rafId = null, last = 0, acc = 0, paused = false, over = false, detachSwipe = null;
  function cellSize() {
    const w = Math.min(session.body.clientWidth - 28 || 320, 460);
    cell = Math.max(14, Math.floor(w / COLS));
    ctx = setupHiDPI(canvas, cell * COLS, cell * ROWS);
  }
  function reset() {
    snake = [{ x: 8, y: 14 }, { x: 8, y: 15 }, { x: 8, y: 16 }];
    dir = { x: 0, y: -1 }; dirQueue = []; eaten = 0; over = false; paused = false; acc = 0;
    placeFood();
    session.setScore(0);
    session.setExtra("0/" + OBJECTIF);
    const n = $("#snake-n", hud); if (n) n.textContent = "0";
  }
  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function setDir(d) {
    const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const nd = map[d];
    if (!nd) return;
    const lastDir = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nd.x === -lastDir.x && nd.y === -lastDir.y) return; /* pas de demi-tour */
    if (nd.x === lastDir.x && nd.y === lastDir.y) return;
    if (dirQueue.length < 2) dirQueue.push(nd);
  }
  function stepInterval() { return Math.max(85, 175 - eaten * 8); }
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }
    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      eaten++;
      session.setScore(eaten * 50);
      session.setExtra(eaten + "/" + OBJECTIF);
      const n = $("#snake-n", hud); if (n) n.textContent = String(eaten);
      vibrate(10);
      if (eaten >= OBJECTIF) { placeFood(); endGame(); return; }
      placeFood();
    } else snake.pop();
  }
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#0B111C";
    ctx.fillRect(0, 0, cell * COLS, cell * ROWS);
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, ROWS * cell); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(COLS * cell, y * cell); ctx.stroke(); }
    if (food) {
      ctx.fillStyle = "#F59E0B";
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#67E8F9" : "#00D8FF";
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.45, 1 - i / (snake.length + 4));
      ctx.fillRect(s.x * cell + 1.5, s.y * cell + 1.5, cell - 3, cell - 3);
      ctx.globalAlpha = 1;
    });
  }
  function loop(t) {
    if (paused || over) return;
    if (!last) last = t;
    acc += t - last;
    last = t;
    const iv = stepInterval();
    while (acc >= iv) { acc -= iv; step(); if (over) break; }
    draw();
    if (!over) rafId = requestAnimationFrame(loop);
  }
  function endGame() {
    if (over) return;
    over = true;
    draw();
    session.finish({
      score: eaten * 50, win: eaten >= OBJECTIF,
      title: eaten >= OBJECTIF ? "Objectif atteint" : "Collision détectée",
      extras: [{ label: "Données mangées", value: eaten + "/" + OBJECTIF }]
    });
  }
  detachSwipe = attachSwipe(canvas, setDir);
  session.onCleanup(() => { if (detachSwipe) detachSwipe(); });
  return {
    start() {
      cellSize();
      reset();
      clearNode(actionBox);
      actionBox.appendChild(buildDpad(setDir));
      session.startClock();
      rafId = requestAnimationFrame(loop);
    },
    pause() { paused = true; if (rafId) cancelAnimationFrame(rafId); rafId = null; },
    resume() { if (over) return; paused = false; last = 0; rafId = requestAnimationFrame(loop); },
    destroy() { over = true; if (rafId) cancelAnimationFrame(rafId); }
  };
};

/* --- Casse-briques --- */
GAME_FACTORIES["breakout"] = function (session) {
  const W = 360, H = 480, COLS = 7, ROWS = 5, MAX_LEVEL = 3;
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("layers") + "<span id='bo-level'>Niveau 1</span>" }),
    el("span", { class: "chip", html: icon("shield") + "<span id='bo-lives'>3 vies</span>" }),
    el("span", { class: "grow" })
  ]);
  session.body.appendChild(hud);
  session.body.appendChild(canvas);

  let ctx = null, paddle, ball, bricks, lives, level, score = 0, rafId = null, paused = false, over = false, detachSwipe = null;
  function buildLevel() {
    bricks = [];
    const palette = ["#00D8FF", "#38BDF8", "#67E8F9", "#0EA5E9", "#F59E0B"];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (level === 3 && (r + c) % 3 === 0) continue; /* motifs plus denses */
        bricks.push({ x: c * (W / COLS) + 3, y: 40 + r * 22, w: W / COLS - 6, h: 16, alive: true, color: palette[r % palette.length] });
      }
    }
  }
  function resetBall() {
    paddle = { x: W / 2 - 38, w: 76, h: 10, y: H - 34 };
    const speed = 2.6 + level * 0.6;
    ball = { x: W / 2, y: H - 60, r: 6, vx: (Math.random() > 0.5 ? 1 : -1) * speed * 0.7, vy: -speed };
  }
  function updateHud() {
    const l1 = $("#bo-level", hud), l2 = $("#bo-lives", hud);
    if (l1) l1.textContent = "Niveau " + level;
    if (l2) l2.textContent = lives + " vie" + (lives > 1 ? "s" : "");
    session.setExtra("Niveau " + level);
  }
  function movePaddleTo(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
  }
  function tick() {
    /* déplacement par sous-pas : évite que la balle traverse les briques */
    const sub = 4;
    for (let i = 0; i < sub; i++) {
      ball.x += ball.vx / sub;
      ball.y += ball.vy / sub;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      /* raquette */
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 && ball.x >= paddle.x - 2 && ball.x <= paddle.x + paddle.w + 2) {
        ball.vy = -Math.abs(ball.vy);
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hit * 3.4;
      }
      /* briques */
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapY < overlapX) ball.vy = -ball.vy; else ball.vx = -ball.vx;
          score += 10 * level;
          session.setScore(score);
          vibrate(8);
          break;
        }
      }
    }
    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) { endGame(false); return; }
      resetBall();
    }
    if (!bricks.some(b => b.alive)) {
      if (level >= MAX_LEVEL) { endGame(true); return; }
      level++;
      buildLevel();
      resetBall();
      updateHud();
    }
  }
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#0B111C";
    ctx.fillRect(0, 0, W, H);
    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    ctx.fillStyle = "#F1F5F9";
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = "#F59E0B";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }
  function loop() {
    if (paused || over) return;
    tick();
    draw();
    if (!over) rafId = requestAnimationFrame(loop);
  }
  function endGame(win) {
    if (over) return;
    over = true;
    session.finish({
      score, win, title: win ? "Tous les murs sont tombés" : "Plus de vies",
      extras: [{ label: "Niveau atteint", value: String(level) }]
    });
  }
  const onMove = e => { if (e.touches && e.touches[0]) movePaddleTo(e.touches[0].clientX); else movePaddleTo(e.clientX); };
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("touchmove", e => { e.preventDefault(); onMove(e); }, { passive: false });
  canvas.addEventListener("touchstart", e => { if (e.touches[0]) movePaddleTo(e.touches[0].clientX); }, { passive: true });
  session.onCleanup(() => {
    canvas.removeEventListener("mousemove", onMove);
    canvas.removeEventListener("touchmove", onMove);
  });
  return {
    start() {
      ctx = setupHiDPI(canvas, W, H);
      level = 1; lives = 3; score = 0; over = false; paused = false;
      buildLevel(); resetBall(); updateHud();
      session.setScore(0);
      session.startClock();
      rafId = requestAnimationFrame(loop);
    },
    pause() { paused = true; if (rafId) cancelAnimationFrame(rafId); rafId = null; },
    resume() { if (over) return; paused = false; rafId = requestAnimationFrame(loop); },
    destroy() { over = true; if (rafId) cancelAnimationFrame(rafId); }
  };
};

/* --- Labyrinthe du code --- */
GAME_FACTORIES["maze"] = function (session) {
  const LEVELS_MAZE = [
    { id: "easy", label: "Facile", cols: 13, rows: 9, mult: 1 },
    { id: "medium", label: "Moyen", cols: 19, rows: 13, mult: 1.5 },
    { id: "hard", label: "Difficile", cols: 27, rows: 17, mult: 2.2 }
  ];
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("target") + "<span id='mz-moves'>0 pas</span>" }),
    el("span", { class: "grow" })
  ]);
  const actionBox = el("div");
  session.body.appendChild(hud);
  session.body.appendChild(canvas);
  session.body.appendChild(actionBox);

  let ctx = null, grid = null, cols = 0, rows = 0, cell = 20, player = null, exit = null, moves = 0, mult = 1, over = false, detachSwipe = null;
  function generate(c, r) {
    /* parcours en profondeur aléatoire : tous les labyrinthes sont résolubles */
    const g = new Array(r);
    for (let y = 0; y < r; y++) { g[y] = new Array(c).fill(0); }
    const stack = [{ x: 1, y: 1 }];
    g[1][1] = 1;
    const dirs = [{ x: 2, y: 0 }, { x: -2, y: 0 }, { x: 0, y: 2 }, { x: 0, y: -2 }];
    while (stack.length) {
      const cur = stack[stack.length - 1];
      const options = shuffle(dirs).filter(d => {
        const nx = cur.x + d.x, ny = cur.y + d.y;
        return nx > 0 && ny > 0 && nx < c - 1 && ny < r - 1 && g[ny][nx] === 0;
      });
      if (!options.length) { stack.pop(); continue; }
      const d = options[0];
      g[cur.y + d.y / 2][cur.x + d.x / 2] = 1;
      g[cur.y + d.y][cur.x + d.x] = 1;
      stack.push({ x: cur.x + d.x, y: cur.y + d.y });
    }
    return g;
  }
  function newMaze(config) {
    cols = config.cols | 1 ? config.cols : config.cols + 1;
    rows = config.rows;
    if (cols % 2 === 0) cols++;
    if (rows % 2 === 0) rows++;
    mult = config.mult;
    grid = generate(cols, rows);
    player = { x: 1, y: 1 };
    exit = { x: cols - 2, y: rows - 2 };
    moves = 0;
    resizeCanvas();
    draw();
    const m = $("#mz-moves", hud); if (m) m.textContent = "0 pas";
    session.setScore(0);
  }
  function resizeCanvas() {
    const w = Math.min(session.body.clientWidth - 28 || 320, 470);
    cell = Math.max(8, Math.floor(w / cols));
    ctx = setupHiDPI(canvas, cell * cols, cell * rows);
  }
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#0B111C";
    ctx.fillRect(0, 0, cell * cols, cell * rows);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (grid[y][x] === 0) {
          ctx.fillStyle = "#182131";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
    }
    ctx.fillStyle = "#10B981";
    ctx.fillRect(exit.x * cell + 2, exit.y * cell + 2, cell - 4, cell - 4);
    ctx.fillStyle = "#F59E0B";
    ctx.fillRect(player.x * cell + 2, player.y * cell + 2, cell - 4, cell - 4);
  }
  function tryMove(d) {
    if (over || !grid) return;
    const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const nd = map[d];
    const nx = player.x + nd.x, ny = player.y + nd.y;
    if (ny < 0 || nx < 0 || ny >= rows || nx >= cols || grid[ny][nx] === 0) { vibrate(6); return; }
    player.x = nx; player.y = ny;
    moves++;
    const m = $("#mz-moves", hud);
    if (m) m.textContent = moves + " pas";
    session.setScore(Math.max(0, Math.round((1000 - moves * 4 - Math.round(session.elapsed / 1000) * 3) * mult)));
    draw();
    if (player.x === exit.x && player.y === exit.y) {
      over = true;
      const finalScore = Math.max(50, Math.round((1200 - moves * 4 - Math.round(session.elapsed / 1000) * 3) * mult));
      session.finish({
        score: finalScore, win: true, title: "Sortie atteinte",
        extras: [{ label: "Pas", value: String(moves) }, { label: "Difficulté", value: LEVELS_MAZE.find(l => l.mult === mult).label }]
      });
    }
  }
  detachSwipe = attachSwipe(canvas, tryMove);
  session.onCleanup(() => { if (detachSwipe) detachSwipe(); });
  return {
    start() {
      clearNode(actionBox);
      canvas.style.display = "none";
      hud.style.display = "none";
      const intro = el("div", { class: "stack" }, [
        el("h2", { text: "Choisis la difficulté" }),
        el("p", { class: "card-sub", text: "Le labyrinthe est généré à la volée et toujours résoluble. Objectif : atteindre la case verte." })
      ]);
      LEVELS_MAZE.forEach(cfg => {
        intro.appendChild(el("button", {
          class: "lrow", onclick: () => {
            intro.remove();
            canvas.style.display = "";
            hud.style.display = "";
            newMaze(cfg);
            clearNode(actionBox);
            actionBox.appendChild(buildDpad(tryMove));
            session.startClock();
          }
        }, [
          el("span", { class: "ico-box", html: icon("compass") }),
          el("span", { class: "grow" }, [
            el("span", { class: "lrow-title", style: "display:block", text: cfg.label }),
            el("span", { class: "lrow-sub", style: "display:block", text: cfg.cols + " × " + cfg.rows + " cases · multiplicateur ×" + cfg.mult })
          ]),
          iconEl("chevron")
        ]));
      });
      session.body.insertBefore(intro, canvas);
      session.onCleanup(() => intro.remove());
    },
    pause() { },
    resume() { if (grid && !over) resizeCanvas(), draw(); },
    destroy() { over = true; }
  };
};

/* --- Course Tap-Tap --- */
GAME_FACTORIES["tap-race"] = function (session) {
  const DIST = 100;
  const RACERS = [
    { id: "you", name: "Toi", you: true, base: 0 },
    { id: "cpu1", name: "NullPointer", you: false, base: 0.62 },
    { id: "cpu2", name: "ForEach", you: false, base: 0.6 },
    { id: "cpu3", name: "AsyncAwait", you: false, base: 0.63 }
  ];
  const track = el("div", { class: "race-track", "aria-label": "Pistes de course" });
  const zones = el("div", { class: "tap-zones" });
  const intro = el("div", { class: "stack" });
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("clock") + "<span id='tr-time'>0.0 s</span>" }),
    el("span", { class: "grow" }),
    el("span", { class: "chip xp", html: icon("flag") + "<span>100 m</span>" })
  ]);
  session.body.appendChild(hud);
  session.body.appendChild(track);
  session.body.appendChild(zones);
  session.body.appendChild(intro);

  let racers = [], rafId = null, last = 0, running = false, over = false, elapsed = 0, lastZone = null, lastTapAt = 0;
  const laneRefs = {};
  function buildTrack() {
    clearNode(track);
    RACERS.forEach(r => {
      const fill = el("div", { class: "race-fill", style: "width:0%" });
      const ref = { fill };
      laneRefs[r.id] = ref;
      track.appendChild(el("div", { class: "race-lane" + (r.you ? " you" : "") }, [
        el("span", { class: "name", text: r.name }),
        el("span", { class: "race-bar" }, fill)
      ]));
    });
  }
  function startRace() {
    clearNode(intro);
    racers = RACERS.map(r => ({ ...r, pos: 0, speed: r.base }));
    elapsed = 0; lastZone = null; over = false; running = true;
    buildTrack();
    clearNode(zones);
    const zl = el("button", { class: "tap-zone", "aria-label": "Pousse gauche" }, iconEl("back"), el("span", { text: "Pousse gauche" }));
    const zr = el("button", { class: "tap-zone", "aria-label": "Pousse droite" }, iconEl("chevron"), el("span", { text: "Pousse droite" }));
    function tap(zone) {
      if (!running || over) return;
      const now = Date.now();
      if (now - lastTapAt < 70) return; /* anti-spam */
      lastTapAt = now;
      const you = racers[0];
      const alternating = lastZone !== zone;
      lastZone = zone;
      you.speed = Math.min(1.35, you.speed + (alternating ? 0.075 : 0.025));
      vibrate(6);
    }
    zl.addEventListener("click", () => tap("l"));
    zr.addEventListener("click", () => tap("r"));
    zones.appendChild(zl);
    zones.appendChild(zr);
    session.setScore(0);
    session.startClock();
    last = 0;
    rafId = requestAnimationFrame(loop);
  }
  function loop(t) {
    if (!running || over) return;
    if (!last) last = t;
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    elapsed += dt;
    const tEl = $("#tr-time", hud); if (tEl) tEl.textContent = elapsed.toFixed(1) + " s";
    racers.forEach((r, i) => {
      if (i === 0) {
        r.speed = Math.max(r.base + 0.32, r.speed - dt * 0.16); /* décélération sans tap */
        r.pos += r.speed * dt * 9;
      } else {
        const wobble = 1 + Math.sin(elapsed * (1.3 + i * 0.4)) * 0.06;
        r.pos += r.base * wobble * dt * 9;
      }
      const pct = clamp((r.pos / DIST) * 100, 0, 100);
      laneRefs[r.id].fill.style.width = pct + "%";
    });
    const finished = racers.filter(r => r.pos >= DIST);
    if (finished.length && (finished.includes(racers[0]) || racers.every(r => r.pos >= DIST))) { endRace(); return; }
    rafId = requestAnimationFrame(loop);
  }
  function endRace() {
    if (over) return;
    over = true;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    const ranked = racers.slice().sort((a, b) => b.pos - a.pos);
    const rank = ranked.findIndex(r => r.you) + 1;
    const score = (4 - rank) * 250 + Math.max(0, Math.round(300 - elapsed * 4));
    session.finish({
      score, win: rank === 1,
      title: rank === 1 ? "Victoire au sprint" : rank + "ᵉ place",
      extras: [{ label: "Place", value: rank + "/4" }, { label: "Temps", value: elapsed.toFixed(1) + " s" }]
    });
  }
  return {
    start() {
      clearNode(zones); clearNode(track);
      session.setExtra("100 m");
      intro.appendChild(el("h2", { text: "Course Tap-Tap" }));
      intro.appendChild(el("p", { class: "card-sub", text: "Frappe alternativement les deux zones pour accélérer. Sans tap, ton coureur ralentit : la course ne se gagne pas toute seule. Les concurrents accélèrent de façon équilibrée — la régularité fera la différence." }));
      intro.appendChild(el("button", { class: "btn btn-primary btn-block", style: "margin-top:10px", onclick: startRace }, iconEl("play"), el("span", { text: "Démarrer la course" })));
    },
    pause() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; },
    resume() { if (over || !racers.length) return; running = true; last = 0; rafId = requestAnimationFrame(loop); },
    destroy() { over = true; running = false; if (rafId) cancelAnimationFrame(rafId); }
  };
};

/* =========================================================================
   PWA : SERVICE WORKER, INSTALLATION, CONNECTIVITÉ
   ========================================================================= */
function safeBack() {
  if (history.length > 1) history.back();
  else Nav.go("#/home");
}
function registerServiceWorker() {
  if (typeof navigator === "undefined" || !("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return; /* hors contexte sécurisé : pas de Service Worker */
  navigator.serviceWorker.register("./sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener("statechange", () => {
        if (sw.state === "installed" && navigator.serviceWorker.controller) {
          toast("Mise à jour prête : recharge pour l'appliquer. Ta progression est préservée.", "info");
        }
      });
    });
  }).catch(err => {
    if (typeof console !== "undefined") console.warn("[DevMaster] Service Worker indisponible :", err && err.message);
  });
}
function bindInstallPrompt() {
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    /* on conserve l'invite pour le bouton du Profil, sans message répété */
    App.deferredInstall = e;
  });
  window.addEventListener("appinstalled", () => {
    App.deferredInstall = null;
    toast("DevMaster installé sur l'écran d'accueil.", "success");
  });
}
function bindNetwork() {
  window.addEventListener("online", () => { refreshNetChip(); toast("Connexion rétablie.", "success"); });
  window.addEventListener("offline", () => { refreshNetChip(); toast("Hors ligne : les jeux restent disponibles.", "info"); });
}

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
function initApp() {
  App.state = loadProgress();
  document.body.classList.toggle("reduced", !!(App.state.prefs.reducedFx || prefersReduced));
  Tracker.ensureDay();
  if (App.saveError) {
    toast("Sauvegarde locale illisible : un profil vierge a été chargé.", "error");
    saveProgress();
  }
  window.addEventListener("hashchange", Nav.render);
  bindNetwork();
  bindInstallPrompt();
  Nav.render();
  registerServiceWorker();
  Badges.check();
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
  else initApp();
}
