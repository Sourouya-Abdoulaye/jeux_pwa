<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DevMaster — Apprends React, Flutter, Django &amp; Docker</title>
<meta name="description" content="DevMaster : application d'apprentissage interactive pour maîtriser React.js et Flutter grâce à des mini-jeux, avec une bibliothèque de cours Flutter, Django, Docker et ReactJS issue des supports PDF. Fonctionne hors ligne, sur mobile comme sur le web.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#F3F6FC; --bg2:#E9EEF8; --surface:#FFFFFF; --surface2:#F1F5FB;
  --border:#DBE3F1; --border-active:#B9C6DC;
  --text:#0B1220; --text2:#46566E; --text3:#6B7C93;
  --react:#2563EB; --react2:#3B82F6; --flutter:#0EA5E9; --flutter2:#38BDF8;
  --success:#059669; --error:#E11D48; --xp:#D97706;
  --r:14px; --r-sm:10px; --nav-h:62px; --top-h:56px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
/* taille par défaut des icônes : tout SVG sans largeur explicite reste compact
   (les règles par composant, écrites ensuite, continuent de prédominer) */
svg:not([width]){width:18px;height:18px;flex:none}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
#app{width:100%;max-width:100%;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#view{flex:1;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));outline:none}
body.in-game #bottomnav{display:none}
body.in-game .topbar{display:none}
body.in-game #view{padding:0 0 12px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:clamp(24px,1.4vw + 19px,30px);line-height:1.2}
h2{font-size:17px}
h3{font-size:14.5px}
p{margin:0}
a{color:var(--react2)}
button{font-family:inherit;font-size:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.86em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,#E4EDFF,#FFFFFF);border:1px solid rgba(37,99,235,.35);display:grid;place-items:center;color:var(--react);font-family:var(--mono);font-size:12px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.net-dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:3px 8px}
.net-dot svg{width:13px;height:13px}
.net-dot.off{color:var(--xp);border-color:rgba(245,158,11,.35)}
.avatar-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-active);background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar{width:24px;height:24px;display:block}
/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-inner{display:flex;width:100%;max-width:560px}
.nav-item{
  flex:1;min-height:var(--nav-h);background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text3);font-size:11px;font-weight:550;padding:6px 2px;position:relative;
}
.nav-item svg{width:21px;height:21px}
.nav-item.active{color:var(--react)}
.nav-item.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;background:var(--react)}
/* ---------- generic ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;transition:border-color .15s ease, transform .12s ease;
}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap:hover{border-color:var(--border-active)}
.card.tap:active{transform:scale(.99)}
.card-title{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--text2)}
.card-sub{font-size:12.5px;color:var(--text2);margin-top:3px}
.meta{font-size:11.5px;color:var(--text3)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.section-title{font-size:12px;font-weight:650;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:6px 2px}
.divider{height:1px;background:var(--border);border:0;margin:2px 0}
/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 16px;border-radius:var(--r-sm);cursor:pointer;
  border:1px solid var(--border-active);background:var(--surface2);color:var(--text);
  font-weight:600;font-size:14px;text-decoration:none;transition:background .15s ease,border-color .15s ease,transform .1s ease;
}
.btn svg{width:17px;height:17px}
.btn:hover{background:#E3EAF6}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--react);outline-offset:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{
  background:linear-gradient(180deg,#3B82F6 0%,#2563EB 100%);border-color:#2563EB;color:#FFFFFF;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 8px 20px -12px rgba(37,99,235,.55);
}
.btn-primary:hover{background:linear-gradient(180deg,#4F8EF7 0%,#2F6FE8 100%);border-color:#2F6FE8}
.btn-flutter{
  background:linear-gradient(180deg,#38BDF8 0%,#0284C7 100%);border-color:#0EA5E9;color:#FFFFFF;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 8px 20px -12px rgba(14,165,233,.5);
}
.btn-flutter:hover{background:linear-gradient(180deg,#4EC3F9 0%,#0696D9 100%);border-color:#38BDF8}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-danger{background:transparent;border-color:rgba(225,29,72,.45);color:#E11D48}
.btn-danger:hover{background:rgba(225,29,72,.1)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn-icon{min-width:44px;padding:0 10px}
/* chips, badges */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:3px 9px;background:var(--bg2)}
.chip svg{width:13px;height:13px}
.chip.react{color:var(--react2);border-color:rgba(0,216,255,.3)}
.chip.flutter{color:var(--flutter2);border-color:rgba(56,189,248,.3)}
.chip.xp{color:var(--xp);border-color:rgba(245,158,11,.35)}
.chip.ok{color:var(--success);border-color:rgba(16,185,129,.35)}
.chip.ko{color:#E11D48;border-color:rgba(225,29,72,.35)}
.badge-ico{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:700}
/* progress */
.progress{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;border-radius:99px;background:var(--react);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-fill.flutter{background:var(--flutter2)}
.progress-fill.xp{background:var(--xp)}
.progress-fill.ok{background:var(--success)}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;text-align:center}
.stat-value{font-size:16px;font-weight:700;letter-spacing:-.02em}
.stat-label{font-size:10.5px;color:var(--text3);margin-top:1px}
/* forms */
label.field{display:block;font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:6px}
.input,textarea.input{
  width:100%;min-height:44px;background:var(--bg2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;
}
.input:focus{outline:2px solid var(--react);outline-offset:1px}
textarea.input{min-height:110px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.switch-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--border-active);transition:background .15s ease}
.slider::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text3);transition:transform .15s ease, background .15s ease}
.switch input:checked + .slider{background:rgba(0,216,255,.25);border-color:var(--react)}
.switch input:checked + .slider::after{transform:translateX(19px);background:var(--react)}
.switch input:focus-visible + .slider{outline:2px solid var(--react);outline-offset:2px}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s ease}
.lrow:hover{border-color:var(--border-active)}
.lrow .ico-box{width:38px;height:38px;flex:none;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;color:var(--text2)}
.lrow .ico-box svg{width:19px;height:19px}
.lrow>svg{color:var(--text3);flex:none}
.lrow-title{font-size:14px;font-weight:650}
.lrow-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
/* ---------- game shell ---------- */
.game-shell{display:flex;flex-direction:column;min-height:100dvh}
.game-head{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.game-head .title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-btn{min-width:44px;min-height:44px;display:grid;place-items:center;background:none;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;color:var(--text2)}
.head-btn svg{width:19px;height:19px}
.head-btn:hover{color:var(--text);border-color:var(--border-active)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 10px;color:var(--text)}
.pill svg{width:13px;height:13px;color:var(--text3)}
.game-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
/* code blocks / pre */
pre.code{
  background:#0B111C;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px;overflow-x:auto;margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#D7E3F4;
}
.code .k{color:#C084FC}.code .s{color:#86EFAC}.code .c{color:#8FA3BD}.code .t{color:#60A5FA}
/* ordering puzzle */
.order-list{display:flex;flex-direction:column;gap:8px;min-height:70px;border:1px dashed var(--border-active);border-radius:var(--r-sm);padding:9px;background:rgba(37,99,235,.04)}
.order-item{
  display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);padding:9px 10px;font-family:var(--mono);font-size:12.5px;line-height:1.45;
}
.order-item .txt{flex:1;min-width:0;word-break:break-word}
.order-item.used{opacity:.35;pointer-events:none}
.mini-btn{min-width:34px;min-height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text2);padding:0}
.mini-btn:hover{color:var(--text);border-color:var(--border-active)}
.mini-btn svg{width:15px;height:15px}
.mini-btn.danger:hover{color:#E11D48;border-color:rgba(225,29,72,.4)}
/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem-card{aspect-ratio:.78;perspective:800px;background:none;border:0;padding:0;cursor:pointer}
.mem-inner{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.mem-card.flipped .mem-inner,.mem-card.matched .mem-inner{transform:rotateY(180deg)}
.mem-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);
  display:grid;place-items:center;padding:6px;text-align:center;
}
.mem-face.front{color:var(--text3);font-family:var(--mono);font-weight:700;font-size:15px}
.mem-face.back{transform:rotateY(180deg);background:var(--surface);border-color:rgba(0,216,255,.35);font-size:10.5px;line-height:1.3;font-weight:600;color:var(--text)}
.mem-card.matched .mem-face.back{border-color:rgba(16,185,129,.5);color:var(--success)}
/* feedback */
.feedback{border-radius:var(--r-sm);border:1px solid var(--border);padding:11px 12px;font-size:13px;line-height:1.5}
.feedback.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.feedback.ko{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.07)}
.feedback.info{background:var(--bg2);color:var(--text2)}
.feedback .fb-title{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:13px}
.feedback .fb-title svg{width:15px;height:15px}
.feedback.ok .fb-title{color:var(--success)}
.feedback.ko .fb-title{color:#E11D48}
/* choice buttons */
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);padding:12px;cursor:pointer;font-size:14px;font-weight:550;color:inherit;
  display:flex;align-items:center;gap:10px;transition:border-color .15s ease,background .15s ease;
}
.choice:hover{border-color:var(--react)}
.choice:disabled{cursor:default}
.choice .key{width:24px;height:24px;flex:none;border-radius:7px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text3)}
.choice.good{border-color:rgba(16,185,129,.55);background:rgba(16,185,129,.1)}
.choice.bad{border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.08)}
.choice.good .key{color:var(--success);border-color:rgba(16,185,129,.5)}
.choice.bad .key{color:#E11D48;border-color:rgba(225,29,72,.5)}
/* two big buttons (vrai/faux, stateful/stateless) */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .btn{min-height:62px;font-size:15px;flex-direction:column;gap:4px}
.duo .btn svg{width:20px;height:20px}
/* targets */
.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target{
  min-height:66px;border-radius:var(--r);border:1px solid var(--border-active);background:var(--surface2);
  cursor:pointer;font-family:var(--mono);font-size:13.5px;font-weight:650;color:var(--text);
  display:grid;place-items:center;padding:10px;text-align:center;transition:transform .12s ease;
}
.target:active{transform:scale(.97)}
.target.good{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.12);color:var(--success)}
.target.bad{border-color:rgba(225,29,72,.55);background:rgba(225,29,72,.08);color:#E11D48}
/* flow / tree */
.tree{display:flex;flex-direction:column;gap:4px}
.tree-node{
  display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;font-family:var(--mono);font-size:13px;color:inherit;width:100%;text-align:left;
  transition:border-color .15s ease,background .15s ease;
}
.tree-node:hover{border-color:var(--border-active)}
.tree-node.selected{border-color:var(--react);background:rgba(37,99,235,.08)}
.tree-node.visited{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
.tree-node .val{margin-left:auto;font-size:11px;color:var(--xp);font-weight:600}
/* classification */
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.class-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:7px}
.class-col h4{margin:0 0 2px;font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.class-item{
  background:var(--surface2);border:1px solid var(--border-active);border-radius:9px;padding:7px 9px;
  font-size:11.5px;font-family:var(--mono);cursor:pointer;color:inherit;text-align:left;line-height:1.35;
}
.class-item.sel{border-color:var(--react);background:rgba(37,99,235,.09)}
.class-item.good{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.1)}
.class-item.bad{border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.08)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
/* decision (swipe) */
.dec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;touch-action:pan-y}
.swipe-hint{display:flex;justify-content:center;gap:8px;color:var(--text3);font-size:11px;align-items:center}
.swipe-hint svg{width:14px;height:14px}
/* result overlay */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,9,14,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}
.result{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border-active);
  border-radius:18px;padding:20px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2);text-align:center;
}
.result .r-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;border:1px solid var(--border)}
.result .r-icon.win{color:var(--success);border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.1)}
.result .r-icon.lose{color:var(--xp);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.result .r-icon svg{width:26px;height:26px}
.result h2{font-size:19px}
.result .r-score{font-family:var(--mono);font-size:30px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em}
.r-rows{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left}
.r-row{display:flex;justify-content:space-between;font-size:13px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.r-row span:first-child{color:var(--text2)}
.r-row b{font-family:var(--mono)}
/* toasts */
#toasts{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{
  background:var(--surface2);border:1px solid var(--border-active);border-radius:var(--r-sm);
  padding:10px 13px;font-size:13px;display:flex;align-items:center;gap:9px;
  animation:slidein .22s ease;box-shadow:0 8px 24px rgba(11,18,32,.16);
}
.toast svg{width:17px;height:17px;flex:none}
.toast.success{border-color:rgba(16,185,129,.45)}.toast.success svg{color:var(--success)}
.toast.error{border-color:rgba(225,29,72,.5)}.toast.error svg{color:#E11D48}
.toast.xp{border-color:rgba(245,158,11,.5)}.toast.xp svg{color:var(--xp)}
/* modal */
.modal-backdrop{position:fixed;inset:0;z-index:70;background:rgba(6,9,14,.72);backdrop-filter:blur(4px);display:grid;place-items:end center;padding:0}
@media(min-width:560px){.modal-backdrop{place-items:center}}
.modal{
  width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--border-active);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideup .24s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:560px){.modal{border-radius:18px;padding-bottom:18px}}
.modal h2{margin-bottom:6px}
.modal-actions{display:flex;gap:9px;margin-top:16px}
.modal-actions .btn{flex:1}
/* level up */
.levelup{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.levelup svg{width:34px;height:34px}
.levelup .lvl-title{font-size:22px;font-weight:750;background:linear-gradient(90deg,#B45309,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
/* game-specific */
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,54px);gap:6px;justify-content:center;margin-top:6px}
.dpad button{border-radius:12px;border:1px solid var(--border-active);background:var(--surface2);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.dpad button:active{background:rgba(37,99,235,.12);color:var(--text)}
.dpad button svg{width:22px;height:22px}
canvas.game{width:100%;max-width:520px;margin:0 auto;display:block;border-radius:var(--r-sm);border:1px solid var(--border);background:#0B111C;touch-action:none}
.quiz-progress{margin-top:2px}
.quiz-progress .meta{display:flex;justify-content:space-between;margin-bottom:5px}
.lesson{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(11,18,32,.05),0 10px 24px -18px rgba(11,18,32,.35);overflow:hidden}
.lesson>summary{cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:11px;list-style:none;font-weight:700;font-size:14px;user-select:none}
.lesson>summary::-webkit-details-marker{display:none}
.lesson>summary .ico-box{flex:none}
.lesson>summary .chev{margin-left:auto;color:var(--text3);transition:transform .18s ease}
.lesson[open]>summary .chev{transform:rotate(90deg)}
.lesson-body{padding:0 14px 14px;border-top:1px solid var(--border);margin-top:0}
.lesson-body p{font-size:13px;color:var(--text2);line-height:1.6}
.lesson-body ul{margin:7px 0 0;padding-left:18px;font-size:13px;color:var(--text2);line-height:1.6}
.lesson-body li{margin-bottom:4px}
.lesson-body .k{color:var(--react);font-weight:650}
.lesson-body pre.code{margin-top:10px;font-size:11.5px}
.lesson-tip{margin-top:10px;border-left:3px solid var(--xp);background:rgba(245,158,11,.08);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12px;color:var(--text2)}
.course-hero{background:linear-gradient(135deg,#0C4A6E,#0284C7 55%,#38BDF8);color:#fff;border:0;box-shadow:0 18px 40px -22px rgba(2,132,199,.9)}
.course-hero.t-django{background:linear-gradient(135deg,#052E22,#0C4B33 55%,#44B78B);box-shadow:0 18px 40px -22px rgba(12,75,51,.9)}
.course-hero.t-docker{background:linear-gradient(135deg,#082F49,#1D63ED 55%,#2496ED);box-shadow:0 18px 40px -22px rgba(29,99,237,.9)}
.course-hero.t-react{background:linear-gradient(135deg,#1E3A8A,#2563EB 55%,#60A5FA);box-shadow:0 18px 40px -22px rgba(37,99,235,.9)}
.course-hero .card-sub{color:rgba(255,255,255,.86)}
.course-hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:none}
.course-hero .btn-primary{background:#fff;border-color:#fff;color:#0369A1}
.course-hero .btn-primary:hover{background:#F0F9FF;border-color:#F0F9FF}
.course-hero.t-django .btn-primary{color:#0C4B33}
.course-hero.t-docker .btn-primary{color:#0847A8}
.course-hero.t-react .btn-primary{color:#1E3A8A}
/* Onglets de la bibliothèque de cours */
.course-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.course-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;box-shadow:0 1px 2px rgba(11,18,32,.05);scroll-snap-align:start;transition:background .15s ease,border-color .15s ease,color .15s ease}
.course-tab svg{width:15px;height:15px}
.course-tab:hover{border-color:var(--border-active)}
.course-tab .ct-count{font-size:10.5px;font-weight:700;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:1px 6px}
.course-tab.active{color:#0369A1;background:#F0F9FF;border-color:#BAE6FD}
.course-tab.active .ct-count{color:#0369A1;background:#FFFFFF;border-color:#BAE6FD}
.course-tab.t-django.active{color:#0C4B33;background:#ECFDF5;border-color:#A7F3D0}
.course-tab.t-django.active .ct-count{color:#0C4B33;border-color:#A7F3D0}
.course-tab.t-docker.active{color:#0847A8;background:#EFF6FF;border-color:#BFDBFE}
.course-tab.t-docker.active .ct-count{color:#0847A8;border-color:#BFDBFE}
.course-tab.t-react.active{color:#1E3A8A;background:#EFF6FF;border-color:#BFDBFE}
.course-tab.t-react.active .ct-count{color:#1E3A8A;border-color:#BFDBFE}
.pdf-card{border-color:#BAE6FD;background:linear-gradient(150deg,#FFFFFF 45%,#F0F9FF)}
.pdf-card .card-title{color:#0369A1}
/* quiz : options en grille sur grand écran */
.answer-grid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:760px){.answer-grid{grid-template-columns:1fr 1fr}.answer-grid .choice{min-height:64px}}
/* plateau arcade : aide clavier */
.key-hint{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.key-hint kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface2);border:1px solid var(--border-active);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text2)}
/* badges */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.badge-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;display:flex;gap:9px;align-items:flex-start}
.badge-card.locked{opacity:.5}
.badge-card .b-ico{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);color:var(--xp)}
.badge-card .b-ico svg{width:16px;height:16px}
/* streak days */
.days{display:flex;gap:6px}
.day{flex:1;text-align:center;font-size:10px;color:var(--text3)}
.day .d-dot{height:26px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:3px;color:var(--text3)}
.day .d-dot svg{width:14px;height:14px}
.day.on .d-dot{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45);color:var(--xp)}
.day.today .d-dot{outline:1px solid var(--border-active)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slidein{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
}
body.reduced *,body.reduced *::before,body.reduced *::after{animation-duration:.001s !important;transition-duration:.001s !important}

/* ---------- look jeu pro : cartes vivantes, couleurs par univers, profondeur ---------- */
.card{border-radius:18px;box-shadow:0 1px 2px rgba(11,18,32,.05),0 10px 24px -18px rgba(11,18,32,.35)}
.card.tap{transition:transform .12s ease,box-shadow .18s ease,border-color .18s ease}
.card.tap:active{transform:scale(.98)}
.lrow{box-shadow:0 1px 2px rgba(11,18,32,.04);transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease}
.lrow:active{transform:scale(.985);box-shadow:0 4px 12px -6px rgba(11,18,32,.3)}
/* univers : palette propre par univers */
.u-react{--ua:#2563EB;--ub:#60A5FA;--utint:#EFF6FF;--uborder:#BFDBFE}
.u-flutter{--ua:#0284C7;--ub:#38BDF8;--utint:#F0F9FF;--uborder:#BAE6FD}
.u-arcade{--ua:#D97706;--ub:#FBBF24;--utint:#FFFBEB;--uborder:#FDE68A}
.u-react .ico-box,.u-flutter .ico-box,.u-arcade .ico-box{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--uborder);display:grid;place-items:center;color:var(--ua);background:var(--utint)}
.u-react .ico-box svg,.u-flutter .ico-box svg,.u-arcade .ico-box svg{width:20px;height:20px}
.uni-card{position:relative;overflow:hidden;text-align:left}
.uni-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--ua),var(--ub))}
.uni-card .card-title{margin-top:4px}
.uni-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#FFFFFF 35%,var(--utint));border-color:var(--uborder)}
.uni-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--ua),var(--ub))}
.uni-hero .ico-box{background:linear-gradient(150deg,var(--ua),var(--ub));border:0;color:#fff;box-shadow:0 6px 16px -8px var(--ua)}
.game-card .ico-box{width:36px;height:36px;border-radius:11px}
.game-card .ico-box svg{width:18px;height:18px}
/* carte niveau : or */
.lvl-card{background:linear-gradient(150deg,#FFFFFF 55%,#FFF8E7);border-color:#FDE68A}
.lvl-card .chip.xp{box-shadow:0 6px 16px -8px rgba(217,119,6,.7)}
/* carte recommandée : teinte du jeu */
.rec-card{border-color:var(--uborder);background:linear-gradient(150deg,#FFFFFF 40%,var(--utint))}
/* statistiques : chiffres bleus */
.stat{background:linear-gradient(180deg,#FFFFFF,#F7FAFF);border-color:#E3EAF6;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.stat-value{color:#1D4ED8}
/* navigation : pastille active façon console */
.nav-ico{display:grid;place-items:center;width:58px;height:28px;border-radius:99px;transition:background .18s ease}
.nav-item.active .nav-ico{background:rgba(37,99,235,.13)}
.nav-item.active::before{display:none}
/* titres de section : puce dégradée */
.section-title{display:flex;align-items:center;gap:7px}
.section-title::before{content:"";width:8px;height:8px;border-radius:3px;flex:none;background:linear-gradient(135deg,var(--react),var(--flutter2))}
/* boutons 3D (effet enfoncé) */
.btn{box-shadow:0 2px 0 rgba(11,18,32,.1)}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:none}
.btn-primary{box-shadow:0 3px 0 #1D4ED8,0 14px 26px -16px rgba(37,99,235,.9)}
.btn-flutter{box-shadow:0 3px 0 #0369A1,0 14px 26px -16px rgba(2,132,199,.9)}
.btn-arcade{background:linear-gradient(180deg,#FBBF24 0%,#D97706 100%);border-color:#D97706;color:#FFFFFF;box-shadow:0 3px 0 #B45309,0 14px 26px -16px rgba(217,119,6,.9)}
.btn-arcade:hover{background:linear-gradient(180deg,#FCC648 0%,#E0870B 100%);border-color:#F59E0B}
/* chips teintées par univers */
.chip.react{color:#1D4ED8;border-color:#BFDBFE;background:#EFF6FF}
.chip.flutter{color:#0369A1;border-color:#BAE6FD;background:#F0F9FF}
.chip.amusement{color:#B45309;border-color:#FDE68A;background:#FFFBEB}
/* bannière d'introduction de jeu */
.gi-banner{display:flex;align-items:center;gap:12px;border-radius:16px;padding:13px 14px;color:#fff;background:linear-gradient(135deg,#2563EB,#60A5FA);box-shadow:0 14px 30px -18px rgba(37,99,235,1)}
.gi-banner.u-flutter{background:linear-gradient(135deg,#0284C7,#38BDF8);box-shadow:0 14px 30px -18px rgba(2,132,199,1)}
.gi-banner.u-arcade{background:linear-gradient(135deg,#D97706,#FBBF24);box-shadow:0 14px 30px -18px rgba(217,119,6,1)}
.gi-ico{width:44px;height:44px;flex:none;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.gi-ico svg{width:23px;height:23px;color:#fff}
.gi-title{font-weight:750;font-size:15px;letter-spacing:-.01em}
.gi-sub{font-size:12px;opacity:.88}
/* écran de résultat : halo vert (victoire) / ambre (défaite) */
.result.win{border-color:rgba(16,185,129,.5);box-shadow:0 0 0 1px rgba(16,185,129,.18),0 36px 70px -30px rgba(16,185,129,.75)}
.result.lose{border-color:rgba(217,119,6,.5);box-shadow:0 0 0 1px rgba(217,119,6,.18),0 36px 70px -30px rgba(217,119,6,.7)}
.result.win .r-score{color:var(--success)}
.result.lose .r-score{color:var(--xp)}
/* D-pad arcade : boutons matériel */
.dpad button{background:linear-gradient(180deg,#FFFFFF,#EDF2FB);box-shadow:0 2px 0 var(--border-active)}
.dpad button:active{transform:translateY(1px);box-shadow:none;background:rgba(37,99,235,.12)}
/* badges : carte or */
.badge-card{background:linear-gradient(180deg,#FFFFFF,#FFFBEB);border-color:#FDE68A}
.badge-card.locked{background:var(--bg2);border-color:var(--border)}
/* =======================================================================
   ACCESSIBILITÉ, MOBILE, TABLETTE & DESKTOP
   ======================================================================= */
button,.card.tap,.choice,.target,.tree-node,.class-item,.mem-card,.lesson>summary{touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,.input:focus-visible{outline:2px solid var(--react);outline-offset:2px}
.overlay{overflow:auto;overscroll-behavior:contain}
.result{max-height:92dvh;overflow-y:auto}
.game-body{width:100%;max-width:900px;margin:0 auto}
.game-head .title{min-width:0}
.nav-brand{display:none}

/* Les grandes sections restent empilées sur téléphone. */
.home-layout,.explorer-layout,.progression-layout,.course-grid{display:flex;flex-direction:column;gap:14px}
.home-main,.home-side,.prog-main,.prog-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.prog-side .badge-grid{grid-template-columns:1fr 1fr}
.profile-wrap{max-width:820px;margin:0 auto;width:100%}
.course-grid{gap:12px}
.course-grid .lesson{break-inside:avoid}

/* Bandeau cours de l'accueil : actions toujours lisibles, même à 320 px. */
.course-strip{
  display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"ico txt" "actions actions";
  gap:10px 12px;align-items:start;
  margin-top:14px;border-color:#BAE6FD;background:linear-gradient(120deg,#FFFFFF 50%,#EFF8FF);
}
.course-strip-ico{grid-area:ico;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(140deg,#0284C7,#38BDF8);color:#fff;box-shadow:0 8px 18px -8px rgba(2,132,199,.8)}
.course-strip-ico svg{width:22px;height:22px}
.course-strip>.grow{grid-area:txt;min-width:0}
.course-strip-actions{grid-area:actions;display:flex;gap:8px;flex-wrap:wrap;width:100%}
.course-strip-actions .btn{flex:1 1 140px}
.course-strip .card-title{display:inline}
.course-strip-actions .btn svg,.course-hero>.row.wrap .btn svg{width:17px;height:17px}

/* Héros du cours : texte large, boutons sur leur propre ligne en mobile. */
.course-hero{
  display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"ico txt" "actions actions";
  gap:12px 14px;align-items:start;
}
.course-hero .course-hico{grid-area:ico;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.course-hero .course-hico svg{width:26px;height:26px}
.course-hero>.grow{grid-area:txt;min-width:0}
.course-hero>.row.wrap{grid-area:actions;width:100%;gap:8px}
.course-hero>.row.wrap .btn{flex:1 1 150px}
.tip-card{background:linear-gradient(150deg,#FFFFFF,#FFFBEB);border-color:#FDE68A}
.lesson-body code.inline{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 4px;color:#0C4A6E;white-space:normal;overflow-wrap:anywhere}
.lesson-body pre.code{white-space:pre;overflow:auto;max-height:280px}

/* Cartes de jeu : structure commune, bouton toujours en bas. */
.games-grid{display:flex;flex-direction:column;gap:9px}
.games-grid .game-card{display:flex;flex-direction:column}
.games-grid .game-card>.row.wrap{margin-top:auto}
.mem-grid{grid-template-columns:repeat(4,1fr)}

/* Améliorations de confort sur les écrans tactiles. */
@media(max-width:639.98px){
  #view{padding-left:16px;padding-right:16px}
  .topbar{padding-left:16px;padding-right:16px}
  .bottom-nav{box-shadow:0 -12px 30px -24px rgba(11,18,32,.45)}
  .card{padding:14px}
  .course-strip{gap:9px 11px}
  .course-strip-actions .btn,.course-hero>.row.wrap .btn{min-height:42px;font-size:13.5px}
  .game-head{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"back title pause" "extra score time";
    gap:6px 8px;align-items:center;padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));
  }
  .game-head>button[aria-label="Quitter le jeu"]{grid-area:back}
  .game-head .title{grid-area:title;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .game-head .pill.extra{grid-area:extra;justify-self:start}
  .game-head .pill.score{grid-area:score;justify-self:end}
  .game-head .pill.time{grid-area:time;justify-self:end}
  .game-head>button[aria-label="Pause"]{grid-area:pause}
  .game-body{padding:12px 14px 20px;gap:11px}
  .section-title{margin-top:8px}
  .stat-grid{gap:7px}
}

/* Téléphones étroits : on serre sans jamais couper le contenu. */
@media(max-width:420px){
  .nav-item{font-size:10px}
  .game-head{gap:5px 6px;padding-left:10px;padding-right:10px}
  .game-head .pill{padding:4px 7px;font-size:10.5px}
  .game-head .title{font-size:12.5px}
  .result{padding:16px}
  .mem-face.back{font-size:9.5px}
  .course-strip-actions .btn,.course-hero>.row.wrap .btn{flex:1 1 100%}
}
@media(max-width:360px){
  .nav-item{font-size:9.5px;gap:1px;padding-left:0;padding-right:0}
  .nav-item svg{width:19px;height:19px}
  .dpad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px)}
  .brand{font-size:14px}
}

function levelInfo(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].xp) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  const span = next ? next.xp - cur.xp : 1;
  const into = xp - cur.xp;
  return {
    index: idx + 1, title: cur.title, nextTitle: next ? next.title : null,
    nextXp: next ? next.xp : null, needed: next ? next.xp - xp : 0,
    pct: next ? clamp((into / span) * 100, 0, 100) : 100, isMax: !next
  };
}

function isPlainObject(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
function sanitizeState(raw) {
  if (!isPlainObject(raw)) return null;
  if (typeof raw.version !== "number" || raw.version > SAVE_VERSION) return null;
  const st = defaultState();
  if (isPlainObject(raw.profile)) {
    st.profile.pseudonym = typeof raw.profile.pseudonym === "string" ? raw.profile.pseudonym.slice(0, 24) : "";
    st.profile.avatar = clamp(Number(raw.profile.avatar) || 0, 0, AVATARS.length - 1);
  }
  st.xp = Math.max(0, Math.floor(Number(raw.xp) || 0));
  if (Array.isArray(raw.badges)) st.badges = raw.badges.filter(b => typeof b === "string").slice(0, 100);
  if (Array.isArray(raw.firstBonus)) st.firstBonus = raw.firstBonus.filter(b => typeof b === "string" && GAME_IDS.includes(b));
  if (isPlainObject(raw.records)) {
    for (const k of Object.keys(raw.records)) {
      if (!GAME_IDS.includes(k)) continue;
      const r = raw.records[k];
      if (isPlainObject(r) && typeof r.score === "number" && r.score >= 0) {
        st.records[k] = { score: Math.floor(r.score), date: typeof r.date === "string" ? r.date : "", mode: r.mode === "time" ? "time" : "score" };
      }
    }
  }
  if (Array.isArray(raw.runs)) {
    st.runs = raw.runs.filter(r => isPlainObject(r) && typeof r.gameId === "string" && GAME_IDS.includes(r.gameId)).slice(-120);
  }
  if (isPlainObject(raw.stats)) {
    const s = raw.stats;
    ["started", "finished", "wins", "abandoned"].forEach(k => {
      if (isPlainObject(s[k])) for (const g of Object.keys(s[k])) if (GAME_IDS.includes(g)) st.stats[k][g] = Math.max(0, Math.floor(Number(s[k][g]) || 0));
    });
    if (isPlainObject(s.answers)) ["react", "flutter"].forEach(u => {
      const a = s.answers[u];
      if (isPlainObject(a)) st.stats.answers[u] = { c: Math.max(0, Math.floor(Number(a.c) || 0)), t: Math.max(0, Math.floor(Number(a.t) || 0)) };
    });
    if (isPlainObject(s.perGame)) for (const g of Object.keys(s.perGame)) {
      if (!GAME_IDS.includes(g)) continue;
      const p = s.perGame[g];
      if (isPlainObject(p)) st.stats.perGame[g] = { plays: Math.max(0, Math.floor(Number(p.plays) || 0)), wins: Math.max(0, Math.floor(Number(p.wins) || 0)), best: Math.max(0, Number(p.best) || 0) };
    }
    if (isPlainObject(s.arcade)) st.stats.arcade = { runs: Math.max(0, Math.floor(Number(s.arcade.runs) || 0)), wins: Math.max(0, Math.floor(Number(s.arcade.wins) || 0)) };
  }
  if (isPlainObject(raw.challenges)) {
    st.challenges.date = typeof raw.challenges.date === "string" ? raw.challenges.date : "";
    if (isPlainObject(raw.challenges.progress)) for (const k of Object.keys(raw.challenges.progress)) st.challenges.progress[k] = Math.max(0, Math.floor(Number(raw.challenges.progress[k]) || 0));
  }
  if (Array.isArray(raw.activeDays)) st.activeDays = raw.activeDays.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().slice(-400);
  st.lastDomain = DOMAINS[raw.lastDomain] ? raw.lastDomain : null;
  st.lastGame = GAMES[raw.lastGame] ? raw.lastGame : null;
  if (isPlainObject(raw.prefs)) {
    st.prefs.vibration = raw.prefs.vibration !== false;
    st.prefs.reducedFx = raw.prefs.reducedFx === true;
  }
  if (isPlainObject(raw.meta)) st.meta = { createdAt: Number(raw.meta.createdAt) || Date.now(), updatedAt: Number(raw.meta.updatedAt) || Date.now() };
  return st;
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const clean = sanitizeState(parsed);
    if (!clean) { App.saveError = true; return defaultState(); }

  } catch (e) { App.saveError = true; return defaultState(); }
}
function saveProgress() {

function importProgress(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { ok: false, error: "Le fichier n'est pas un JSON valide." }; }
  const data = isPlainObject(parsed) && isPlainObject(parsed.data) ? parsed.data : parsed;
  const clean = sanitizeState(data);

  return { ok: true, state: clean };

/* ------------------------------ Progression ---------------------------- */
const Progress = {
  addPendingAnswer(universe, correct) { /* utilisé par le moteur : XP ajoutée seulement en fin de partie */ },
  answerScored(universe, correct) {
    const a = App.state.stats.answers[universe];
    if (!a) return;
    a.t++; if (correct) a.c++;
    Tracker.bump(universe === "react" ? "reactAnswers" : "flutterAnswers", correct ? 1 : 0, correct);
    saveProgress();
  },
  markVisit(domainId, gameId) {
    App.state.lastDomain = domainId;
    App.state.lastGame = gameId;
    const s = App.state.stats;
    s.started[gameId] = (s.started[gameId] || 0) + 1;
    if (!App.state.stats.perGame[gameId]) App.state.stats.perGame[gameId] = { plays: 0, wins: 0, best: 0 };
    saveProgress();
  },
  abandonRun(gameId) {
    const s = App.state.stats;
    s.abandoned[gameId] = (s.abandoned[gameId] || 0) + 1;
    saveProgress();
  },
  computeAccuracy(universe) {
    const a = App.state.stats.answers[universe];
    if (!a || a.t === 0) return null;
    return (a.c / a.t) * 100;
  },
  totalFinished() { const s = App.state.stats; return Object.keys(s.finished).reduce((n, k) => n + s.finished[k], 0); },
  totalWins() { const s = App.state.stats; return Object.keys(s.wins).reduce((n, k) => n + s.wins[k], 0); },
  domainProgress(domainId) {
    const ids = gamesOfDomain(domainId);
    if (!ids.length) return { done: 0, total: 0, pct: 0 };
    const done = ids.filter(id => (App.state.stats.finished[id] || 0) > 0).length;
    return { done, total: ids.length, pct: (done / ids.length) * 100 };
  },
  universeProgress(uid) {
    const ids = gamesOfUniverse(uid);
    const done = ids.filter(id => (App.state.stats.finished[id] || 0) > 0).length;
    return { done, total: ids.length, pct: ids.length ? (done / ids.length) * 100 : 0 };
  },
  /* Enregistre une partie terminée (une seule fois) et attribue les XP. */
  finishRun(result) {
    const st = App.state, s = st.stats, g = GAMES[result.gameId];
    const before = levelInfo(st.xp).index;
    let xp = 0;
    const breakdown = [];
    const ansXP = (result.answers && result.answers.correct || 0) * REWARDS.answer;
    if (ansXP > 0) { xp += ansXP; breakdown.push({ label: "Réponses correctes ×" + result.answers.correct, amount: ansXP }); }
    if (result.win) { xp += REWARDS.levelComplete; breakdown.push({ label: "Partie réussie", amount: REWARDS.levelComplete }); }
    if (result.answers && result.answers.total > 0) {
      const uni = g.universe;
      if (uni === "react" || uni === "flutter") {
        s.answers[uni].t += result.answers.total;
        s.answers[uni].c += result.answers.correct;
      }
    }
    const firstTime = !st.firstBonus.includes(result.gameId);
    if (result.win && firstTime) { xp += REWARDS.firstSuccess; breakdown.push({ label: "Premier succès sur ce jeu", amount: REWARDS.firstSuccess }); st.firstBonus.push(result.gameId); }
    s.finished[result.gameId] = (s.finished[result.gameId] || 0) + 1;
    if (result.win) s.wins[result.gameId] = (s.wins[result.gameId] || 0) + 1;
    const pg = s.perGame[result.gameId] || (s.perGame[result.gameId] = { plays: 0, wins: 0, best: 0 });
    pg.plays++; if (result.win) pg.wins++;
    if (typeof result.score === "number" && result.score > pg.best) pg.best = result.score;
    let record = false;
    if (typeof result.score === "number") {
      const prev = st.records[result.gameId];
      if (!prev || result.score > prev.score) {
        record = !!prev;
        st.records[result.gameId] = { score: result.score, date: todayISO(), mode: "score" };
        if (record) { xp += REWARDS.record; breakdown.push({ label: "Nouveau record", amount: REWARDS.record }); }
      }
    }
    if (g.universe === "amusement") { s.arcade.runs++; if (result.win) s.arcade.wins++; }
    st.xp += xp;
    /* défis + série de jours */
    Tracker.bump("arcadeRuns", 1, true);
    if (g.universe === "flutter" && (g.kind === "tree" || g.kind === "json")) Tracker.bump("flutterPuzzle", 1, true);
    Tracker.bump("replay", pg.plays >= 2 ? 1 : 0, pg.plays >= 2);
    if (result.answers && result.answers.total >= 5) {
      const acc = (result.answers.correct / result.answers.total) * 100;
      if (acc >= 70) Tracker.bump("precisionRun", 1, true);
    }
    Progress.markActiveDay();
    st.runs.push({ gameId: result.gameId, date: todayISO(), score: result.score || 0, win: !!result.win, timeMs: result.timeMs || 0, at: Date.now() });
    if (st.runs.length > 120) st.runs = st.runs.slice(-120);
    saveProgress();
    Badges.check();
    const after = levelInfo(st.xp).index;
    return { xp, breakdown, newRecord: record, levelUp: after > before ? levelInfo(st.xp) : null };
  },
  markActiveDay() {
    const today = todayISO();
    const days = App.state.activeDays;
    if (days[days.length - 1] !== today && !days.includes(today)) { days.push(today); if (days.length > 400) days.splice(0, days.length - 400); }
  },
  streak() {
    const days = App.state.activeDays;
    if (!days.length) return 0;
    const set = new Set(days);
    const today = new Date();
    let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (!set.has(todayISO(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    while (set.has(todayISO(cursor))) { n++; cursor.setDate(cursor.getDate() - 1); }
    return n;
  },
  recentDays() {
    const out = [];
    const set = new Set(App.state.activeDays);
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      out.push({ iso: todayISO(d), label: ["D", "L", "M", "M", "J", "V", "S"][d.getDay()], on: set.has(todayISO(d)), today: i === 0 });
    }
    return out;
  }
};

const CHALLENGES = [
  { id: "reactAnswers", title: "Réussir cinq questions React", desc: "Cinq bonnes réponses dans l'univers React.js.", target: 5, reward: REWARDS.challenge },
  { id: "flutterPuzzle", title: "Terminer un puzzle Flutter", desc: "Arbre de Widgets ou parsing JSON terminé.", target: 1, reward: REWARDS.challenge },
  { id: "arcadeRuns", title: "Jouer deux parties d'arcade", desc: "Deux parties terminées dans Pause Dev.", target: 2, reward: REWARDS.challenge },
  { id: "precisionRun", title: "70 % de précision minimum", desc: "Terminer un exercice d'au moins 5 questions avec 70 % de bonnes réponses.", target: 1, reward: REWARDS.challenge },
  { id: "replay", title: "Rejouer à un jeu déjà terminé", desc: "Reprendre un jeu que tu as déjà réussi.", target: 1, reward: REWARDS.challenge }
];
const Tracker = {
  ensureDay() {
    const today = todayISO();
    if (App.state.challenges.date !== today) {
      App.state.challenges.date = today;
      App.state.challenges.progress = {};
      saveProgress();
    }
  },
  bump(key, n, ok) {
    if (!ok || !n) return;
    Tracker.ensureDay();
    const p = App.state.challenges.progress;
    const def = CHALLENGES.find(c => c.id === key);
    if (!def) return;
    const before = p[key] || 0;
    if (before >= def.target) return;
    p[key] = Math.min(def.target, before + n);
    saveProgress();
    if (p[key] >= def.target) {
      App.state.xp += def.reward;
      toast("Défi accompli : " + def.title + " (+" + def.reward + " XP)", "xp");
      saveProgress();
    }
  },
  progressOf(id) { Tracker.ensureDay(); return App.state.challenges.progress[id] || 0; }
};

function navRoot(route) {
  if (route.startsWith("#/u/") || route.startsWith("#/d/")) return "explorer";

  if (route.startsWith("#/g/")) return "";

  Nav.current = hash;
  if (Nav.cleanup) { try { Nav.cleanup(); } catch (e) { /* ignore */ } Nav.cleanup = null; }
  Engine.closeQuietly();
  const view = $("#view");
  clearNode(view);
  document.body.classList.remove("in-game");
  const parts = hash.slice(2).split("/");
  const root = parts[0] || "home";
  if (root === "g" && parts[1] && GAMES[parts[1]]) { Engine.open(parts[1]); return; }
  renderBottomNav(navRoot(hash));
  if (root === "explorer") Screens.explorer();
  else if (root === "cours") Screens.cours(parts[1]);
  else if (root === "u" && UNIVERSES[parts[1]]) Screens.universe(parts[1]);
  else if (root === "d" && DOMAINS[parts[1]]) Screens.domain(parts[1]);
  else if (root === "progression") Screens.progression();
  else if (root === "profil") Screens.profil();
  else Screens.home();
  $("#view").scrollIntoView({ block: "start" });

};

/* =========================================================================
   MOTEUR COMMUN DES JEUX
   ========================================================================= */
const GAME_FACTORIES = {};   /* gameId -> (session) => controls */
const REALTIME_GAMES = { snake: true, breakout: true, maze: true, "tf-flash": true, "target-ui": true, "material-quiz": true };

const Engine = {
  session: null, controls: null, gameId: null, running: false,

  open(gameId) {
    const def = GAMES[gameId];
    if (!def) { Nav.go("#/home", true); return; }
    Engine.closeQuietly();
    Engine.gameId = gameId;
    document.body.classList.add("in-game");
    renderBottomNav("");
    Progress.markVisit(def.domain, gameId);
    Tracker.bump("replay", 0, false); /* le défi replay est évalué à la fin de partie */

    const view = $("#view");
    const shell = el("div", { class: "game-shell" });
    const head = el("header", { class: "game-head" });
    const scorePill = el("span", { class: "pill score", style: "display:none" });
    scorePill.innerHTML = icon("star");
    const scoreVal = el("b", { text: "0" });
    scorePill.appendChild(scoreVal);
    const timePill = el("span", { class: "pill time", style: "display:none" });
    timePill.innerHTML = icon("clock");
    const timeVal = el("span", { text: "00:00" });
    timePill.appendChild(timeVal);
    const extraPill = el("span", { class: "pill extra", style: "display:none" });

    const backBtn = el("button", { class: "head-btn", "aria-label": "Quitter le jeu", onclick: () => Engine.requestExit() }, iconEl("back"));
    head.appendChild(backBtn);
    head.appendChild(el("span", { class: "title grow", text: def.title }));
    head.appendChild(extraPill);
    head.appendChild(scorePill);
    head.appendChild(timePill);
    if (REALTIME_GAMES[gameId]) {
      head.appendChild(el("button", { class: "head-btn", "aria-label": "Pause", onclick: () => Engine.togglePause() }, iconEl("pause")));
    }
    const body = el("div", { class: "game-body" });
    shell.appendChild(head);
    shell.appendChild(body);
    view.appendChild(shell);
    window.scrollTo(0, 0);

    const cleanups = [];
    const session = {
      def, body, gameId,
      answers: { correct: 0, total: 0 },
      score: 0, elapsed: 0, clockId: null, clockStart: 0, running: false, finished: false,
      setScore(v) { session.score = Math.max(0, Math.round(v)); scoreVal.textContent = String(session.score); scorePill.style.display = ""; },
      setExtra(text) { if (text) { extraPill.innerHTML = ""; extraPill.appendChild(el("span", { text: text })); extraPill.style.display = ""; } else extraPill.style.display = "none"; },
      showClock() { timePill.style.display = ""; },
      startClock() {
        session.showClock();
        if (session.clockId) return;
        session.clockStart = Date.now();
        session.running = true;
        session.clockId = setInterval(() => {
          session.elapsed += Date.now() - session.clockStart;
          session.clockStart = Date.now();
          timeVal.textContent = fmtTime(session.elapsed);
        }, 250);
      },
      pauseClock() { if (session.clockId) { clearInterval(session.clockId); session.clockId = null; session.elapsed += Date.now() - session.clockStart; session.running = false; timeVal.textContent = fmtTime(session.elapsed); } },
      resumeClock() { if (!session.clockId && !session.finished) { session.clockStart = Date.now(); session.running = true; session.clockId = setInterval(() => { session.elapsed += Date.now() - session.clockStart; session.clockStart = Date.now(); timeVal.textContent = fmtTime(session.elapsed); }, 250); } },
      addAnswer(correct) {
        session.answers.total++;
        if (correct) session.answers.correct++;
        vibrate(correct ? 12 : [8, 40, 8]);
      },
      onCleanup(fn) { cleanups.push(fn); },
      onKey(fn) {
        const handler = e => {
          const tag = e.target && e.target.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
          fn(e);
        };
        document.addEventListener("keydown", handler);
        cleanups.push(() => document.removeEventListener("keydown", handler));
      },
      onResize(fn) {
        let raf = null;
        const handler = () => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { raf = null; fn(); }); };
        window.addEventListener("resize", handler);
        window.addEventListener("orientationchange", handler);
        cleanups.push(() => {
          if (raf) cancelAnimationFrame(raf);
          window.removeEventListener("resize", handler);
          window.removeEventListener("orientationchange", handler);
        });
      },
      finish(result) { Engine.finish(result); }
    };
    Engine.session = session;
    const factory = GAME_FACTORIES[gameId];
    if (!factory) { body.appendChild(el("p", { class: "meta", text: "Jeu introuvable." })); return; }
    Engine.controls = factory(session);
    /* pause automatique si la page devient invisible (jeux en temps réel) */
    const onVis = () => { if (document.hidden && REALTIME_GAMES[gameId] && session.running && !session.finished) Engine.togglePause(); };
    document.addEventListener("visibilitychange", onVis);
    cleanups.push(() => document.removeEventListener("visibilitychange", onVis));
    Engine._cleanups = cleanups;
    if (Engine.controls && Engine.controls.start) Engine.controls.start();
  },

  finish(result) {
    const session = Engine.session;
    if (!session || session.finished) return;
    session.finished = true;
    Engine.running = false;
    session.pauseClock();
    if (Engine.controls && Engine.controls.pause) { try { Engine.controls.pause(); } catch (e) { /* ignore */ } }
    const g = GAMES[Engine.gameId];
    const timeMs = typeof result.timeMs === "number" ? result.timeMs : session.elapsed;
    const recordBefore = App.state.records[Engine.gameId];

function createFeedback() {

/* Liste ordonnable : pool -> réponse, avec boutons monter/descendre/retirer. */
function createOrderList(items, opts) {
  const o = opts || {};
  const total = items.length;
  const state = { pool: shuffle(items.map((it, i) => ({ id: it.id || "i" + i, text: it.text }))), order: [] };
  const root = el("div", { class: "stack", style: "gap:10px" });
  const poolBox = el("div", { class: "pool", role: "list", "aria-label": "Blocs disponibles" });
  const orderBox = el("div", { class: "order-list", role: "list", "aria-label": "Ta réponse" });
  root.appendChild(poolBox);
  root.appendChild(orderBox);
  function notify() { if (o.onChange) o.onChange(); }
  function render() {
    clearNode(poolBox); clearNode(orderBox);
    state.pool.forEach(b => {
      poolBox.appendChild(el("button", {
        class: "order-item", style: "width:auto;cursor:pointer", role: "listitem",
        onclick: () => { state.order.push(b); state.pool = state.pool.filter(x => x !== b); render(); notify(); }
      }, el("span", { class: "txt", text: b.text })));
    });
    if (!state.order.length) orderBox.appendChild(el("p", { class: "meta", text: "Touche les blocs ci-dessus pour les placer ici, puis ajuste l'ordre." }));
    state.order.forEach((b, idx) => {
      orderBox.appendChild(el("div", { class: "order-item", role: "listitem" }, [
        el("span", { class: "meta mono", style: "width:18px", text: String(idx + 1) }),
        el("span", { class: "txt", text: b.text }),
        el("button", { class: "mini-btn", "aria-label": "Monter", disabled: idx === 0, onclick: () => { const t = state.order[idx - 1]; state.order[idx - 1] = b; state.order[idx] = t; render(); notify(); } }, iconEl("arrowUp")),
        el("button", { class: "mini-btn", "aria-label": "Descendre", disabled: idx === state.order.length - 1, onclick: () => { const t = state.order[idx + 1]; state.order[idx + 1] = b; state.order[idx] = t; render(); notify(); } }, iconEl("arrowDown")),
        el("button", { class: "mini-btn danger", "aria-label": "Retirer", onclick: () => { state.order.splice(idx, 1); state.pool.push(b); render(); notify(); } }, iconEl("x"))
      ]));
    });
  }
  render();
  return {
    root,
    isComplete: () => state.order.length === total && state.pool.length === 0,
    getOrder: () => state.order.map(b => b.id),
    reset: (newItems) => {
      const list = newItems || items;
      state.pool = shuffle(list.map((it, i) => ({ id: it.id || "i" + i, text: it.text })));
      state.order = [];
      render();
    }
  };
}
/* Vérifie une réponse ordonnée contre une liste de variantes acceptées. */
function checkOrder(orderIds, variants) {
  const str = orderIds.join(",");
  return variants.some(v => v.join(",") === str);
}
/* Mélange une liste de choix et renvoie les éléments + la position du bon. */
function shuffleChoices(options, correctId) {
  const shuffled = shuffle(options.map((o, i) => ({ id: o.id || "o" + i, label: o.label, detail: o.detail || null })));
  return { items: shuffled, correctIndex: shuffled.findIndex(o => o.id === correctId) };
}
function buildChoices(container, items, onPick, opts) {
  clearNode(container);
  const letters = ["A", "B", "C", "D", "E", "F"];
  const buttons = items.map((it, i) => el("button", {
    class: "choice", onclick: () => { buttons.forEach(b => b.disabled = true); onPick(i, it); }
  }, el("span", { class: "key", text: letters[i] || String(i + 1) }), el("span", { class: "grow", text: it.label })));
  buttons.forEach(b => container.appendChild(b));
  return {
    mark(correctIndex) {
      buttons.forEach((b, i) => {
        if (i === correctIndex) { b.classList.add("good"); b.querySelector(".key").innerHTML = icon("check"); }
      });
    },
    markPick(pickIndex, correctIndex) {
      buttons.forEach((b, i) => {
        if (i === correctIndex) { b.classList.add("good"); b.querySelector(".key").innerHTML = icon("check"); }
        else if (i === pickIndex) { b.classList.add("bad"); b.querySelector(".key").innerHTML = icon("x"); }
      });
    }
  };
}
