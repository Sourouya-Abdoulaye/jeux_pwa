function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function codeBlock(code) { return el("pre", { class: "code", text: code }); }

/* --- A1 : Puzzle JSX --- */
GAME_FACTORIES["jsx-puzzle"] = function (session) {
  const exs = JSX_PUZZLES;
  let idx = 0, puzzle = null, firstTry = true, solvedFirst = 0, solvedCount = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  session.setScore(0);
  bindEnterNext(session);

  function load(i) {
    idx = i; firstTry = true; answered = false;
    clearNode(wrap);
    const ex = exs[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("code") + "<span>Exercice " + (i + 1) + "/" + exs.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: ex.title })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: ex.instruction }));
    puzzle = createOrderList(ex.blocks, {});
    wrap.appendChild(el("div", { class: "section-title", text: "Blocs" }));
    wrap.appendChild(puzzle.root);
    clearNode(actionBox);
    const validateBtn = el("button", {
      class: "btn btn-primary btn-block", disabled: true,
      onclick: () => { validateBtn.disabled = true; validate(); }
    }, iconEl("check"), el("span", { text: "Valider l'ordre" }));
    puzzle.root.addEventListener("input", () => { });
    puzzle.onChangeHook = () => { validateBtn.disabled = !puzzle.isComplete(); };
    /* réactive le bouton à chaque modification */
    const observer = new MutationObserver(() => { validateBtn.disabled = !puzzle.isComplete(); });
    observer.observe(puzzle.root, { childList: true, subtree: true });
    session.onCleanup(() => observer.disconnect());
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    feedback.clear();
    wrap.appendChild(feedback);
  }
  function validate() {
    const ex = exs[idx];
    const ok = checkOrder(puzzle.getOrder(), ex.variants);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (ok) {
      solvedCount++;
      if (firstTry) solvedFirst++;
      session.setScore(session.score + 100 + (firstTry ? 50 : 0));
      feedback.show("ok", "Ordre correct — " + (firstTry ? "du premier coup" : "après correction"),
        "<p>" + escapeHtml(ex.explanation) + "</p>");
      wrap.appendChild(codeBlock(ex.code));
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= exs.length ? "Terminer" : "Exercice suivant", () => {
        if (idx + 1 >= exs.length) {
          session.finish({
            score: session.score, win: solvedCount === exs.length,
            title: solvedCount === exs.length ? "Puzzle JSX maîtrisé" : "Puzzle terminé",
            extras: [{ label: "Exercices réussis", value: solvedCount + "/" + exs.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      firstTry = false;
      feedback.show("ko", "Ordre incorrect", "<p>Relis la structure : ouverture de fonction, retour JSX, imbrication des balises, fermeture. Corrige et revérifie.</p>");
      clearNode(actionBox);
      const retry = el("button", { class: "btn btn-primary btn-block", onclick: () => { retry.remove(); load(idx); } }, iconEl("rotate"), el("span", { text: "Réessayer" }));
      actionBox.appendChild(retry);
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

/* --- A2 : Cartes mémoire Hooks --- */
GAME_FACTORIES["hooks-memory"] = function (session) {
  const cardsData = [];
  HOOKS_PAIRS.forEach(p => {
    cardsData.push({ key: p.id + "-t", pair: p.id, face: p.term });
    cardsData.push({ key: p.id + "-r", pair: p.id, face: p.role });
  });
  let flipped = [], foundPairs = 0, attempts = 0, lock = false, flipTimer = null, started = false;
  const wrap = el("div", { class: "stack" });
  const grid = el("div", { class: "mem-grid", role: "grid", "aria-label": "Cartes mémoire" });
  const feedback = createFeedback();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("star") + "<span>Paires : <b id='mm-pairs'>0/5</b></span>" }),
    el("span", { class: "chip", html: icon("target") + "<span>Essais : <b id='mm-att'>0</b></span>" })
  ]);
  wrap.appendChild(hud);
  wrap.appendChild(grid);
  wrap.appendChild(feedback);
  session.body.appendChild(wrap);

  function updateHud() {
    const b1 = $("#mm-pairs", wrap), b2 = $("#mm-att", wrap);
    if (b1) b1.textContent = foundPairs + "/5";
    if (b2) b2.textContent = String(attempts);
  }
  function build() {
    clearNode(grid);
    flipped = []; foundPairs = 0; attempts = 0; lock = false;
    shuffle(cardsData).forEach(cd => {
      const btn = el("button", {
        class: "mem-card", "aria-label": "Carte face cachée", dataset: { key: cd.key },
        onclick: () => flip(btn, cd)
      }, el("div", { class: "mem-inner" }, [
        el("div", { class: "mem-face front", text: "<>" }),
        el("div", { class: "mem-face back", text: cd.face })
      ]));
      grid.appendChild(btn);
    });
    updateHud();
  }
  function flip(btn, cd) {
    if (lock || btn.classList.contains("flipped") || btn.classList.contains("matched")) return;
    if (!started) { started = true; session.startClock(); }
    btn.classList.add("flipped");
    btn.setAttribute("aria-label", "Carte retournée : " + cd.face);
    flipped.push({ btn, cd });
    if (flipped.length < 2) return;
    attempts++;
    updateHud();
    const [a, b] = flipped;
    if (a.cd.pair === b.cd.pair) {
      foundPairs++;
      const pair = HOOKS_PAIRS.find(p => p.id === a.cd.pair);
      a.btn.classList.remove("flipped"); b.btn.classList.remove("flipped");
      a.btn.classList.add("matched"); b.btn.classList.add("matched");
      a.btn.disabled = true; b.btn.disabled = true;
      session.setScore(session.score + 150);
      flipped = [];
      const firstDiscovery = !session._seen || !session._seen.includes(pair.id);
      session._seen = session._seen || [];
      session._seen.push(pair.id);
      feedback.show("ok", "Paire trouvée : " + pair.term, "<p>" + escapeHtml(pair.explain) + "</p>");
      updateHud();
      if (foundPairs === 5) {
        lock = true;
        const secs = Math.round(session.elapsed / 1000);
        const finalScore = 750 + Math.max(0, 600 - attempts * 20 - secs * 4);
        setTimeout(() => {
          session.finish({
            score: finalScore, win: true, title: "Toutes les paires découvertes",
            extras: [{ label: "Essais", value: String(attempts) }, { label: "Temps", value: fmtTime(session.elapsed) }]
          });
        }, 600);
      }
    } else {
      lock = true;
      flipTimer = setTimeout(() => {
        a.btn.classList.remove("flipped"); b.btn.classList.remove("flipped");
        a.btn.setAttribute("aria-label", "Carte face cachée");
        b.btn.setAttribute("aria-label", "Carte face cachée");
        flipped = []; lock = false; flipTimer = null;
      }, 750);
      session.onCleanup(() => { if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; } });
    }
  }
  return {
    start: () => { session.setScore(0); build(); },
    pause() { lock = true; if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; flipped.forEach(f => f.btn.classList.remove("flipped")); flipped = []; } },
    resume() { lock = false; },
    destroy() { if (flipTimer) clearTimeout(flipTimer); }
  };
};

/* --- A3 : Vrai / Faux éclair --- */
GAME_FACTORIES["tf-flash"] = function (session) {
  let mode = null, qs = [], idx = 0, correct = 0, countdown = 60, cdId = null, advanceTimer = null, pendingAdvance = false, answered = false, over = false;
  let currentV = null, currentF = null;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  bindEnterNext(session);
  session.onKey(e => {
    if (!mode || over || answered) return;
    const k = e.key.toLowerCase();
    if (k === "v" || e.key === "ArrowLeft") { e.preventDefault(); if (currentV) currentV.click(); }
    else if (k === "f" || e.key === "ArrowRight") { e.preventDefault(); if (currentF) currentF.click(); }
  });

  function stopAllTimers() {
    if (cdId) { clearInterval(cdId); cdId = null; }
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }
  function chooseMode() {
    clearNode(wrap);
    wrap.appendChild(gameIntro(GAMES["tf-flash"]));
    wrap.appendChild(el("div", { class: "duo" }, [
      el("button", { class: "btn btn-primary", onclick: () => begin("eclair") }, iconEl("bolt"), el("span", { text: "Éclair (60 s)" })),
      el("button", { class: "btn", onclick: () => begin("learn") }, iconEl("book"), el("span", { text: "Apprentissage" }))
    ]));
    wrap.appendChild(el("p", { class: "meta", text: "15 affirmations. Dans le mode éclair, la rapidité compte mais chaque explication reste affichée." }));
  }
  function begin(m) {
    mode = m; qs = shuffle(TF_QUESTIONS); idx = 0; correct = 0; over = false; countdown = 60; pendingAdvance = false;
    clearNode(wrap);
    wrap.appendChild(feedback);
    wrap.appendChild(actionBox);
    session.setScore(0);
    session.startClock();
    if (mode === "eclair") {
      session.setExtra("60 s");
      cdId = setInterval(() => {
        countdown--;
        session.setExtra(Math.max(0, countdown) + " s");
        if (countdown <= 0) endGame();
      }, 1000);
    } else session.setExtra("Mode apprentissage");
    renderQuestion();
  }
  function renderQuestion() {
    if (over) return;
    const q = qs[idx];
    clearNode(wrap);
    wrap.appendChild(stepProgress(idx, qs.length, "react"));
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("list") + "<span>Question " + (idx + 1) + "/" + qs.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: "Difficulté " + q.d + "/3" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:15px;font-weight:600;line-height:1.45", text: q.t })));
    answered = false;
    const duo = el("div", { class: "duo" });
    const btnV = el("button", { class: "btn" }, iconEl("check"), el("span", { text: "Vrai" }));
    const btnF = el("button", { class: "btn" }, iconEl("x"), el("span", { text: "Faux" }));
    currentV = btnV; currentF = btnF;
    duo.appendChild(btnV); duo.appendChild(btnF);
    wrap.appendChild(duo);
    feedback.clear();
    wrap.appendChild(feedback);
    clearNode(actionBox);
    wrap.appendChild(actionBox);
    function answer(pickTrue) {
      if (answered) return;
      answered = true;
      const ok = pickTrue === q.a;
      if (ok) correct++;
      session.addAnswer(ok);
      session.setScore(correct * 100);
      btnV.disabled = true; btnF.disabled = true;
      (q.a ? btnV : btnF).classList.add("good");
      if (!ok) (pickTrue ? btnV : btnF).classList.add("bad");
      feedback.show(ok ? "ok" : "ko", ok ? "Correct" : "Incorrect — la bonne réponse était : " + (q.a ? "Vrai" : "Faux"), "<p>" + escapeHtml(q.e) + "</p>");
      if (mode === "learn") {
        actionBox.appendChild(nextButton(idx + 1 >= qs.length ? "Terminer" : "Question suivante", next));
      } else {
        pendingAdvance = true;
        advanceTimer = setTimeout(() => { advanceTimer = null; pendingAdvance = false; next(); }, 1500);
        actionBox.appendChild(nextButton("Question suivante", () => { if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; } pendingAdvance = false; next(); }));
      }
    }
    btnV.addEventListener("click", () => answer(true));
    btnF.addEventListener("click", () => answer(false));
    wrap.appendChild(el("div", { class: "key-hint" }, [
      el("kbd", { text: "V" }), el("span", { text: "vrai" }),
      el("kbd", { text: "F" }), el("span", { text: "faux" }),
      el("kbd", { text: "Entrée" }), el("span", { text: "continuer" })
    ]));
  }
  function next() {
    idx++;
    if (idx >= qs.length) { endGame(); return; }
    renderQuestion();
  }
  function endGame() {
    if (over) return;
    over = true;
    stopAllTimers();
    const completed = idx >= qs.length;
    session.finish({
      score: correct * 100 + (completed ? 100 : 0),
      win: correct >= 10,
      title: correct >= 10 ? "Série réussie" : "Série terminée",
      extras: [
        { label: "Bonnes réponses", value: correct + "/" + qs.length },
        { label: "Mode", value: mode === "eclair" ? "Éclair" : "Apprentissage" }
      ]
    });
  }
  return {
    start: () => chooseMode(),
    pause() {
      if (cdId) { clearInterval(cdId); cdId = null; }
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; pendingAdvance = true; }
    },
    resume() {
      if (mode === "eclair" && !over && !cdId) {
        cdId = setInterval(() => {
          countdown--;
          session.setExtra(Math.max(0, countdown) + " s");
          if (countdown <= 0) endGame();
        }, 1000);
      }
      if (pendingAdvance && !over) { pendingAdvance = false; next(); }
    },
    destroy() { stopAllTimers(); }
  };
};

/* --- B1 : Circuit / Pipe Flow --- */
GAME_FACTORIES["pipe-flow"] = function (session) {
  const scenarios = PIPE_SCENARIOS.slice();
  let idx = 0, path = [], firstTry = true, solved = 0, answered = false, animTimers = [];
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  session.body.appendChild(wrap);
  session.setScore(0);
  bindEnterNext(session);

  function clearAnim() { animTimers.forEach(t => clearTimeout(t)); animTimers = []; }
  session.onCleanup(clearAnim);

  function load(i) {
    idx = i; path = []; firstTry = true; answered = false;
    clearNode(wrap); clearAnim();
    const sc = scenarios[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("network") + "<span>Scénario " + (i + 1) + "/" + scenarios.length + "</span>" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, [
      el("div", { class: "card-title", html: icon("database") + "<span>Donnée : " + escapeHtml(sc.token) + "</span>" }),
      el("p", { class: "card-sub", style: "margin-top:5px", text: sc.goal })
    ]));
    const tree = el("div", { class: "tree", role: "list", "aria-label": "Arbre de composants" });
    sc.nodes.forEach(n => {
      const nodeBtn = el("button", {
        class: "tree-node", style: "margin-left:" + (n.level * 18) + "px", dataset: { id: n.id },
        onclick: () => pick(sc, n, nodeBtn)
      }, [
        el("span", { text: n.label }),
        el("span", { class: "val", text: "" })
      ]);
      tree.appendChild(nodeBtn);
    });
    wrap.appendChild(el("div", { class: "section-title", text: "Arbre de composants" }));
    wrap.appendChild(tree);
    clearNode(actionBox);
    const validateBtn = el("button", { class: "btn btn-primary btn-block", disabled: true, onclick: () => validate(sc) }, iconEl("check"), el("span", { text: "Valider le chemin" }));
    const clearBtn = el("button", { class: "btn btn-ghost btn-block", onclick: () => { path = []; refresh(tree, sc); validateBtn.disabled = true; } }, iconEl("rotate"), el("span", { text: "Effacer" }));
    actionBox.appendChild(validateBtn);
    actionBox.appendChild(clearBtn);
    wrap.appendChild(actionBox);
    feedback.clear();
    wrap.appendChild(feedback);
    tree._validateBtn = validateBtn;
  }
  function refresh(tree, sc) {
    $$(".tree-node", tree).forEach(b => {
      const pos = path.findIndex(p => p.id === b.dataset.id);
      b.classList.toggle("selected", pos >= 0);
      b.classList.remove("visited");
      b.querySelector(".val").textContent = pos >= 0 ? "#" + (pos + 1) : "";
    });
  }
  function pick(sc, n, btn) {
    const tree = btn.parentElement;
    const last = path[path.length - 1];
    if (last && last.id === n.id) { path.pop(); }
    else if (!path.some(p => p.id === n.id)) { path.push(n); }
    refresh(tree, sc);
    tree._validateBtn.disabled = path.length === 0;
  }
  function validate(sc) {
    const ok = checkOrder(path.map(p => p.id), [sc.path]);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (!ok) {
      firstTry = false;
      feedback.show("ko", "Chemin incorrect", "<p>Le flux ne circule pas comme demandé. Repars de la donnée et suis le sens indiqué dans la consigne (props vers l'enfant, ou remontée pour les callbacks).</p>");
      return;
    }
    solved++;
    session.setScore(session.score + 100);
    const tree = $(".tree", wrap);
    path.forEach((p, i) => {
      animTimers.push(setTimeout(() => {
        const b = $$(".tree-node", tree).find(x => x.dataset.id === p.id);
        if (b) {
          b.classList.add("visited");
          b.querySelector(".val").textContent = sc.values[p.id] || "";
        }
      }, i * 350));
    });
    animTimers.push(setTimeout(() => {
      feedback.show("ok", "Chemin correct", "<p>" + escapeHtml(sc.explanation) + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Scénario suivant", () => {
        if (idx + 1 >= scenarios.length) {
          session.finish({
            score: session.score, win: solved >= 4,
            title: solved >= 4 ? "Circuit maîtrisé" : "Circuit terminé",
            extras: [{ label: "Scénarios réussis", value: solved + "/" + scenarios.length }]
          });
        } else load(idx + 1);
      }));
    }, path.length * 350 + 250));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { clearAnim(); } };
};

/* --- B2 : Swipe Decision (React) --- */
GAME_FACTORIES["arch-decision"] = function (session) {
  const scenarios = REACT_DECISIONS.slice();
  let idx = 0, score = 0, good = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  const choicesBox = el("div", { class: "choices" });
  session.body.appendChild(wrap);
  session.setScore(0);
  bindChoiceKeys(session, choicesBox);
  bindEnterNext(session);

  function load(i) {
    idx = i; answered = false;
    clearNode(wrap);
    const sc = scenarios[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("list") + "<span>Décision " + (i + 1) + "/" + scenarios.length + "</span>" })
    ]));
    const card = el("div", { class: "dec-card" }, [
      el("p", { style: "font-size:14.5px;font-weight:600;line-height:1.5", text: sc.scenario })
    ]);
    wrap.appendChild(card);
    wrap.appendChild(el("div", { class: "section-title", text: "Ta décision" }));
    wrap.appendChild(choicesBox);
    clearNode(actionBox);
    wrap.appendChild(actionBox);
    feedback.clear();
    wrap.appendChild(feedback);
    wrap.appendChild(el("p", { class: "swipe-hint", html: icon("hand") + "<span>Balayage facultatif : balaye à gauche / à droite pour choisir les deux premières options.</span>" }));

    const scCopy = sc;
    buildChoices(choicesBox, sc.options, (i2, item) => decide(scCopy, i2, item));
    /* balayage facultatif */
    const detach = attachSwipe(card, dir => {
      if (answered || (dir !== "left" && dir !== "right")) return;
      const btns = $$(".choice", choicesBox);
      const target = dir === "left" ? btns[0] : btns[1];
      if (target && !target.disabled) target.click();
    });
    session.onCleanup(detach);
  }
  function decide(sc, pickIndex, item) {
    if (answered) return;
    answered = true;
    const opt = sc.options.find(o => o.id === item.id) || sc.options[pickIndex];
    const correctIndex = sc.options.findIndex(o => o.verdict === "good");
    const isGood = opt.verdict === "good";
    session.addAnswer(isGood);
    if (isGood) good++;
    const gained = opt.verdict === "good" ? 100 : opt.verdict === "ok" ? 60 : 0;
    score += gained;
    session.setScore(score);
    const marks = $$(".choice", choicesBox);
    marks.forEach((b, i) => {
      b.disabled = true;
      const o = sc.options[i];
      if (o.verdict === "good") b.classList.add("good");
      else if (i === pickIndex) b.classList.add("bad");
    });
    const verdictLabel = opt.verdict === "good" ? "Solution solide" : opt.verdict === "ok" ? "Possible, avec des limites" : "Peu adaptée ici";
    feedback.show(opt.verdict === "good" ? "ok" : opt.verdict === "ok" ? "info" : "ko", verdictLabel + " (+" + gained + " pts)", "<p><b>Pourquoi :</b> " + escapeHtml(sc.feedback[item.id] || "") + "</p><p style='margin-top:6px'>" + escapeHtml(sc.explanation) + "</p>");
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Scénario suivant", () => {
      if (idx + 1 >= scenarios.length) {
        session.finish({
          score, win: score >= 400,
          title: score >= 400 ? "Bon sens architectural" : "Série terminée",
          extras: [{ label: "Décisions solides", value: good + "/" + scenarios.length }]
        });
      } else load(idx + 1);
    }));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

/* --- C1 : Tri & rangement --- */
GAME_FACTORIES["mvc-sort"] = function (session) {
  const rounds = MVC_ROUNDS.slice();
  let idx = 0, selected = null, validated = false, firstTry = true, solved = 0, answered = false, lockedItems = {};
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  session.body.appendChild(wrap);
  session.setScore(0);
  bindEnterNext(session);

  function load(i) {
    idx = i; selected = null; validated = false; firstTry = true; answered = false; lockedItems = {};
    clearNode(wrap);
    const rd = rounds[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("layers") + "<span>Série " + (i + 1) + "/" + rounds.length + "</span>" })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: rd.intro }));
    wrap.appendChild(el("p", { class: "meta", text: "Touche un élément, puis la zone où le classer." }));
    const pool = el("div", { class: "pool", id: "sort-pool" });
    const grid = el("div", { class: "class-grid", id: "sort-grid" });
    rd.zones.forEach(z => {
      const col = el("div", { class: "class-col", dataset: { zone: z.id } }, el("h4", { text: z.label }));
      col.addEventListener("click", () => place(col));
      grid.appendChild(col);
    });
    shuffle(rd.items).forEach(it => {
      const b = el("button", { class: "class-item", dataset: { id: it.id }, text: it.label, onclick: () => select(b) });
      pool.appendChild(b);
    });
    wrap.appendChild(el("div", { class: "section-title", text: "Éléments à classer" }));
    wrap.appendChild(pool);
    wrap.appendChild(el("div", { class: "section-title", text: "Zones" }));
    wrap.appendChild(grid);
    clearNode(actionBox);
    const validateBtn = el("button", { class: "btn btn-primary btn-block", disabled: true, onclick: () => validate(rd, grid) }, iconEl("check"), el("span", { text: "Valider le classement" }));
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
    wrap._validateBtn = validateBtn;
    wrap._pool = pool;
    wrap._grid = grid;
  }
  function select(btn) {
    if (validated || btn.parentElement.id === "sort-grid" && lockedItems[btn.dataset.id]) return;
    $$(".class-item.sel", wrap).forEach(b => b.classList.remove("sel"));
    if (selected === btn) { selected = null; return; }
    btn.classList.add("sel");
    selected = btn;
  }
  function place(col) {
    if (!selected || validated) return;
    const id = selected.dataset.id;
    if (lockedItems[id]) return;
    col.appendChild(selected);
    selected.classList.remove("sel");
    selected = null;
    wrap._validateBtn.disabled = false;
  }
  function validate(rd, grid) {
    const items = $$(".class-item", grid);
    if (items.length !== rd.items.length) {
      feedback.show("info", "Classement incomplet", "<p>Place les " + rd.items.length + " éléments dans les zones avant de valider.</p>");
      return;
    }
    let allCorrect = true;
    if (!answered) {
      allCorrect = items.every(b => {
        const it = rd.items.find(x => x.id === b.dataset.id);
        return b.parentElement.dataset.zone === it.zone;
      });
      session.addAnswer(allCorrect);
      answered = true;
      if (!allCorrect) firstTry = false;
    }
    let wrongCount = 0;
    items.forEach(b => {
      const it = rd.items.find(x => x.id === b.dataset.id);
      const ok = b.parentElement.dataset.zone === it.zone;
      b.classList.remove("good", "bad");
      b.classList.add(ok ? "good" : "bad");
      if (!ok) wrongCount++;
    });
    validated = true;
    if (wrongCount === 0) {
      solved++;
      session.setScore(session.score + (firstTry ? 100 : 60));
      const whys = rd.items.map(it => "• " + it.label + " → " + it.why).join("<br>");
      feedback.show("ok", "Classement correct (+" + (firstTry ? 100 : 60) + " pts)", "<p>" + whys + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= rounds.length ? "Terminer" : "Série suivante", () => {
        if (idx + 1 >= rounds.length) {
          session.finish({
            score: session.score, win: solved === rounds.length,
            title: solved === rounds.length ? "Architecture rangée" : "Série terminée",
            extras: [{ label: "Séries réussies", value: solved + "/" + rounds.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      validated = false;
      items.forEach(b => {
        if (b.classList.contains("bad")) { b.classList.remove("bad"); wrap._pool.appendChild(b); }
        else lockedItems[b.dataset.id] = true;
      });
      if (wrap._validateBtn) wrap._validateBtn.disabled = true;
      feedback.show("ko", wrongCount + " élément(s) à corriger", "<p>Les éléments justes sont verrouillés. Touche un élément de la liste puis la bonne zone, et revérifie.</p>");
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

/* --- C2 : Circuit API --- */
GAME_FACTORIES["api-flow"] = function (session) {
  const items = shuffle(API_ROUNDS.map(r => ({ type: "order", data: r })))
    .concat(shuffle(API_MCQ).slice(0, 5).map(q => ({ type: "mcq", data: q })));
  let idx = 0, correct = 0, answered = false, solved = 0;
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  const choicesBox = el("div", { class: "choices" });
  session.body.appendChild(wrap);
  session.setScore(0);
  bindChoiceKeys(session, choicesBox);
  bindEnterNext(session);

  function load(i) {
    idx = i; answered = false;
    clearNode(wrap); clearNode(actionBox); clearNode(choicesBox); feedback.clear();
    const item = items[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("network") + "<span>Étape " + (i + 1) + "/" + items.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "chip", text: item.type === "order" ? "Ordonner" : "Scénario" })
    ]));
    if (item.type === "order") {
      const r = item.data;
      wrap.appendChild(el("h2", { text: r.title }));
      wrap.appendChild(el("p", { class: "card-sub", text: r.instruction }));
      currentPuzzle = createOrderList(r.steps, {});
      wrap.appendChild(currentPuzzle.root);
      const validateBtn = el("button", { class: "btn btn-primary btn-block", disabled: true, onclick: () => { validateBtn.disabled = true; checkOrderRound(r); } }, iconEl("check"), el("span", { text: "Valider l'ordre" }));
      const obs = new MutationObserver(() => { validateBtn.disabled = !currentPuzzle.isComplete(); });
      obs.observe(currentPuzzle.root, { childList: true, subtree: true });
      session.onCleanup(() => obs.disconnect());
      actionBox.appendChild(validateBtn);
    } else {
      const q = item.data;
      wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:14.5px;font-weight:600", text: q.t })));
      const scCopy = q;
      buildChoices(choicesBox, q.options, (i2, chosen) => {
        if (answered) return;
        answered = true;
        const ok = chosen.id === scCopy.correct;
        if (ok) { correct++; solved++; }
        session.addAnswer(ok);
        session.setScore(correct * 100);
        const ctrl = { };
        $$(".choice", choicesBox).forEach((b, bi) => {
          b.disabled = true;
          if (scCopy.options[bi].id === scCopy.correct) b.classList.add("good");
          else if (bi === i2) b.classList.add("bad");
        });
        feedback.show(ok ? "ok" : "ko", ok ? "Correct (+100 pts)" : "Incorrect", "<p>" + escapeHtml(scCopy.e) + "</p>");
        advance();
      });
      wrap.appendChild(choicesBox);
    }
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
  }
  function checkOrderRound(r) {
    if (answered) return;
    const ok = checkOrder(currentPuzzle.getOrder(), r.variants);
    answered = true;
    if (ok) { correct++; solved++; session.addAnswer(true); session.setScore(correct * 100); feedback.show("ok", "Ordre correct (+100 pts)", "<p>" + escapeHtml(r.explanation) + "</p>"); }
    else { session.addAnswer(false); feedback.show("ko", "Ordre incorrect", "<p>" + escapeHtml(r.explanation) + "</p>"); }
    advance();
  }
  let currentPuzzle = null;
  function advance() {
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= items.length ? "Terminer" : "Continuer", () => {
      if (idx + 1 >= items.length) {
        session.finish({
          score: correct * 100, win: solved >= 6,
          title: solved >= 6 ? "Circuit API maîtrisé" : "Série terminée",
          extras: [{ label: "Bonnes réponses", value: solved + "/" + items.length }]
        });
      } else load(idx + 1);
    }));
  }
  /* re-garde le puzzle courant pour la validation */
  return { start: () => { load(0); }, pause() { }, resume() { }, destroy() { } };
};

/* --- A0 : Quiz du cours MaterialApp & Scaffold --- */
GAME_FACTORIES["material-quiz"] = function (session) {
  const TOTAL_Q = MATERIAL_QUIZ_QUESTIONS.length;
  const challengeMs = 90000;
  const questions = shuffle(MATERIAL_QUIZ_QUESTIONS).map(q => {
    const opts = shuffle(q.options);
    return { id: q.id, q: q.q, options: opts, correct: opts.findIndex(o => o.id === q.correct), e: q.e };
  });
  let mode = null, idx = 0, correct = 0, streak = 0, bestStreak = 0, answered = false, done = false;
  let remaining = challengeMs, deadline = 0, ticker = null, advanceTimer = null, advancePending = false;
  const wrap = el("div", { class: "stack" });
  const progressBox = el("div");
  const card = el("div", { class: "card" });
  const choicesBox = el("div", { class: "choices answer-grid" });
  const feedback = createFeedback();
  const actionBox = el("div");
  const footer = el("div");
  wrap.appendChild(progressBox);
  wrap.appendChild(card);
  wrap.appendChild(choicesBox);
  wrap.appendChild(feedback);
  wrap.appendChild(actionBox);
  wrap.appendChild(footer);
  session.body.appendChild(wrap);
  session.setScore(0);
  session.setExtra(TOTAL_Q + " questions");
  bindChoiceKeys(session, choicesBox);
  bindEnterNext(session);

  session.onCleanup(() => {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  });

  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
  function startTicker() {
    stopTicker();
    deadline = Date.now() + remaining;
    ticker = setInterval(() => {
      remaining = Math.max(0, deadline - Date.now());
      session.setExtra("Défi · " + fmtTime(remaining));
      if (remaining <= 0) { stopTicker(); finishNow(true); }
    }, 250);
  }

  function startMode(m) {
    if (mode) return;
    mode = m;
    session.startClock();
    if (m === "challenge") {
      remaining = challengeMs;
      startTicker();
    } else {
      session.setExtra("Mode guidé");
    }
    load(0);
  }

  function finishNow(timeUp) {
    if (done) return;
    done = true;
    stopTicker();
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    const timeBonus = mode === "challenge" && !timeUp ? Math.round(remaining / 1000) * 5 : 0;
    const perfect = correct === TOTAL_Q ? 200 : 0;
    const finalScore = correct * 100 + timeBonus + perfect;
    session.setScore(finalScore);
    const win = correct >= 11;
    const extras = [
      { label: "Bonnes réponses", value: correct + "/" + TOTAL_Q },
      { label: "Mode", value: mode === "challenge" ? "Défi 90 s" : "Guidé" },
      { label: "Meilleure série", value: String(bestStreak) }
    ];
    if (timeBonus || perfect) extras.push({ label: "Bonus", value: "+" + (timeBonus + perfect) + " pts" });
    if (timeUp) extras.push({ label: "Temps", value: "Écoulé" });
    session.finish({
      score: finalScore,
      win,
      title: timeUp ? "Temps écoulé" : win ? "Cours validé" : "Continue la révision",
      extras
    });
  }

  function next() {
    if (done) return;
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    advancePending = false;
    if (idx + 1 >= TOTAL_Q) { finishNow(false); return; }
    load(idx + 1);
  }

  function load(i) {
    idx = i; answered = false;
    clearNode(progressBox); clearNode(card); clearNode(choicesBox); clearNode(actionBox); clearNode(footer); feedback.clear();
    progressBox.appendChild(stepProgress(i, TOTAL_Q, "flutter"));
    const q = questions[i];
    card.appendChild(el("div", { class: "row wrap", style: "margin-bottom:8px" }, [
      el("span", { class: "chip flutter", text: "Question " + (i + 1) }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: "Cours · MaterialApp & Scaffold" })
    ]));
    card.appendChild(el("p", { style: "font-size:15px;font-weight:650;line-height:1.5", text: q.q }));
    const ui = buildChoices(choicesBox, q.options.map(o => ({ label: o.label })), (pick) => {
      if (answered || done) return;
      answered = true;
      const ok = pick === q.correct;
      const correctLabel = q.options[q.correct].label;
      if (ok) {
        correct++; streak++; bestStreak = Math.max(bestStreak, streak);
        session.addAnswer(true);
        session.setScore(correct * 100);
        feedback.show("ok", streak >= 3 ? "Bonne réponse · série de " + streak + " !" : "Bonne réponse", "<p>" + q.e + "</p>");
      } else {
        streak = 0;
        session.addAnswer(false);
        feedback.show("ko", "Pas tout à fait", "<p>" + q.e + "</p><p style=\"margin-top:7px\"><strong>Bonne réponse :</strong> " + correctLabel + "</p>");
      }
      ui.markPick(pick, q.correct);
      const isLast = idx + 1 >= TOTAL_Q;
      if (mode === "challenge") {
        advancePending = true;
        advanceTimer = setTimeout(next, 1700);
        footer.appendChild(el("p", { class: "meta", text: isLast ? "Calcul du résultat…" : "Question suivante dans un instant…" }));
      } else {
        actionBox.appendChild(nextButton(isLast ? "Voir le résultat" : "Question suivante", next));
      }
    });
    footer.appendChild(el("div", { class: "key-hint" }, [
      el("kbd", { text: "1" }), el("kbd", { text: "2" }), el("kbd", { text: "3" }), el("kbd", { text: "4" }),
      el("span", { text: "pour répondre · Entrée pour continuer" })
    ]));
  }

  /* Écran d'accueil du jeu : choix du mode */
  progressBox.appendChild(el("div", { class: "gi-banner u-flutter" }, [
    el("span", { class: "gi-ico", html: icon("book") }),
    el("div", { class: "grow" }, [
      el("div", { class: "gi-title", text: "16 questions du cours Flutter" }),
      el("div", { class: "gi-sub", text: "MaterialApp, Scaffold, AppBar, thème, navigation, listes et propriétés" })
    ])
  ]));
  card.appendChild(el("h2", { text: "Choisis ton rythme" }));
  card.appendChild(el("p", { class: "card-sub", style: "margin:5px 0 12px", text: "Chaque réponse est expliquée. Le mode guidé laisse tout le temps de lire ; le défi ajoute un chrono de 90 secondes et un bonus de rapidité." }));
  actionBox.appendChild(el("div", { class: "duo" }, [
    el("button", { class: "btn btn-primary", onclick: () => startMode("guided") }, [
      el("span", { class: "grow", style: "text-align:left" }, [
        el("span", { style: "display:block;font-size:14px", text: "Mode guidé" }),
        el("span", { style: "display:block;font-size:11px;opacity:.8", text: "Sans chrono" })
      ]), iconEl("play")
    ]),
    el("button", { class: "btn btn-flutter", onclick: () => startMode("challenge") }, [
      el("span", { class: "grow", style: "text-align:left" }, [
        el("span", { style: "display:block;font-size:14px", text: "Défi 90 s" }),
        el("span", { style: "display:block;font-size:11px;opacity:.8", text: "Chrono + bonus" })
      ]), iconEl("clock")
    ])
  ]));
  footer.appendChild(el("p", { class: "meta", style: "margin-top:10px", text: "Astuce : tu peux répondre avec les touches 1 à 4. Les fiches du cours sont accessibles dans l'onglet Cours." }));

  return {
    start() { },
    pause() {
      if (mode === "challenge" && !done) {
        remaining = Math.max(0, deadline - Date.now());
        stopTicker();
      }
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; advancePending = true; }
    },
    resume() {
      if (mode === "challenge" && !done) startTicker();
      if (advancePending && !done) { advancePending = false; advanceTimer = setTimeout(next, 900); }
    },
    destroy() {
      stopTicker();
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    }
  };
};

/* --- A1 : Puzzle arbre de Widgets --- */
GAME_FACTORIES["widget-tree"] = function (session) {
  const rounds = WIDGET_TREE_ROUNDS;
  let idx = 0, puzzle = null, firstTry = true, solved = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  session.setScore(0);
  bindEnterNext(session);

  function load(i) {
    idx = i; firstTry = true; answered = false;
    clearNode(wrap); clearNode(actionBox); feedback.clear();
    const rd = rounds[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("layers") + "<span>Arbre " + (i + 1) + "/" + rounds.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: rd.title })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: rd.instruction }));
    puzzle = createOrderList(rd.blocks, {});
    wrap.appendChild(el("div", { class: "section-title", text: "Widgets disponibles" }));
    wrap.appendChild(puzzle.root);
    const validateBtn = el("button", { class: "btn btn-flutter btn-block", disabled: true, onclick: () => { validateBtn.disabled = true; validate(rd); } }, iconEl("check"), el("span", { text: "Valider l'arbre" }));
    const obs = new MutationObserver(() => { validateBtn.disabled = !puzzle.isComplete(); });
    obs.observe(puzzle.root, { childList: true, subtree: true });
    session.onCleanup(() => obs.disconnect());
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
  }
  function validate(rd) {
    const ok = checkOrder(puzzle.getOrder(), rd.variants);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (!ok) {
      firstTry = false;
      feedback.show("ko", "Hiérarchie incorrecte", "<p>Le framework ne peut pas construire l'arbre tel qu'écrit : un Widget doit être enfant d'un parent qui l'accepte (child, children…). Vérifie l'imbrication des parenthèses et le rôle de chaque Widget.</p>");
      clearNode(actionBox);

GAME_FACTORIES["target-ui"] = function (session) {
  const TOTAL_TIME = 75;
  let remaining = TOTAL_TIME, cdId = null, promptTimer = null, level = 1, score = 0, correctCount = 0, idx = 0, answered = false, over = false, prompts = [], currentTargets = [];
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const hud = el("div", { class: "stack", style: "gap:5px;display:none" });
  const timeFill = el("div", { class: "progress-fill flutter", style: "width:100%" });
  const timeLabel = el("span", { class: "meta", text: "75 s" });
  hud.appendChild(el("div", { class: "row" }, [el("span", { class: "meta grow", text: "Temps restant" }), timeLabel]));
  hud.appendChild(el("div", { class: "progress", role: "progressbar", "aria-label": "Temps restant" }, timeFill));
  session.body.appendChild(hud);
  session.body.appendChild(wrap);
  session.onKey(e => {
    if (!/^[1-4]$/.test(e.key) || answered || over) return;
    const btn = currentTargets[Number(e.key) - 1];
    if (btn) { e.preventDefault(); btn.click(); }
  });

  function promptTime() { return level === 1 ? 9 : level === 2 ? 7 : level === 3 ? 5.5 : 4.5; }
  function stopTimers() { if (cdId) { clearInterval(cdId); cdId = null; } if (promptTimer) { clearTimeout(promptTimer); promptTimer = null; } }
  session.onCleanup(stopTimers);

  function begin() {
    prompts = shuffle(TARGET_PROMPTS);
    idx = 0; score = 0; correctCount = 0; level = 1; over = false; remaining = TOTAL_TIME;
    session.setScore(0);
    session.startClock();
    session.setExtra("Niveau 1");
    cdId = setInterval(() => {
      remaining -= 0.5;
      if (remaining <= 0) { endGame(); return; }
    }, 500);
    nextPrompt();
  }
  function nextPrompt() {
    if (over) return;
    if (idx >= prompts.length) { prompts = shuffle(TARGET_PROMPTS); idx = 0; }
    const p = prompts[idx++];
    answered = false;
    clearNode(wrap);
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip flutter", html: icon("target") + "<span>Cible à trouver</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "chip", html: icon("clock") + "<span>" + promptTime().toFixed(1) + " s</span>" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:15px;font-weight:650", text: p.q })));
    const grid = el("div", { class: "target-grid" });
    currentTargets = [];
    shuffle(p.options.slice()).forEach(opt => {
      const btn = el("button", {
        class: "target", text: opt,
        onclick: () => { if (answered) return; answered = true; pick(p, opt, btn); }
      });
      currentTargets.push(btn);
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    wrap.appendChild(el("div", { class: "key-hint" }, [
      el("kbd", { text: "1" }), el("kbd", { text: "2" }), el("kbd", { text: "3" }), el("kbd", { text: "4" }),
      el("span", { text: "pour toucher une cible" })
    ]));
    feedback.clear();
    wrap.appendChild(feedback);
    promptTimer = setTimeout(() => {
      if (answered || over) return;
      answered = true;
      session.addAnswer(false);
      feedback.show("ko", "Trop lent", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>. " + escapeHtml(p.e) + "</p>");
      promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 2000);
    }, promptTime() * 1000);
  }
  function pick(p, opt, btn) {
    if (promptTimer) { clearTimeout(promptTimer); promptTimer = null; }
    const ok = opt === p.correct;
    session.addAnswer(ok);
    if (ok) {
      correctCount++;
      score += 100;
      level = Math.min(4, 1 + Math.floor(correctCount / 4));
      session.setScore(score);
      session.setExtra("Niveau " + level);
      btn.classList.add("good");
      feedback.show("ok", "Touché ! +100 pts", "<p>" + escapeHtml(p.e) + "</p>");
    } else {
      btn.classList.add("bad");
      $$(".target", wrap).forEach(t => { if (t.textContent === p.correct) t.classList.add("good"); });
      feedback.show("ko", "Raté", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>. " + escapeHtml(p.e) + "</p>");
    }
    promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1900);
  }
  function endGame() {
    if (over) return;
    over = true;
    stopTimers();
    currentTargets = [];
    session.finish({
      score, win: score >= 800,
      title: score >= 800 ? "Précision au rendez-vous" : "Fin du chrono",
      extras: [{ label: "Cibles touchées", value: String(correctCount) }, { label: "Niveau atteint", value: String(level) }]
    });
  }
  return {
    start: () => {
      clearNode(wrap);
      wrap.appendChild(gameIntro(GAMES["target-ui"]));
      wrap.appendChild(el("button", { class: "btn btn-flutter btn-block", onclick: begin }, iconEl("play"), el("span", { text: "Démarrer (75 s)" })));
    },
    pause() { stopTimers(); },
    resume() {
      if (over) return;
      if (!cdId) cdId = setInterval(() => { remaining -= 0.5; if (remaining <= 0) endGame(); }, 500);
      if (!promptTimer && !answered) {
        promptTimer = setTimeout(() => {
          promptTimer = null;
          if (answered || over) return;
          const p = prompts[idx - 1];
          answered = true;
          session.addAnswer(false);
          feedback.show("ko", "Trop lent", "<p>La bonne réponse était : <b>" + escapeHtml(p.correct) + "</b>.</p>");
          promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1600);
        }, 2500);
      } else if (!promptTimer && answered) {
        promptTimer = setTimeout(() => { promptTimer = null; nextPrompt(); }, 1600);
      }
    },
    destroy() { stopTimers(); }
  };
};

    wrap._pool = pool;
  }
  function select(btn) {
    if (validated) return;
    if (lockedItems[btn.dataset.id]) return;
    $$(".class-item.sel", wrap).forEach(b => b.classList.remove("sel"));
    if (selected === btn) { selected = null; return; }
    btn.classList.add("sel");
    selected = btn;
  }
  function place(col) {
    if (!selected || validated || lockedItems[selected.dataset.id]) return;
    col.appendChild(selected);
    selected.classList.remove("sel");
    selected = null;
    const vb = $(".btn", actionBox);
    if (vb) vb.disabled = false;
  }
  function validate(rd, grid) {
    const items = $$(".class-item", grid);
    if (items.length !== rd.items.length) {
      feedback.show("info", "Classement incomplet", "<p>Place les " + rd.items.length + " éléments dans les couches avant de valider.</p>");
      return;
    }
    let allCorrect = true;
    if (!answered) {
      allCorrect = items.every(b => b.parentElement.dataset.zone === rd.items.find(x => x.id === b.dataset.id).zone);
      session.addAnswer(allCorrect);
      answered = true;
      if (!allCorrect) firstTry = false;
    }
    let wrongCount = 0;
    items.forEach(b => {
      const it = rd.items.find(x => x.id === b.dataset.id);
      const ok = b.parentElement.dataset.zone === it.zone;
      b.classList.remove("good", "bad");
      b.classList.add(ok ? "good" : "bad");
      if (!ok) wrongCount++;
    });
    validated = true;
    if (wrongCount === 0) {
      solved++;
      session.setScore(session.score + (firstTry ? 100 : 60));
      const whys = rd.items.map(it => "• " + it.label + " → " + it.why).join("<br>");
      feedback.show("ok", "Classement correct (+" + (firstTry ? 100 : 60) + " pts)", "<p>" + whys + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= rounds.length ? "Terminer" : "Série suivante", () => {
        if (idx + 1 >= rounds.length) {
          session.finish({
            score: session.score, win: solved === rounds.length,
            title: solved === rounds.length ? "Architecture Flutter rangée" : "Série terminée",
            extras: [{ label: "Séries réussies", value: solved + "/" + rounds.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      validated = false;
      items.forEach(b => {
        if (b.classList.contains("bad")) { b.classList.remove("bad"); wrap._pool.appendChild(b); }
        else lockedItems[b.dataset.id] = true;
      });
      const vb = $(".btn", actionBox); if (vb) vb.disabled = true;
      feedback.show("ko", wrongCount + " élément(s) à corriger", "<p>Les éléments justes sont verrouillés. Touche un élément de la liste puis la bonne couche, et revérifie.</p>");
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

function makeCanvas() {
  const canvas = el("canvas", { class: "game", "aria-label": "Zone de jeu" });
  return canvas;
}
function setupHiDPI(canvas, w, h) {
  const dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.aspectRatio = w + " / " + h;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function buildDpad(onDir) {
  const dpad = el("div", { class: "dpad", "aria-label": "Commandes directionnelles" });
  const defs = [
    ["", "up", "Haut"], ["left", "left", "Gauche"], ["", "down", "Bas"], ["right", "right", "Droite"]
  ];
  const up = el("button", { "aria-label": "Haut", onclick: () => onDir("up") }); up.innerHTML = icon("arrowUp");
  const left = el("button", { "aria-label": "Gauche", onclick: () => onDir("left") }); left.innerHTML = icon("back");
  const down = el("button", { "aria-label": "Bas", onclick: () => onDir("down") }); down.innerHTML = icon("arrowDown");
  const right = el("button", { "aria-label": "Droite", onclick: () => onDir("right") }); right.innerHTML = icon("chevron");
  const center = el("div", {});
  dpad.appendChild(el("div", {})); dpad.appendChild(up); dpad.appendChild(el("div", {}));
  dpad.appendChild(left); dpad.appendChild(center); dpad.appendChild(right);
  dpad.appendChild(el("div", {})); dpad.appendChild(down); dpad.appendChild(el("div", {}));
  return dpad;
}
function attachSwipe(node, onDir) {
  let sx = 0, sy = 0, tracking = false, pid = null;
  function start(e) {
    if (e.pointerType === "mouse" && e.buttons !== 1) return;
    sx = e.clientX; sy = e.clientY; tracking = true; pid = e.pointerId;
    try { node.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  function end(e) {
    if (!tracking || (pid !== null && e.pointerId !== pid)) return;
    tracking = false; pid = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    onDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }
  function cancel() { tracking = false; pid = null; }
  node.addEventListener("pointerdown", start);
  node.addEventListener("pointerup", end);
  node.addEventListener("pointercancel", cancel);
  return () => {
    node.removeEventListener("pointerdown", start);
    node.removeEventListener("pointerup", end);
    node.removeEventListener("pointercancel", cancel);
  };
}

GAME_FACTORIES["snake"] = function (session) {
  const COLS = 16, ROWS = 20, OBJECTIF = 10;
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("target") + "<span>Objectif : " + OBJECTIF + " données</span>" }),
    el("span", { class: "grow" }),

  ]);
  const actionBox = el("div");
  session.body.appendChild(hud);
  session.body.appendChild(canvas);
  session.body.appendChild(actionBox);

  let ctx = null, cell = 24, snake = [], dir = { x: 0, y: -1 }, dirQueue = [], food = null, eaten = 0, rafId = null, last = 0, acc = 0, paused = false, over = false, detachSwipe = null, wrapMode = false, started = false;

  }
  function placeFood() {

      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function setDir(d) {
    const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const nd = map[d];
    if (!nd) return;
    const lastDir = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nd.x === -lastDir.x && nd.y === -lastDir.y) return; /* pas de demi-tour */
    if (nd.x === lastDir.x && nd.y === lastDir.y) return;
    if (dirQueue.length < 2) dirQueue.push(nd);
  }
  function stepInterval() { return Math.max(85, 175 - eaten * 8); }
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      if (!wrapMode) { endGame(); return; }
      head.x = (head.x + COLS) % COLS;
      head.y = (head.y + ROWS) % ROWS;
    }
    if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) { endGame(); return; }
    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      eaten++;
      session.setScore(eaten * 50);
      session.setExtra((wrapMode ? "Sans murs · " : "") + eaten + "/" + OBJECTIF);
      const n = $("#snake-n", hud); if (n) n.textContent = String(eaten);
      vibrate(10);
      if (eaten >= OBJECTIF) { placeFood(); endGame(); return; }
      placeFood();
    } else snake.pop();
  }
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#0B111C";
    ctx.fillRect(0, 0, cell * COLS, cell * ROWS);
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, ROWS * cell); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(COLS * cell, y * cell); ctx.stroke(); }
    if (food) {
      ctx.save();
      ctx.shadowColor = "#F59E0B";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#FBBF24";
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.3, 0, Math.PI * 2);

      ctx.restore();
      ctx.fillStyle = "#78350F";

      ctx.beginPath();

    });
    if (snake.length && cell > 12) {
      const h = snake[0], cx = h.x * cell + cell / 2, cy = h.y * cell + cell / 2;
      const off = cell * 0.17;
      ctx.fillStyle = "#0B111C";
      ctx.beginPath();
      ctx.arc(cx - (dir.y ? off : 0) + (dir.x ? dir.x * off : 0), cy - (dir.x ? off : 0) + (dir.y ? dir.y * off : 0), Math.max(1.5, cell * 0.075), 0, Math.PI * 2);
      ctx.arc(cx + (dir.y ? off : 0) + (dir.x ? dir.x * off : 0), cy + (dir.x ? off : 0) + (dir.y ? dir.y * off : 0), Math.max(1.5, cell * 0.075), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function loop(t) {
    if (paused || over) return;

    acc += t - last;

  function endGame() {

    over = true;
    draw();

      score: eaten * 50, win: eaten >= OBJECTIF,
      title: eaten >= OBJECTIF ? "Objectif atteint" : "Collision détectée",
      extras: [{ label: "Données mangées", value: eaten + "/" + OBJECTIF }]

  }

  session.onCleanup(() => { if (detachSwipe) detachSwipe(); });
  session.onResize(() => { if (started) { cellSize(); draw(); } });
  session.onKey(e => {
    if (!started || over) return;
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", z: "up", q: "left" };
    const d = map[e.key] || map[e.key.toLowerCase()];

  });
  function launch(wrap) {
    wrapMode = !!wrap;
    started = true;
    hud.style.display = "";
    canvas.style.display = "";
    clearNode(actionBox);
    cellSize();
    reset();
    actionBox.appendChild(buildDpad(setDir));
    actionBox.appendChild(el("div", { class: "key-hint" }, [
      el("kbd", { text: "←↑↓→" }), el("span", { text: "ou" }),
      el("kbd", { text: "WASD" }), el("span", { text: "diriger ·" }),
      el("kbd", { text: "Espace" }), el("span", { text: "pause" })
    ]));

    rafId = requestAnimationFrame(loop);
  }
  return {
    start() {

      canvas.style.display = "none";
      clearNode(actionBox);
      actionBox.appendChild(gameIntro(GAMES["snake"]));
      actionBox.appendChild(el("div", { class: "duo", style: "margin-top:10px" }, [
        el("button", { class: "btn btn-arcade", onclick: () => launch(false) }, iconEl("shield"), el("span", { text: "Classique" })),
        el("button", { class: "btn", onclick: () => launch(true) }, iconEl("rotate"), el("span", { text: "Sans murs" }))
      ]));
      actionBox.appendChild(el("p", { class: "meta", style: "margin-top:9px", text: "Classique : les murs sont mortels. Sans murs : traverse le plateau pour ressortir de l'autre côté." }));
    },
    pause() { paused = true; if (rafId) cancelAnimationFrame(rafId); rafId = null; },
    resume() { if (over || !started) return; paused = false; last = 0; rafId = requestAnimationFrame(loop); },
    destroy() { over = true; if (rafId) cancelAnimationFrame(rafId); }
  };
};

GAME_FACTORIES["breakout"] = function (session) {
  const W = 360, H = 480, COLS = 7, ROWS = 5, MAX_LEVEL = 3;
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("layers") + "<span id='bo-level'>Niveau 1</span>" }),
    el("span", { class: "chip", html: icon("shield") + "<span id='bo-lives'>3 vies</span>" }),
    el("span", { class: "grow" })
  ]);
  const hint = el("div", { class: "key-hint" }, [
    el("kbd", { text: "←" }), el("kbd", { text: "→" }), el("span", { text: "déplacer ·" }),
    el("kbd", { text: "Espace" }), el("span", { text: "lancer · glisse au doigt ou à la souris" })
  ]);
  session.body.appendChild(hud);
  session.body.appendChild(canvas);
  session.body.appendChild(hint);

  let ctx = null, paddle, ball, bricks, lives, level, score = 0, rafId = null, paused = false, over = false, waiting = true;
  const palette = ["#22D3EE", "#38BDF8", "#67E8F9", "#0EA5E9", "#F59E0B"];
  function buildLevel() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (level === 3 && (r + c) % 3 === 0) continue;
        bricks.push({ x: c * (W / COLS) + 3, y: 46 + r * 24, w: W / COLS - 6, h: 17, alive: true, color: palette[r % palette.length] });
      }
    }
  }
  function resetBall() {
    paddle = { x: W / 2 - 42, w: 84, h: 11, y: H - 34 };
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 9, r: 6, vx: 0, vy: 0 };
    waiting = true;
  }
  function updateHud() {
    const l1 = $("#bo-level", hud), l2 = $("#bo-lives", hud);
    if (l1) l1.textContent = "Niveau " + level;
    if (l2) l2.textContent = lives + " vie" + (lives > 1 ? "s" : "");
    session.setExtra("Niv. " + level + " · " + lives + " vie" + (lives > 1 ? "s" : ""));
  }
  function movePaddleTo(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
  }
  function launch() {
    if (!waiting || over) return;
    waiting = false;
    const speed = 2.7 + level * 0.55;
    const angle = (Math.random() - 0.5) * 0.55;
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
    if (!session.running) session.startClock();
    if (!rafId) rafId = requestAnimationFrame(loop);
  }
  function tick() {
    if (waiting) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }
    const sub = 5;
    for (let i = 0; i < sub; i++) {
      ball.x += ball.vx / sub;
      ball.y += ball.vy / sub;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 && ball.x >= paddle.x - 2 && ball.x <= paddle.x + paddle.w + 2) {
        ball.vy = -Math.abs(ball.vy);
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hit * 3.6;
      }
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapY < overlapX) ball.vy = -ball.vy; else ball.vx = -ball.vx;
          score += 10 * level;
          session.setScore(score);
          vibrate(8);
          break;
        }
      }
    }
    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) { endGame(false); return; }
      resetBall();
      return;
    }
    if (!bricks.some(b => b.alive)) {
      score += 100;
      session.setScore(score);
      if (level >= MAX_LEVEL) { endGame(true); return; }
      level++;
      buildLevel();
      resetBall();
      updateHud();
    }
  }
  function draw() {
    if (!ctx) return;
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0B111C"); bg.addColorStop(1, "#0E1A2B");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      else ctx.rect(b.x, b.y, b.w, b.h);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.22)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
    });
    const pg = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    pg.addColorStop(0, "#67E8F9"); pg.addColorStop(1, "#0EA5E9");
    ctx.fillStyle = pg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    else ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fill();
    ctx.save();
    ctx.shadowColor = "#FBBF24"; ctx.shadowBlur = 15;
    ctx.fillStyle = "#FDE68A";
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (waiting) {
      ctx.fillStyle = "rgba(11,17,28,.72)";
      ctx.fillRect(0, H / 2 - 50, W, 100);
      ctx.fillStyle = "#E0F2FE";
      ctx.textAlign = "center";
      ctx.font = "700 16px system-ui,sans-serif";
      ctx.fillText(level > 1 ? "Niveau " + level : "Prêt ?", W / 2, H / 2 - 10);
      ctx.fillStyle = "#94A3B8";
      ctx.font = "12px system-ui,sans-serif";
      ctx.fillText("Touche, clique ou Espace pour lancer", W / 2, H / 2 + 16);
    }
  }
  function loop() {
    rafId = null;
    if (paused || over) return;
    tick();
    draw();
    if (!over) rafId = requestAnimationFrame(loop);
  }
  function endGame(win) {
    if (over) return;
    over = true;
    if (rafId) cancelAnimationFrame(rafId);
    draw();
    session.finish({
      score, win, title: win ? "Tous les murs sont tombés" : "Plus de vies",
      extras: [{ label: "Niveau atteint", value: String(level) + "/" + MAX_LEVEL }, { label: "Briques", value: String(bricks.filter(b => !b.alive).length) }]
    });
  }
  function onPointerDown(e) {
    movePaddleTo(e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    launch();
  }
  function onPointerMove(e) {
    if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) movePaddleTo(e.clientX);
  }
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  session.onCleanup(() => {
    canvas.removeEventListener("pointerdown", onPointerDown);
    canvas.removeEventListener("pointermove", onPointerMove);
  });
  session.onKey(e => {
    if (over) return;
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "q") { e.preventDefault(); paddle.x = clamp(paddle.x - 30, 0, W - paddle.w); }
    else if (e.key === "ArrowRight" || e.key === "d") { e.preventDefault(); paddle.x = clamp(paddle.x + 30, 0, W - paddle.w); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); launch(); }
  });
  return {
    start() {
      ctx = setupHiDPI(canvas, W, H);
      level = 1; lives = 3; score = 0; over = false; paused = false;
      buildLevel(); resetBall(); updateHud();
      session.setScore(0);
      draw();
    },
    pause() { paused = true; if (rafId) cancelAnimationFrame(rafId); rafId = null; },
    resume() { if (over) return; paused = false; if (!waiting && !rafId) rafId = requestAnimationFrame(loop); },
    destroy() { over = true; if (rafId) cancelAnimationFrame(rafId); }
  };
};

GAME_FACTORIES["maze"] = function (session) {
  const LEVELS_MAZE = [
    { id: "easy", label: "Facile", cols: 13, rows: 9, mult: 1 },
    { id: "medium", label: "Moyen", cols: 19, rows: 13, mult: 1.5 },
    { id: "hard", label: "Difficile", cols: 27, rows: 17, mult: 2.2 }
  ];
  const canvas = makeCanvas();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("target") + "<span id='mz-moves'>0 pas</span>" }),
    el("span", { class: "grow" })
  ]);
  const actionBox = el("div");
  session.body.appendChild(hud);
  session.body.appendChild(canvas);
  session.body.appendChild(actionBox);

  let ctx = null, grid = null, cols = 0, rows = 0, cell = 20, player = null, exit = null, moves = 0, mult = 1, over = false, paused = false, detachSwipe = null, trail = new Set();
  function generate(c, r) {
    /* parcours en profondeur aléatoire : tous les labyrinthes sont résolubles */
    const g = new Array(r);
    for (let y = 0; y < r; y++) { g[y] = new Array(c).fill(0); }
    const stack = [{ x: 1, y: 1 }];
    g[1][1] = 1;
    const dirs = [{ x: 2, y: 0 }, { x: -2, y: 0 }, { x: 0, y: 2 }, { x: 0, y: -2 }];
    while (stack.length) {
      const cur = stack[stack.length - 1];
      const options = shuffle(dirs).filter(d => {
        const nx = cur.x + d.x, ny = cur.y + d.y;
        return nx > 0 && ny > 0 && nx < c - 1 && ny < r - 1 && g[ny][nx] === 0;
      });
      if (!options.length) { stack.pop(); continue; }
      const d = options[0];
      g[cur.y + d.y / 2][cur.x + d.x / 2] = 1;
      g[cur.y + d.y][cur.x + d.x] = 1;
      stack.push({ x: cur.x + d.x, y: cur.y + d.y });
    }
    return g;
  }
  function newMaze(config) {
    cols = config.cols;
    rows = config.rows;
    if (cols % 2 === 0) cols++;
    if (rows % 2 === 0) rows++;
    mult = config.mult;
    grid = generate(cols, rows);
    player = { x: 1, y: 1 };
    exit = { x: cols - 2, y: rows - 2 };
    moves = 0; over = false; paused = false; trail = new Set(["1,1"]);
    resizeCanvas();
    draw();
    const m = $("#mz-moves", hud); if (m) m.textContent = "0 pas";
    session.setScore(0);
  }
  function resizeCanvas() {
    const w = Math.min(session.body.clientWidth - 28 || 320, 560);
    cell = Math.max(8, Math.floor(w / cols));
    ctx = setupHiDPI(canvas, cell * cols, cell * rows);
  }
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#0B111C";
    ctx.fillRect(0, 0, cell * cols, cell * rows);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (grid[y][x] === 0) {
          ctx.fillStyle = "#182131";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        } else if (trail.has(x + "," + y)) {
          ctx.fillStyle = "rgba(34,211,238,.14)";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
    }
    ctx.save();
    ctx.shadowColor = "#10B981"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#34D399";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(exit.x * cell + 2, exit.y * cell + 2, cell - 4, cell - 4, Math.max(2, cell * .18));
    else ctx.rect(exit.x * cell + 2, exit.y * cell + 2, cell - 4, cell - 4);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#FBBF24";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(player.x * cell + 2, player.y * cell + 2, cell - 4, cell - 4, Math.max(2, cell * .22));
    else ctx.rect(player.x * cell + 2, player.y * cell + 2, cell - 4, cell - 4);
    ctx.fill();
  }
  function tryMove(d) {
    if (over || paused || !grid) return;
    const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const nd = map[d];
    if (!nd) return;
    const nx = player.x + nd.x, ny = player.y + nd.y;
    if (ny < 0 || nx < 0 || ny >= rows || nx >= cols || grid[ny][nx] === 0) { vibrate(6); return; }
    player.x = nx; player.y = ny;
    trail.add(nx + "," + ny);
    moves++;
    const m = $("#mz-moves", hud);
    if (m) m.textContent = moves + " pas";
    session.setScore(Math.max(0, Math.round((1000 - moves * 4 - Math.round(session.elapsed / 1000) * 3) * mult)));
    draw();
    if (player.x === exit.x && player.y === exit.y) {
      over = true;
      const finalScore = Math.max(50, Math.round((1200 - moves * 4 - Math.round(session.elapsed / 1000) * 3) * mult));
      session.finish({
        score: finalScore, win: true, title: "Sortie atteinte",
        extras: [{ label: "Pas", value: String(moves) }, { label: "Difficulté", value: LEVELS_MAZE.find(l => l.mult === mult).label }]
      });
    }
  }
  detachSwipe = attachSwipe(canvas, tryMove);
  session.onCleanup(() => { if (detachSwipe) detachSwipe(); });
  session.onKey(e => {
    if (!grid || over) return;
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", z: "up", q: "left" };
    const dir = map[e.key] || map[e.key.toLowerCase()];
    if (dir) { e.preventDefault(); tryMove(dir); }
    else if (e.key === " ") { e.preventDefault(); Engine.togglePause(); }
  });
  session.onResize(() => { if (grid && !over) { resizeCanvas(); draw(); } });
  return {
    start() {
      clearNode(actionBox);
      canvas.style.display = "none";
      hud.style.display = "none";
      const intro = el("div", { class: "stack" }, [
        el("h2", { text: "Choisis la difficulté" }),
        el("p", { class: "card-sub", text: "Le labyrinthe est généré à la volée et toujours résoluble. Objectif : atteindre la case verte." })
      ]);
      LEVELS_MAZE.forEach(cfg => {
        intro.appendChild(el("button", {
          class: "lrow", onclick: () => {
            intro.remove();
            canvas.style.display = "";
            hud.style.display = "";
            newMaze(cfg);
            clearNode(actionBox);
            actionBox.appendChild(buildDpad(tryMove));
            actionBox.appendChild(el("div", { class: "key-hint" }, [
              el("kbd", { text: "←↑↓→" }), el("span", { text: "ou" }),
              el("kbd", { text: "WASD" }), el("span", { text: "pour te déplacer" })
            ]));
            session.startClock();
          }
        }, [
          el("span", { class: "ico-box", html: icon("compass") }),
          el("span", { class: "grow" }, [
            el("span", { class: "lrow-title", style: "display:block", text: cfg.label }),
            el("span", { class: "lrow-sub", style: "display:block", text: cfg.cols + " × " + cfg.rows + " cases · multiplicateur ×" + cfg.mult })
          ]),
          iconEl("chevron")
        ]));
      });
      session.body.insertBefore(intro, canvas);
      session.onCleanup(() => intro.remove());
    },
    pause() { paused = true; },
    resume() { paused = false; if (grid && !over) { resizeCanvas(); draw(); } },
    destroy() { over = true; }
  };
};

/* =========================================================================
   PWA : SERVICE WORKER, INSTALLATION, CONNECTIVITÉ
   ========================================================================= */
function safeBack() {
  if (history.length > 1) history.back();
  else Nav.go("#/home");
}
function registerServiceWorker() {
  if (typeof navigator === "undefined" || !("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return; /* hors contexte sécurisé : pas de Service Worker */
  navigator.serviceWorker.register("./sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener("statechange", () => {
        if (sw.state === "installed" && navigator.serviceWorker.controller) {
          toast("Mise à jour prête : recharge pour l'appliquer. Ta progression est préservée.", "info");
        }
      });
    });
  }).catch(err => {
    if (typeof console !== "undefined") console.warn("[DevMaster] Service Worker indisponible :", err && err.message);
  });
}
function bindInstallPrompt() {
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    /* on conserve l'invite pour le bouton du Profil, sans message répété */
    App.deferredInstall = e;
  });
  window.addEventListener("appinstalled", () => {
    App.deferredInstall = null;
    toast("DevMaster installé sur l'écran d'accueil.", "success");
  });
}
function bindNetwork() {
  window.addEventListener("online", () => { refreshNetChip(); toast("Connexion rétablie.", "success"); });
  window.addEventListener("offline", () => { refreshNetChip(); toast("Hors ligne : les jeux restent disponibles.", "info"); });
}

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
function initApp() {
  App.state = loadProgress();
  document.body.classList.toggle("reduced", !!(App.state.prefs.reducedFx || prefersReduced));
  Tracker.ensureDay();
  if (App.saveError) {
    toast("Sauvegarde locale illisible : un profil vierge a été chargé.", "error");
    saveProgress();
  }
  window.addEventListener("hashchange", Nav.render);
  bindNetwork();
  bindInstallPrompt();
  Nav.render();
  registerServiceWorker();
  Badges.check();
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
  else initApp();
}
</script>
