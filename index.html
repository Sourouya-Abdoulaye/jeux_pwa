<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevMaster — Apprends React &amp; Flutter en jouant</title>
<meta name="description" content="DevMaster : application d'apprentissage interactive pour maîtriser React.js et Flutter grâce à des mini-jeux pédagogiques. Fonctionne hors ligne.">
<meta name="theme-color" content="#0A0D14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#0A0D14; --bg2:#0E1420; --surface:#121824; --surface2:#182131;
  --border:rgba(255,255,255,.07); --border-active:rgba(255,255,255,.15);
  --text:#F1F5F9; --text2:#94A3B8; --text3:#64748B;
  --react:#00D8FF; --react2:#67E8F9; --flutter:#02569B; --flutter2:#38BDF8;
  --success:#10B981; --error:#F43F5E; --xp:#F59E0B;
  --r:14px; --r-sm:10px; --nav-h:62px; --top-h:56px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
/* taille par défaut des icônes : tout SVG sans largeur explicite reste compact
   (les règles par composant, écrites ensuite, continuent de prédominer) */
svg:not([width]){width:18px;height:18px;flex:none}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#view{flex:1;padding:14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));outline:none}
body.in-game #bottomnav{display:none}
body.in-game #view{padding:0 0 12px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:23px;line-height:1.25}
h2{font-size:17px}
h3{font-size:14.5px}
p{margin:0}
a{color:var(--react2)}
button{font-family:inherit;font-size:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.86em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(10,13,20,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,#123040,#0E1420);border:1px solid rgba(0,216,255,.35);display:grid;place-items:center;color:var(--react);font-family:var(--mono);font-size:12px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.net-dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:3px 8px}
.net-dot svg{width:13px;height:13px}
.net-dot.off{color:var(--xp);border-color:rgba(245,158,11,.35)}
.avatar-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-active);background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar{width:24px;height:24px;display:block}
/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(14,20,32,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-inner{display:flex;width:100%;max-width:560px}
.nav-item{
  flex:1;min-height:var(--nav-h);background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text3);font-size:11px;font-weight:550;padding:6px 2px;position:relative;
}
.nav-item svg{width:21px;height:21px}
.nav-item.active{color:var(--text)}
.nav-item.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;background:var(--react)}
/* ---------- generic ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;transition:border-color .15s ease, transform .12s ease;
}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap:hover{border-color:var(--border-active)}
.card.tap:active{transform:scale(.99)}
.card-title{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--text2)}
.card-sub{font-size:12.5px;color:var(--text2);margin-top:3px}
.meta{font-size:11.5px;color:var(--text3)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.section-title{font-size:12px;font-weight:650;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:6px 2px}
.divider{height:1px;background:var(--border);border:0;margin:2px 0}
/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 16px;border-radius:var(--r-sm);cursor:pointer;
  border:1px solid var(--border-active);background:var(--surface2);color:var(--text);
  font-weight:600;font-size:14px;transition:background .15s ease,border-color .15s ease,transform .1s ease;
}
.btn svg{width:17px;height:17px}
.btn:hover{background:#1E293B}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--react);outline-offset:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{
  background:linear-gradient(180deg,#3EE3FF 0%,#00BEE2 100%);border-color:#00C6E9;color:#03212B;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -12px rgba(0,216,255,.65);
}
.btn-primary:hover{background:linear-gradient(180deg,#5EE9FF 0%,#0EC8EA 100%);border-color:#22DDFA}
.btn-flutter{
  background:linear-gradient(180deg,#6BD1F9 0%,#2BA5E7 100%);border-color:#38BDF8;color:#052641;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px -12px rgba(56,189,248,.6);
}
.btn-flutter:hover{background:linear-gradient(180deg,#7FD8FB 0%,#38B2EE 100%);border-color:#5ECDF7}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-danger{background:transparent;border-color:rgba(244,63,94,.45);color:#FDA4AF}
.btn-danger:hover{background:rgba(244,63,94,.12)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn-icon{min-width:44px;padding:0 10px}
/* chips, badges */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:3px 9px;background:var(--bg2)}
.chip svg{width:13px;height:13px}
.chip.react{color:var(--react2);border-color:rgba(0,216,255,.3)}
.chip.flutter{color:var(--flutter2);border-color:rgba(56,189,248,.3)}
.chip.xp{color:var(--xp);border-color:rgba(245,158,11,.35)}
.chip.ok{color:var(--success);border-color:rgba(16,185,129,.35)}
.chip.ko{color:#FDA4AF;border-color:rgba(244,63,94,.35)}
.badge-ico{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:700}
/* progress */
.progress{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;border-radius:99px;background:var(--react);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-fill.flutter{background:var(--flutter2)}
.progress-fill.xp{background:var(--xp)}
.progress-fill.ok{background:var(--success)}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;text-align:center}
.stat-value{font-size:16px;font-weight:700;letter-spacing:-.02em}
.stat-label{font-size:10.5px;color:var(--text3);margin-top:1px}
/* forms */
label.field{display:block;font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:6px}
.input,textarea.input{
  width:100%;min-height:44px;background:var(--bg2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;
}
.input:focus{outline:2px solid var(--react);outline-offset:1px}
textarea.input{min-height:110px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.switch-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--border-active);transition:background .15s ease}
.slider::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text3);transition:transform .15s ease, background .15s ease}
.switch input:checked + .slider{background:rgba(0,216,255,.25);border-color:var(--react)}
.switch input:checked + .slider::after{transform:translateX(19px);background:var(--react)}
.switch input:focus-visible + .slider{outline:2px solid var(--react);outline-offset:2px}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s ease}
.lrow:hover{border-color:var(--border-active)}
.lrow .ico-box{width:38px;height:38px;flex:none;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;color:var(--text2)}
.lrow .ico-box svg{width:19px;height:19px}
.lrow>svg{color:var(--text3);flex:none}
.lrow-title{font-size:14px;font-weight:650}
.lrow-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
/* ---------- game shell ---------- */
.game-shell{display:flex;flex-direction:column;min-height:100dvh}
.game-head{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
  background:rgba(10,13,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.game-head .title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-btn{min-width:44px;min-height:44px;display:grid;place-items:center;background:none;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;color:var(--text2)}
.head-btn svg{width:19px;height:19px}
.head-btn:hover{color:var(--text);border-color:var(--border-active)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 10px;color:var(--text)}
.pill svg{width:13px;height:13px;color:var(--text3)}
.game-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
/* code blocks / pre */
pre.code{
  background:#0B111C;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px;overflow-x:auto;margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#D7E3F4;
}
.code .k{color:#C084FC}.code .s{color:#86EFAC}.code .c{color:var(--text3)}.code .t{color:var(--react2)}
/* ordering puzzle */
.order-list{display:flex;flex-direction:column;gap:8px;min-height:70px;border:1px dashed var(--border-active);border-radius:var(--r-sm);padding:9px;background:rgba(255,255,255,.02)}
.order-item{
  display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);padding:9px 10px;font-family:var(--mono);font-size:12.5px;line-height:1.45;
}
.order-item .txt{flex:1;min-width:0;word-break:break-word}
.order-item.used{opacity:.35;pointer-events:none}
.mini-btn{min-width:34px;min-height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text2);padding:0}
.mini-btn:hover{color:var(--text);border-color:var(--border-active)}
.mini-btn svg{width:15px;height:15px}
.mini-btn.danger:hover{color:#FDA4AF;border-color:rgba(244,63,94,.4)}
/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem-card{aspect-ratio:.78;perspective:800px;background:none;border:0;padding:0;cursor:pointer}
.mem-inner{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.mem-card.flipped .mem-inner,.mem-card.matched .mem-inner{transform:rotateY(180deg)}
.mem-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);
  display:grid;place-items:center;padding:6px;text-align:center;
}
.mem-face.front{color:var(--text3);font-family:var(--mono);font-weight:700;font-size:15px}
.mem-face.back{transform:rotateY(180deg);background:var(--surface);border-color:rgba(0,216,255,.35);font-size:10.5px;line-height:1.3;font-weight:600;color:var(--text)}
.mem-card.matched .mem-face.back{border-color:rgba(16,185,129,.5);color:var(--success)}
/* feedback */
.feedback{border-radius:var(--r-sm);border:1px solid var(--border);padding:11px 12px;font-size:13px;line-height:1.5}
.feedback.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.feedback.ko{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.07)}
.feedback.info{background:var(--bg2);color:var(--text2)}
.feedback .fb-title{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:13px}
.feedback .fb-title svg{width:15px;height:15px}
.feedback.ok .fb-title{color:var(--success)}
.feedback.ko .fb-title{color:#FDA4AF}
/* choice buttons */
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border-active);
  border-radius:var(--r-sm);padding:12px;cursor:pointer;font-size:14px;font-weight:550;color:inherit;
  display:flex;align-items:center;gap:10px;transition:border-color .15s ease,background .15s ease;
}
.choice:hover{border-color:var(--react)}
.choice:disabled{cursor:default}
.choice .key{width:24px;height:24px;flex:none;border-radius:7px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text3)}
.choice.good{border-color:rgba(16,185,129,.55);background:rgba(16,185,129,.1)}
.choice.bad{border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.08)}
.choice.good .key{color:var(--success);border-color:rgba(16,185,129,.5)}
.choice.bad .key{color:#FDA4AF;border-color:rgba(244,63,94,.5)}
/* two big buttons (vrai/faux, stateful/stateless) */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .btn{min-height:62px;font-size:15px;flex-direction:column;gap:4px}
.duo .btn svg{width:20px;height:20px}
/* targets */
.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target{
  min-height:66px;border-radius:var(--r);border:1px solid var(--border-active);background:var(--surface2);
  cursor:pointer;font-family:var(--mono);font-size:13.5px;font-weight:650;color:var(--text);
  display:grid;place-items:center;padding:10px;text-align:center;transition:transform .12s ease;
}
.target:active{transform:scale(.97)}
.target.good{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.12);color:var(--success)}
.target.bad{border-color:rgba(244,63,94,.55);background:rgba(244,63,94,.1);color:#FDA4AF}
/* flow / tree */
.tree{display:flex;flex-direction:column;gap:4px}
.tree-node{
  display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;font-family:var(--mono);font-size:13px;color:inherit;width:100%;text-align:left;
  transition:border-color .15s ease,background .15s ease;
}
.tree-node:hover{border-color:var(--border-active)}
.tree-node.selected{border-color:var(--react);background:rgba(0,216,255,.09)}
.tree-node.visited{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
.tree-node .val{margin-left:auto;font-size:11px;color:var(--xp);font-weight:600}
/* classification */
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.class-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:7px}
.class-col h4{margin:0 0 2px;font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.class-item{
  background:var(--surface2);border:1px solid var(--border-active);border-radius:9px;padding:7px 9px;
  font-size:11.5px;font-family:var(--mono);cursor:pointer;color:inherit;text-align:left;line-height:1.35;
}
.class-item.sel{border-color:var(--react);background:rgba(0,216,255,.1)}
.class-item.good{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.1)}
.class-item.bad{border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.08)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
/* decision (swipe) */
.dec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;touch-action:pan-y}
.swipe-hint{display:flex;justify-content:center;gap:8px;color:var(--text3);font-size:11px;align-items:center}
.swipe-hint svg{width:14px;height:14px}
/* result overlay */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,9,14,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}
.result{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border-active);
  border-radius:18px;padding:20px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2);text-align:center;
}
.result .r-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;border:1px solid var(--border)}
.result .r-icon.win{color:var(--success);border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.1)}
.result .r-icon.lose{color:var(--xp);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.result .r-icon svg{width:26px;height:26px}
.result h2{font-size:19px}
.result .r-score{font-family:var(--mono);font-size:30px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em}
.r-rows{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left}
.r-row{display:flex;justify-content:space-between;font-size:13px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.r-row span:first-child{color:var(--text2)}
.r-row b{font-family:var(--mono)}
/* toasts */
#toasts{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{
  background:var(--surface2);border:1px solid var(--border-active);border-radius:var(--r-sm);
  padding:10px 13px;font-size:13px;display:flex;align-items:center;gap:9px;
  animation:slidein .22s ease;box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.toast svg{width:17px;height:17px;flex:none}
.toast.success{border-color:rgba(16,185,129,.45)}.toast.success svg{color:var(--success)}
.toast.error{border-color:rgba(244,63,94,.5)}.toast.error svg{color:#FDA4AF}
.toast.xp{border-color:rgba(245,158,11,.5)}.toast.xp svg{color:var(--xp)}
/* modal */
.modal-backdrop{position:fixed;inset:0;z-index:70;background:rgba(6,9,14,.72);backdrop-filter:blur(4px);display:grid;place-items:end center;padding:0}
@media(min-width:560px){.modal-backdrop{place-items:center}}
.modal{
  width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--border-active);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideup .24s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:560px){.modal{border-radius:18px;padding-bottom:18px}}
.modal h2{margin-bottom:6px}
.modal-actions{display:flex;gap:9px;margin-top:16px}
.modal-actions .btn{flex:1}
/* level up */
.levelup{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.levelup svg{width:34px;height:34px}
.levelup .lvl-title{font-size:22px;font-weight:750;background:linear-gradient(90deg,var(--xp),#FCD34D);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
/* game-specific */
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,54px);gap:6px;justify-content:center;margin-top:6px}
.dpad button{border-radius:12px;border:1px solid var(--border-active);background:var(--surface2);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.dpad button:active{background:rgba(0,216,255,.14);color:var(--text)}
.dpad button svg{width:22px;height:22px}
canvas.game{width:100%;max-width:520px;margin:0 auto;display:block;border-radius:var(--r-sm);border:1px solid var(--border);background:#0B111C;touch-action:none}
.tap-zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tap-zone{min-height:96px;border-radius:var(--r);border:1px solid var(--border-active);background:var(--surface2);cursor:pointer;font-weight:700;font-size:14px;color:var(--text2);display:grid;place-items:center;gap:4px;user-select:none;touch-action:manipulation}
.tap-zone:active{background:rgba(245,158,11,.14);color:var(--text)}
.race-track{display:flex;flex-direction:column;gap:9px}
.race-lane{display:flex;align-items:center;gap:9px}
.race-lane .name{width:74px;font-size:11.5px;color:var(--text2);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-bar{flex:1;height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);overflow:hidden;position:relative}
.race-fill{height:100%;background:var(--text3);border-radius:99px;transition:width .12s linear}
.race-lane.you .race-fill{background:var(--xp)}
.race-lane.you .name{color:var(--xp)}
/* badges */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.badge-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;display:flex;gap:9px;align-items:flex-start}
.badge-card.locked{opacity:.5}
.badge-card .b-ico{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);color:var(--xp)}
.badge-card .b-ico svg{width:16px;height:16px}
/* streak days */
.days{display:flex;gap:6px}
.day{flex:1;text-align:center;font-size:10px;color:var(--text3)}
.day .d-dot{height:26px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:3px;color:var(--text3)}
.day .d-dot svg{width:14px;height:14px}
.day.on .d-dot{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45);color:var(--xp)}
.day.today .d-dot{outline:1px solid var(--border-active)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slidein{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
}
body.reduced *,body.reduced *::before,body.reduced *::after{animation-duration:.001s !important;transition-duration:.001s !important}
</style>

const GAME_IDS = Object.keys(GAMES);
function gamesOfDomain(domainId) { return GAME_IDS.filter(id => GAMES[id].domain === domainId); }
function gamesOfUniverse(uid) { return GAME_IDS.filter(id => GAMES[id].universe === uid); }

/* ------------------------------- App state ----------------------------- */
const App = { state: null, saveError: false, deferredInstall: null, route: "" };

function defaultState() {
  return {
    version: SAVE_VERSION,
    profile: { pseudonym: "", avatar: 0 },
    xp: 0,
    badges: [],
    firstBonus: [],
    records: {},
    runs: [],
    stats: {
      started: {}, finished: {}, wins: {},
      answers: { react: { c: 0, t: 0 }, flutter: { c: 0, t: 0 } },
      perGame: {},
      arcade: { runs: 0, wins: 0 },
      abandoned: {}
    },
    challenges: { date: "", progress: {} },
    activeDays: [],
    lastDomain: null,
    lastGame: null,
    prefs: { vibration: true, reducedFx: false },
    meta: { createdAt: Date.now(), updatedAt: Date.now() }
  };
}
function isPlainObject(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
function sanitizeState(raw) {
  if (!isPlainObject(raw)) return null;
  if (typeof raw.version !== "number" || raw.version > SAVE_VERSION) return null;
  const st = defaultState();
  if (isPlainObject(raw.profile)) {
    st.profile.pseudonym = typeof raw.profile.pseudonym === "string" ? raw.profile.pseudonym.slice(0, 24) : "";
    st.profile.avatar = clamp(Number(raw.profile.avatar) || 0, 0, AVATARS.length - 1);
  }
  st.xp = Math.max(0, Math.floor(Number(raw.xp) || 0));
  if (Array.isArray(raw.badges)) st.badges = raw.badges.filter(b => typeof b === "string").slice(0, 100);
  if (Array.isArray(raw.firstBonus)) st.firstBonus = raw.firstBonus.filter(b => typeof b === "string" && GAME_IDS.includes(b));
  if (isPlainObject(raw.records)) {
    for (const k of Object.keys(raw.records)) {
      if (!GAME_IDS.includes(k)) continue;
      const r = raw.records[k];
      if (isPlainObject(r) && typeof r.score === "number" && r.score >= 0) {
        st.records[k] = { score: Math.floor(r.score), date: typeof r.date === "string" ? r.date : "", mode: r.mode === "time" ? "time" : "score" };
      }
    }
  }
  if (Array.isArray(raw.runs)) {
    st.runs = raw.runs.filter(r => isPlainObject(r) && typeof r.gameId === "string" && GAME_IDS.includes(r.gameId)).slice(-120);
  }
  if (isPlainObject(raw.stats)) {
    const s = raw.stats;
    ["started", "finished", "wins", "abandoned"].forEach(k => {
      if (isPlainObject(s[k])) for (const g of Object.keys(s[k])) if (GAME_IDS.includes(g)) st.stats[k][g] = Math.max(0, Math.floor(Number(s[k][g]) || 0));
    });
    if (isPlainObject(s.answers)) ["react", "flutter"].forEach(u => {
      const a = s.answers[u];
      if (isPlainObject(a)) st.stats.answers[u] = { c: Math.max(0, Math.floor(Number(a.c) || 0)), t: Math.max(0, Math.floor(Number(a.t) || 0)) };
    });
    if (isPlainObject(s.perGame)) for (const g of Object.keys(s.perGame)) {
      if (!GAME_IDS.includes(g)) continue;
      const p = s.perGame[g];
      if (isPlainObject(p)) st.stats.perGame[g] = { plays: Math.max(0, Math.floor(Number(p.plays) || 0)), wins: Math.max(0, Math.floor(Number(p.wins) || 0)), best: Math.max(0, Number(p.best) || 0) };
    }
    if (isPlainObject(s.arcade)) st.stats.arcade = { runs: Math.max(0, Math.floor(Number(s.arcade.runs) || 0)), wins: Math.max(0, Math.floor(Number(s.arcade.wins) || 0)) };
  }
  if (isPlainObject(raw.challenges)) {
    st.challenges.date = typeof raw.challenges.date === "string" ? raw.challenges.date : "";
    if (isPlainObject(raw.challenges.progress)) for (const k of Object.keys(raw.challenges.progress)) st.challenges.progress[k] = Math.max(0, Math.floor(Number(raw.challenges.progress[k]) || 0));
  }
  if (Array.isArray(raw.activeDays)) st.activeDays = raw.activeDays.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().slice(-400);
  st.lastDomain = DOMAINS[raw.lastDomain] ? raw.lastDomain : null;
  st.lastGame = GAMES[raw.lastGame] ? raw.lastGame : null;
  if (isPlainObject(raw.prefs)) {
    st.prefs.vibration = raw.prefs.vibration !== false;
    st.prefs.reducedFx = raw.prefs.reducedFx === true;
  }
  if (isPlainObject(raw.meta)) st.meta = { createdAt: Number(raw.meta.createdAt) || Date.now(), updatedAt: Number(raw.meta.updatedAt) || Date.now() };
  return st;
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const clean = sanitizeState(parsed);
    if (!clean) { App.saveError = true; return defaultState(); }
    return clean;
  } catch (e) { App.saveError = true; return defaultState(); }
}
function saveProgress() {
  try {
    App.state.meta.updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state));
    App.saveError = false;
    return true;
  } catch (e) {
    App.saveError = true;
    toast("Sauvegarde impossible : stockage local indisponible ou plein.", "error");
    return false;
  }
}
function resetProgress() {
  App.state = defaultState();
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  saveProgress();
}
function exportProgress() {
  const payload = { app: "DevMaster PWA", exportedAt: new Date().toISOString(), data: App.state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: "devmaster-progression-" + todayISO() + ".json" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function importProgress(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { ok: false, error: "Le fichier n'est pas un JSON valide." }; }
  const data = isPlainObject(parsed) && isPlainObject(parsed.data) ? parsed.data : parsed;
  const clean = sanitizeState(data);
  if (!clean) return { ok: false, error: "Format de sauvegarde inconnu ou version trop récente." };
  return { ok: true, state: clean };
}

/* ------------------------------ Progression ---------------------------- */
const Progress = {
  addPendingAnswer(universe, correct) { /* utilisé par le moteur : XP ajoutée seulement en fin de partie */ },
  answerScored(universe, correct) {
    const a = App.state.stats.answers[universe];
    if (!a) return;
    a.t++; if (correct) a.c++;
    Tracker.bump(universe === "react" ? "reactAnswers" : "flutterAnswers", correct ? 1 : 0, correct);
    saveProgress();
  },
  markVisit(domainId, gameId) {
    App.state.lastDomain = domainId;
    App.state.lastGame = gameId;
    const s = App.state.stats;
    s.started[gameId] = (s.started[gameId] || 0) + 1;
    if (!App.state.stats.perGame[gameId]) App.state.stats.perGame[gameId] = { plays: 0, wins: 0, best: 0 };
    saveProgress();
  },
  abandonRun(gameId) {
    const s = App.state.stats;
    s.abandoned[gameId] = (s.abandoned[gameId] || 0) + 1;
    saveProgress();
  },
  computeAccuracy(universe) {
    const a = App.state.stats.answers[universe];
    if (!a || a.t === 0) return null;
    return (a.c / a.t) * 100;
  },
  totalFinished() { const s = App.state.stats; return Object.keys(s.finished).reduce((n, k) => n + s.finished[k], 0); },
  totalWins() { const s = App.state.stats; return Object.keys(s.wins).reduce((n, k) => n + s.wins[k], 0); },
  domainProgress(domainId) {
    const ids = gamesOfDomain(domainId);
    if (!ids.length) return { done: 0, total: 0, pct: 0 };
    const done = ids.filter(id => (App.state.stats.finished[id] || 0) > 0).length;
    return { done, total: ids.length, pct: (done / ids.length) * 100 };
  },
  universeProgress(uid) {
    const ids = gamesOfUniverse(uid);
    const done = ids.filter(id => (App.state.stats.finished[id] || 0) > 0).length;
    return { done, total: ids.length, pct: ids.length ? (done / ids.length) * 100 : 0 };
  },
  /* Enregistre une partie terminée (une seule fois) et attribue les XP. */
  finishRun(result) {
    const st = App.state, s = st.stats, g = GAMES[result.gameId];
    const before = levelInfo(st.xp).index;
    let xp = 0;
    const breakdown = [];
    const ansXP = (result.answers && result.answers.correct || 0) * REWARDS.answer;
    if (ansXP > 0) { xp += ansXP; breakdown.push({ label: "Réponses correctes ×" + result.answers.correct, amount: ansXP }); }
    if (result.win) { xp += REWARDS.levelComplete; breakdown.push({ label: "Partie réussie", amount: REWARDS.levelComplete }); }
    if (result.answers && result.answers.total > 0) {
      const uni = g.universe;
      if (uni === "react" || uni === "flutter") {
        s.answers[uni].t += result.answers.total;
        s.answers[uni].c += result.answers.correct;
      }
    }
    const firstTime = !st.firstBonus.includes(result.gameId);
    if (result.win && firstTime) { xp += REWARDS.firstSuccess; breakdown.push({ label: "Premier succès sur ce jeu", amount: REWARDS.firstSuccess }); st.firstBonus.push(result.gameId); }
    s.finished[result.gameId] = (s.finished[result.gameId] || 0) + 1;
    if (result.win) s.wins[result.gameId] = (s.wins[result.gameId] || 0) + 1;
    const pg = s.perGame[result.gameId] || (s.perGame[result.gameId] = { plays: 0, wins: 0, best: 0 });
    pg.plays++; if (result.win) pg.wins++;
    if (typeof result.score === "number" && result.score > pg.best) pg.best = result.score;
    let record = false;
    if (typeof result.score === "number") {
      const prev = st.records[result.gameId];
      if (!prev || result.score > prev.score) {
        record = !!prev;
        st.records[result.gameId] = { score: result.score, date: todayISO(), mode: "score" };
        if (record) { xp += REWARDS.record; breakdown.push({ label: "Nouveau record", amount: REWARDS.record }); }
      }
    }
    if (g.universe === "amusement") { s.arcade.runs++; if (result.win) s.arcade.wins++; }
    st.xp += xp;
    /* défis + série de jours */
    Tracker.bump("arcadeRuns", 1, true);
    if (g.universe === "flutter" && (g.kind === "tree" || g.kind === "json")) Tracker.bump("flutterPuzzle", 1, true);
    Tracker.bump("replay", pg.plays >= 2 ? 1 : 0, pg.plays >= 2);
    if (result.answers && result.answers.total >= 5) {
      const acc = (result.answers.correct / result.answers.total) * 100;
      if (acc >= 70) Tracker.bump("precisionRun", 1, true);
    }
    Progress.markActiveDay();
    st.runs.push({ gameId: result.gameId, date: todayISO(), score: result.score || 0, win: !!result.win, timeMs: result.timeMs || 0, at: Date.now() });
    if (st.runs.length > 120) st.runs = st.runs.slice(-120);
    saveProgress();
    Badges.check();
    const after = levelInfo(st.xp).index;
    return { xp, breakdown, newRecord: record, levelUp: after > before ? levelInfo(st.xp) : null };
  },
  markActiveDay() {
    const today = todayISO();
    const days = App.state.activeDays;
    if (days[days.length - 1] !== today && !days.includes(today)) { days.push(today); if (days.length > 400) days.splice(0, days.length - 400); }
  },
  streak() {
    const days = App.state.activeDays;
    if (!days.length) return 0;
    const set = new Set(days);
    const today = new Date();
    let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (!set.has(todayISO(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    while (set.has(todayISO(cursor))) { n++; cursor.setDate(cursor.getDate() - 1); }
    return n;
  },
  recentDays() {
    const out = [];
    const set = new Set(App.state.activeDays);
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      out.push({ iso: todayISO(d), label: ["D", "L", "M", "M", "J", "V", "S"][d.getDay()], on: set.has(todayISO(d)), today: i === 0 });
    }
    return out;
  }
};

/* -------------------------------- Défis -------------------------------- */
const CHALLENGES = [
  { id: "reactAnswers", title: "Réussir cinq questions React", desc: "Cinq bonnes réponses dans l'univers React.js.", target: 5, reward: REWARDS.challenge },
  { id: "flutterPuzzle", title: "Terminer un puzzle Flutter", desc: "Arbre de Widgets ou parsing JSON terminé.", target: 1, reward: REWARDS.challenge },
  { id: "arcadeRuns", title: "Jouer deux parties d'arcade", desc: "Deux parties terminées dans Pause Dev.", target: 2, reward: REWARDS.challenge },
  { id: "precisionRun", title: "70 % de précision minimum", desc: "Terminer un exercice d'au moins 5 questions avec 70 % de bonnes réponses.", target: 1, reward: REWARDS.challenge },
  { id: "replay", title: "Rejouer à un jeu déjà terminé", desc: "Reprendre un jeu que tu as déjà réussi.", target: 1, reward: REWARDS.challenge }
];
const Tracker = {
  ensureDay() {
    const today = todayISO();
    if (App.state.challenges.date !== today) {
      App.state.challenges.date = today;
      App.state.challenges.progress = {};
      saveProgress();
    }
  },
  bump(key, n, ok) {
    if (!ok || !n) return;
    Tracker.ensureDay();
    const p = App.state.challenges.progress;
    const def = CHALLENGES.find(c => c.id === key);
    if (!def) return;
    const before = p[key] || 0;
    if (before >= def.target) return;
    p[key] = Math.min(def.target, before + n);
    saveProgress();
    if (p[key] >= def.target) {
      App.state.xp += def.reward;
      toast("Défi accompli : " + def.title + " (+" + def.reward + " XP)", "xp");
      saveProgress();
    }
  },
  progressOf(id) { Tracker.ensureDay(); return App.state.challenges.progress[id] || 0; }
};

  { id: "first-win", name: "Build vert", desc: "Remporter une première partie.", ico: "check", test: s => Progress.totalWins() >= 1 },

];
const Badges = {
  check() {
    const st = App.state;
    let changed = false;
    BADGES.forEach(b => {
      if (st.badges.includes(b.id)) return;
      let ok = false;
      try { ok = b.test(st); } catch (e) { ok = false; }
      if (ok) { st.badges.push(b.id); changed = true; toast("Succès débloqué : " + b.name, "success"); }
    });
    if (changed) saveProgress();
  }
};

const NAV_ITEMS = [

function renderBottomNav(activeKey) {

    inner.appendChild(el("button", {

function renderTopbar(opts) {
  const bar = $("#topbar");

  bar.style.display = opts && opts.hidden ? "none" : "";

  if (opts && opts.back) {
    bar.appendChild(el("button", { class: "head-btn", "aria-label": "Retour", onclick: () => safeBack() }, iconEl("back")));
    bar.appendChild(el("span", { class: "grow", style: "font-weight:650;font-size:14px", text: opts.title || "" }));
  } else {
    const brand = el("div", { class: "brand" }, el("span", { class: "logo-mark", text: "<>" }), el("span", { text: "DevMaster" }));
    bar.appendChild(brand);
  }
  const right = el("div", { class: "topbar-right" });

    }, el("span", { html: avatarSvg(App.state.profile.avatar, 22) })));

function netChip() {
  const online = typeof navigator !== "undefined" && navigator.onLine !== false;
  return el("span", { class: "net-dot" + (online ? "" : " off"), title: online ? "Connecté" : "Hors ligne" },
    el("span", { html: icon(online ? "wifi" : "wifiOff") }), el("span", { text: online ? "En ligne" : "Hors ligne" }));
}
function refreshNetChip() {
  const chip = $("#topbar .net-dot");
  if (!chip) return;
  const fresh = netChip();
  chip.replaceWith(fresh);
}
function navRoot(route) {
  if (route.startsWith("#/u/") || route.startsWith("#/d/")) return "explorer";
  if (route.startsWith("#/explorer")) return "explorer";
  if (route.startsWith("#/g/")) return "";
  if (route.startsWith("#/progression")) return "progression";
  if (route.startsWith("#/profil")) return "profil";
  return "home";
}
Nav.go = function (route, replace) {
  if (replace) location.replace(route); else location.hash = route.slice(1);
};
Nav.render = function () {
  const hash = location.hash || "#/home";
  Nav.current = hash;
  if (Nav.cleanup) { try { Nav.cleanup(); } catch (e) { /* ignore */ } Nav.cleanup = null; }
  Engine.closeQuietly();
  const view = $("#view");
  clearNode(view);
  document.body.classList.remove("in-game");
  const parts = hash.slice(2).split("/");
  const root = parts[0] || "home";
  if (root === "g" && parts[1] && GAMES[parts[1]]) { Engine.open(parts[1]); return; }
  renderBottomNav(navRoot(hash));
  if (root === "explorer") Screens.explorer();
  else if (root === "u" && UNIVERSES[parts[1]]) Screens.universe(parts[1]);
  else if (root === "d" && DOMAINS[parts[1]]) Screens.domain(parts[1]);
  else if (root === "progression") Screens.progression();
  else if (root === "profil") Screens.profil();
  else Screens.home();
  $("#view").scrollIntoView({ block: "start" });

const GAME_FACTORIES = {};   /* gameId -> (session) => controls */
const REALTIME_GAMES = { snake: true, breakout: true, maze: true, "tap-race": true, "tf-flash": true, "target-ui": true };

const Engine = {
  session: null, controls: null, gameId: null, running: false,

  open(gameId) {
    const def = GAMES[gameId];
    if (!def) { Nav.go("#/home", true); return; }
    Engine.closeQuietly();
    Engine.gameId = gameId;
    document.body.classList.add("in-game");
    renderBottomNav("");
    Progress.markVisit(def.domain, gameId);
    Tracker.bump("replay", 0, false); /* le défi replay est évalué à la fin de partie */

    const view = $("#view");
    const shell = el("div", { class: "game-shell" });
    const head = el("header", { class: "game-head" });
    const scorePill = el("span", { class: "pill", style: "display:none" });
    scorePill.innerHTML = icon("star");
    const scoreVal = el("b", { text: "0" });
    scorePill.appendChild(scoreVal);
    const timePill = el("span", { class: "pill", style: "display:none" });
    timePill.innerHTML = icon("clock");
    const timeVal = el("span", { text: "00:00" });
    timePill.appendChild(timeVal);
    const extraPill = el("span", { class: "pill", style: "display:none" });

    const backBtn = el("button", { class: "head-btn", "aria-label": "Quitter le jeu", onclick: () => Engine.requestExit() }, iconEl("back"));
    head.appendChild(backBtn);
    head.appendChild(el("span", { class: "title grow", text: def.title }));
    head.appendChild(extraPill);
    head.appendChild(scorePill);
    head.appendChild(timePill);
    if (REALTIME_GAMES[gameId]) {
      head.appendChild(el("button", { class: "head-btn", "aria-label": "Pause", onclick: () => Engine.togglePause() }, iconEl("pause")));
    }
    const body = el("div", { class: "game-body" });
    shell.appendChild(head);
    shell.appendChild(body);
    view.appendChild(shell);

    const cleanups = [];
    const session = {
      def, body, gameId,
      answers: { correct: 0, total: 0 },
      score: 0, elapsed: 0, clockId: null, clockStart: 0, running: false, finished: false,
      setScore(v) { session.score = Math.max(0, Math.round(v)); scoreVal.textContent = String(session.score); scorePill.style.display = ""; },
      setExtra(text) { if (text) { extraPill.innerHTML = ""; extraPill.appendChild(el("span", { text: text })); extraPill.style.display = ""; } else extraPill.style.display = "none"; },
      showClock() { timePill.style.display = ""; },
      startClock() {
        session.showClock();
        if (session.clockId) return;
        session.clockStart = Date.now();
        session.running = true;
        session.clockId = setInterval(() => {
          session.elapsed += Date.now() - session.clockStart;
          session.clockStart = Date.now();
          timeVal.textContent = fmtTime(session.elapsed);
        }, 250);
      },
      pauseClock() { if (session.clockId) { clearInterval(session.clockId); session.clockId = null; session.elapsed += Date.now() - session.clockStart; session.running = false; timeVal.textContent = fmtTime(session.elapsed); } },
      resumeClock() { if (!session.clockId && !session.finished) { session.clockStart = Date.now(); session.running = true; session.clockId = setInterval(() => { session.elapsed += Date.now() - session.clockStart; session.clockStart = Date.now(); timeVal.textContent = fmtTime(session.elapsed); }, 250); } },
      addAnswer(correct) {
        session.answers.total++;
        if (correct) session.answers.correct++;
        vibrate(correct ? 12 : [8, 40, 8]);
      },
      onCleanup(fn) { cleanups.push(fn); },
      finish(result) { Engine.finish(result); }
    };
    Engine.session = session;
    const factory = GAME_FACTORIES[gameId];
    if (!factory) { body.appendChild(el("p", { class: "meta", text: "Jeu introuvable." })); return; }
    Engine.controls = factory(session);
    /* pause automatique si la page devient invisible (jeux en temps réel) */
    const onVis = () => { if (document.hidden && REALTIME_GAMES[gameId] && session.running && !session.finished) Engine.togglePause(); };
    document.addEventListener("visibilitychange", onVis);
    cleanups.push(() => document.removeEventListener("visibilitychange", onVis));
    Engine._cleanups = cleanups;
    if (Engine.controls && Engine.controls.start) Engine.controls.start();
  },

  finish(result) {
    const session = Engine.session;
    if (!session || session.finished) return;
    session.finished = true;
    Engine.running = false;
    session.pauseClock();
    if (Engine.controls && Engine.controls.pause) { try { Engine.controls.pause(); } catch (e) { /* ignore */ } }
    const g = GAMES[Engine.gameId];
    const timeMs = typeof result.timeMs === "number" ? result.timeMs : session.elapsed;
    const recordBefore = App.state.records[Engine.gameId];
    const outcome = Progress.finishRun({
      gameId: Engine.gameId, score: typeof result.score === "number" ? Math.max(0, Math.round(result.score)) : 0,
      win: !!result.win, answers: session.answers, timeMs
    });
    vibrate(result.win ? [18, 50, 24] : 14);
    Engine.showResult(result, outcome, timeMs, recordBefore);
  },

  showResult(result, outcome, timeMs, recordBefore) {
    const g = GAMES[Engine.gameId];
    const acc = session_accuracy();
    const box = el("div", { class: "overlay" });
    const card = el("div", { class: "result", role: "dialog", "aria-modal": "true", "aria-label": "Résultat de la partie" });
    card.appendChild(el("div", { class: "r-icon " + (result.win ? "win" : "lose"), html: icon(result.win ? "trophy" : "info") }));
    card.appendChild(el("h2", { text: result.title || (result.win ? "Partie réussie" : "Partie terminée") }));
    card.appendChild(el("div", { class: "r-score", text: String(typeof result.score === "number" ? Math.max(0, Math.round(result.score)) : 0) }));
    card.appendChild(el("p", { class: "meta", text: "points" }));
    const rows = el("div", { class: "r-rows" });
    rows.appendChild(resultRow("Temps", fmtTime(timeMs)));
    if (Engine.session.answers.total > 0) {
      rows.appendChild(resultRow("Précision", acc + "%  (" + Engine.session.answers.correct + "/" + Engine.session.answers.total + ")"));
    }
    if (result.extras) result.extras.forEach(x => rows.appendChild(resultRow(x.label, x.value)));
    (outcome.breakdown || []).forEach(b => rows.appendChild(resultRow(b.label, "+" + b.amount + " XP")));
    rows.appendChild(resultRow("XP obtenue", "+" + outcome.xp + " XP"));
    if (outcome.newRecord) rows.appendChild(resultRow("Record", "Nouveau record personnel"));
    card.appendChild(rows);
    const actions = el("div", { class: "modal-actions", style: "flex-wrap:wrap" });
    actions.appendChild(el("button", { class: "btn btn-primary", style: "flex:1", onclick: () => Engine.replay() }, iconEl("rotate"), el("span", { text: "Rejouer" })));
    actions.appendChild(el("button", { class: "btn", style: "flex:1", onclick: () => { Engine.closeQuietly(); Nav.go("#/d/" + g.domain); } }, el("span", { text: "Continuer" })));
    actions.appendChild(el("button", { class: "btn btn-ghost", style: "flex:1", onclick: () => { Engine.closeQuietly(); safeBack(); } }, el("span", { text: "Retour" })));
    card.appendChild(actions);
    box.appendChild(card);
    $("#modal-root").appendChild(box);
    Engine._resultBox = box;
    const firstBtn = card.querySelector("button");
    if (firstBtn) firstBtn.focus();
    if (outcome.levelUp) setTimeout(() => showLevelUp(outcome.levelUp, outcome.xp), 450);
    Badges.check();
  },

  replay() {
    const id = Engine.gameId;
    Engine.closeQuietly();
    Engine.open(id);
  },
  requestExit() {
    const session = Engine.session;
    if (session && session.finished) { Engine.closeQuietly(); safeBack(); return; }
    confirmModal("Quitter la partie ?", "La partie en cours sera abandonnée : elle ne rapportera aucune XP et ne sera pas comptée comme terminée.", () => {
      if (Engine.session && !Engine.session.finished) Progress.abandonRun(Engine.gameId);
      Engine.closeQuietly();
      safeBack();
    }, { confirmLabel: "Quitter", danger: true });
  },
  togglePause() {
    const session = Engine.session;
    if (!session || session.finished) return;
    if (Engine.running) {
      Engine.running = false;
      session.pauseClock();
      if (Engine.controls && Engine.controls.pause) Engine.controls.pause();
      Engine._pauseOverlay = openModal({
        title: "Pause", dismissable: false,
        body: el("p", { class: "card-sub", text: "La minuterie et le jeu sont suspendus." }),
        actions: [
          { label: "Quitter", variant: "btn-danger", onClick: () => { Engine._pauseOverlay = null; Progress.abandonRun(Engine.gameId); Engine.closeQuietly(); safeBack(); } },
          { label: "Reprendre", variant: "btn-primary", onClick: () => { Engine._pauseOverlay = null; Engine.resume(); } }
        ]
      });
    } else Engine.resume();
  },
  resume() {
    const session = Engine.session;
    if (!session || session.finished) return;
    Engine.running = true;
    session.resumeClock();
    if (Engine.controls && Engine.controls.resume) Engine.controls.resume();
  },
  closeQuietly() {
    if (Engine._pauseOverlay) { Engine._pauseOverlay.close(); Engine._pauseOverlay = null; }
    if (Engine._resultBox) { Engine._resultBox.remove(); Engine._resultBox = null; }
    if (Engine.controls && Engine.controls.destroy) { try { Engine.controls.destroy(); } catch (e) { /* ignore */ } }
    if (Engine._cleanups) Engine._cleanups.forEach(fn => { try { fn(); } catch (e) { /* ignore */ } });
    if (Engine.session && Engine.session.clockId) clearInterval(Engine.session.clockId);
    Engine.controls = null; Engine.session = null; Engine._cleanups = null; Engine.running = false; Engine.gameId = null;
    clearNode($("#view"));
    document.body.classList.remove("in-game");
  }
};

/* Liste ordonnable : pool -> réponse, avec boutons monter/descendre/retirer. */
function createOrderList(items, opts) {
  const o = opts || {};
  const state = { pool: shuffle(items.map((it, i) => ({ id: it.id || "i" + i, text: it.text }))), order: [] };
  const root = el("div", { class: "stack", style: "gap:10px" });
  const poolBox = el("div", { class: "pool", role: "list", "aria-label": "Blocs disponibles" });
  const orderBox = el("div", { class: "order-list", role: "list", "aria-label": "Ta réponse" });
  root.appendChild(poolBox);
  root.appendChild(orderBox);
  function render() {
    clearNode(poolBox); clearNode(orderBox);
    state.pool.forEach(b => {
      poolBox.appendChild(el("button", {
        class: "order-item", style: "width:auto;cursor:pointer", role: "listitem",
        onclick: () => { state.order.push(b); state.pool = state.pool.filter(x => x !== b); render(); if (o.onChange) o.onChange(); }
      }, el("span", { class: "txt", text: b.text })));
    });
    if (!state.order.length) orderBox.appendChild(el("p", { class: "meta", text: "Touche les blocs ci-dessus pour les placer ici, puis ajuste l'ordre." }));
    state.order.forEach((b, idx) => {
      orderBox.appendChild(el("div", { class: "order-item", role: "listitem" }, [
        el("span", { class: "meta mono", style: "width:18px", text: String(idx + 1) }),
        el("span", { class: "txt", text: b.text }),
        el("button", { class: "mini-btn", "aria-label": "Monter", disabled: idx === 0, onclick: () => { const t = state.order[idx - 1]; state.order[idx - 1] = b; state.order[idx] = t; render(); } }, iconEl("arrowUp")),
        el("button", { class: "mini-btn", "aria-label": "Descendre", disabled: idx === state.order.length - 1, onclick: () => { const t = state.order[idx + 1]; state.order[idx + 1] = b; state.order[idx] = t; render(); } }, iconEl("arrowDown")),
        el("button", { class: "mini-btn danger", "aria-label": "Retirer", onclick: () => { state.order.splice(idx, 1); state.pool.push(b); render(); if (o.onChange) o.onChange(); } }, iconEl("x"))
      ]));
    });
  }
  render();
  return {
    root, isComplete: () => state.order.length === state.pool.length + state.order.length && state.order.length === items.length,
    getOrder: () => state.order.map(b => b.id),
    reset: (newItems) => {
      const list = newItems || items;
      state.pool = shuffle(list.map((it, i) => ({ id: it.id || "i" + i, text: it.text })));
      state.order = [];
      render();
    }
  };
}
/* Vérifie une réponse ordonnée contre une liste de variantes acceptées. */
function checkOrder(orderIds, variants) {
  const str = orderIds.join(",");
  return variants.some(v => v.join(",") === str);
}
/* Mélange une liste de choix et renvoie les éléments + la position du bon. */
function shuffleChoices(options, correctId) {
  const shuffled = shuffle(options.map((o, i) => ({ id: o.id || "o" + i, label: o.label, detail: o.detail || null })));
  return { items: shuffled, correctIndex: shuffled.findIndex(o => o.id === correctId) };
}
function buildChoices(container, items, onPick, opts) {
  clearNode(container);
  const letters = ["A", "B", "C", "D", "E", "F"];
  const buttons = items.map((it, i) => el("button", {
    class: "choice", onclick: () => { buttons.forEach(b => b.disabled = true); onPick(i, it); }
  }, el("span", { class: "key", text: letters[i] || String(i + 1) }), el("span", { class: "grow", text: it.label })));
  buttons.forEach(b => container.appendChild(b));
  return {
    mark(correctIndex) {
      buttons.forEach((b, i) => {
        if (i === correctIndex) { b.classList.add("good"); b.querySelector(".key").innerHTML = icon("check"); }
      });
    },
    markPick(pickIndex, correctIndex) {
      buttons.forEach((b, i) => {
        if (i === correctIndex) { b.classList.add("good"); b.querySelector(".key").innerHTML = icon("check"); }
        else if (i === pickIndex) { b.classList.add("bad"); b.querySelector(".key").innerHTML = icon("x"); }
      });
    }

}

function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function codeBlock(code) { return el("pre", { class: "code", text: code }); }

/* --- A1 : Puzzle JSX --- */
GAME_FACTORIES["jsx-puzzle"] = function (session) {
  const exs = JSX_PUZZLES;
  let idx = 0, puzzle = null, firstTry = true, solvedFirst = 0, solvedCount = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; firstTry = true; answered = false;
    clearNode(wrap);
    const ex = exs[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("code") + "<span>Exercice " + (i + 1) + "/" + exs.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: ex.title })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: ex.instruction }));
    puzzle = createOrderList(ex.blocks, {});
    wrap.appendChild(el("div", { class: "section-title", text: "Blocs" }));
    wrap.appendChild(puzzle.root);
    clearNode(actionBox);
    const validateBtn = el("button", {
      class: "btn btn-primary btn-block", disabled: true,
      onclick: () => { validateBtn.disabled = true; validate(); }
    }, iconEl("check"), el("span", { text: "Valider l'ordre" }));
    puzzle.root.addEventListener("input", () => { });
    puzzle.onChangeHook = () => { validateBtn.disabled = !puzzle.isComplete(); };
    /* réactive le bouton à chaque modification */
    const observer = new MutationObserver(() => { validateBtn.disabled = !puzzle.isComplete(); });
    observer.observe(puzzle.root, { childList: true, subtree: true });
    session.onCleanup(() => observer.disconnect());
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    feedback.clear();
    wrap.appendChild(feedback);
  }
  function validate() {
    const ex = exs[idx];
    const ok = checkOrder(puzzle.getOrder(), ex.variants);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (ok) {
      solvedCount++;
      if (firstTry) solvedFirst++;
      session.setScore(session.score + 100 + (firstTry ? 50 : 0));
      feedback.show("ok", "Ordre correct — " + (firstTry ? "du premier coup" : "après correction"),
        "<p>" + escapeHtml(ex.explanation) + "</p>");
      wrap.appendChild(codeBlock(ex.code));
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= exs.length ? "Terminer" : "Exercice suivant", () => {
        if (idx + 1 >= exs.length) {
          session.finish({
            score: session.score, win: solvedCount === exs.length,
            title: solvedCount === exs.length ? "Puzzle JSX maîtrisé" : "Puzzle terminé",
            extras: [{ label: "Exercices réussis", value: solvedCount + "/" + exs.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      firstTry = false;
      feedback.show("ko", "Ordre incorrect", "<p>Relis la structure : ouverture de fonction, retour JSX, imbrication des balises, fermeture. Corrige et revérifie.</p>");
      clearNode(actionBox);
      const retry = el("button", { class: "btn btn-primary btn-block", onclick: () => { retry.remove(); load(idx); } }, iconEl("rotate"), el("span", { text: "Réessayer" }));
      actionBox.appendChild(retry);
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

/* --- A2 : Cartes mémoire Hooks --- */
GAME_FACTORIES["hooks-memory"] = function (session) {
  const cardsData = [];
  HOOKS_PAIRS.forEach(p => {
    cardsData.push({ key: p.id + "-t", pair: p.id, face: p.term });
    cardsData.push({ key: p.id + "-r", pair: p.id, face: p.role });
  });
  let flipped = [], foundPairs = 0, attempts = 0, lock = false, flipTimer = null, started = false;
  const wrap = el("div", { class: "stack" });
  const grid = el("div", { class: "mem-grid", role: "grid", "aria-label": "Cartes mémoire" });
  const feedback = createFeedback();
  const hud = el("div", { class: "row" }, [
    el("span", { class: "chip", html: icon("star") + "<span>Paires : <b id='mm-pairs'>0/5</b></span>" }),
    el("span", { class: "chip", html: icon("target") + "<span>Essais : <b id='mm-att'>0</b></span>" })
  ]);
  wrap.appendChild(hud);
  wrap.appendChild(grid);
  wrap.appendChild(feedback);
  session.body.appendChild(wrap);

  function updateHud() {
    const b1 = $("#mm-pairs", wrap), b2 = $("#mm-att", wrap);
    if (b1) b1.textContent = foundPairs + "/5";
    if (b2) b2.textContent = String(attempts);
  }
  function build() {
    clearNode(grid);
    flipped = []; foundPairs = 0; attempts = 0; lock = false;
    shuffle(cardsData).forEach(cd => {
      const btn = el("button", {
        class: "mem-card", "aria-label": "Carte face cachée", dataset: { key: cd.key },
        onclick: () => flip(btn, cd)
      }, el("div", { class: "mem-inner" }, [
        el("div", { class: "mem-face front", text: "<>" }),
        el("div", { class: "mem-face back", text: cd.face })
      ]));
      grid.appendChild(btn);
    });
    updateHud();
  }
  function flip(btn, cd) {
    if (lock || btn.classList.contains("flipped") || btn.classList.contains("matched")) return;
    if (!started) { started = true; session.startClock(); }
    btn.classList.add("flipped");
    btn.setAttribute("aria-label", "Carte retournée : " + cd.face);
    flipped.push({ btn, cd });
    if (flipped.length < 2) return;
    attempts++;
    updateHud();
    const [a, b] = flipped;
    if (a.cd.pair === b.cd.pair) {
      foundPairs++;
      const pair = HOOKS_PAIRS.find(p => p.id === a.cd.pair);
      a.btn.classList.remove("flipped"); b.btn.classList.remove("flipped");
      a.btn.classList.add("matched"); b.btn.classList.add("matched");
      a.btn.disabled = true; b.btn.disabled = true;
      session.setScore(session.score + 150);
      flipped = [];
      const firstDiscovery = !session._seen || !session._seen.includes(pair.id);
      session._seen = session._seen || [];
      session._seen.push(pair.id);
      feedback.show("ok", "Paire trouvée : " + pair.term, "<p>" + escapeHtml(pair.explain) + "</p>");
      updateHud();
      if (foundPairs === 5) {
        lock = true;
        const secs = Math.round(session.elapsed / 1000);
        const finalScore = 750 + Math.max(0, 600 - attempts * 20 - secs * 4);
        setTimeout(() => {
          session.finish({
            score: finalScore, win: true, title: "Toutes les paires découvertes",
            extras: [{ label: "Essais", value: String(attempts) }, { label: "Temps", value: fmtTime(session.elapsed) }]
          });
        }, 600);
      }
    } else {
      lock = true;
      flipTimer = setTimeout(() => {
        a.btn.classList.remove("flipped"); b.btn.classList.remove("flipped");
        a.btn.setAttribute("aria-label", "Carte face cachée");
        b.btn.setAttribute("aria-label", "Carte face cachée");
        flipped = []; lock = false; flipTimer = null;
      }, 750);
      session.onCleanup(() => { if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; } });
    }
  }
  return {
    start: () => { session.setScore(0); build(); },
    pause() { lock = true; if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; flipped.forEach(f => f.btn.classList.remove("flipped")); flipped = []; } },
    resume() { lock = false; },
    destroy() { if (flipTimer) clearTimeout(flipTimer); }
  };
};

/* --- A3 : Vrai / Faux éclair --- */
GAME_FACTORIES["tf-flash"] = function (session) {
  let mode = null, qs = [], idx = 0, correct = 0, countdown = 60, cdId = null, advanceTimer = null, pendingAdvance = false, answered = false, over = false;
  const wrap = el("div", { class: "stack" });
  const actionBox = el("div");
  const feedback = createFeedback();
  session.body.appendChild(wrap);

  function stopAllTimers() {
    if (cdId) { clearInterval(cdId); cdId = null; }
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }
  function chooseMode() {
    clearNode(wrap);
    wrap.appendChild(gameIntro(GAMES["tf-flash"]));
    wrap.appendChild(el("div", { class: "duo" }, [
      el("button", { class: "btn btn-primary", onclick: () => begin("eclair") }, iconEl("bolt"), el("span", { text: "Éclair (60 s)" })),
      el("button", { class: "btn", onclick: () => begin("learn") }, iconEl("book"), el("span", { text: "Apprentissage" }))
    ]));
    wrap.appendChild(el("p", { class: "meta", text: "15 affirmations. Dans le mode éclair, la rapidité compte mais chaque explication reste affichée." }));
  }
  function begin(m) {
    mode = m; qs = shuffle(TF_QUESTIONS); idx = 0; correct = 0; over = false;
    clearNode(wrap);
    wrap.appendChild(feedback);
    wrap.appendChild(actionBox);
    session.setScore(0);
    session.startClock();
    if (mode === "eclair") {
      session.setExtra("60 s");
      cdId = setInterval(() => {
        countdown--;
        session.setExtra(Math.max(0, countdown) + " s");
        if (countdown <= 0) endGame();
      }, 1000);
    } else session.setExtra("Mode apprentissage");
    renderQuestion();
  }
  function renderQuestion() {
    if (over) return;
    const q = qs[idx];
    clearNode(wrap);
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("list") + "<span>Question " + (idx + 1) + "/" + qs.length + "</span>" }),
      el("span", { class: "grow" }),
      el("span", { class: "meta", text: "Difficulté " + q.d + "/3" })
    ]));
    wrap.appendChild(el("div", { class: "card" }, el("p", { style: "font-size:15px;font-weight:600;line-height:1.45", text: q.t })));
    answered = false;
    const duo = el("div", { class: "duo" });
    const btnV = el("button", { class: "btn" }, iconEl("check"), el("span", { text: "Vrai" }));
    const btnF = el("button", { class: "btn" }, iconEl("x"), el("span", { text: "Faux" }));
    duo.appendChild(btnV); duo.appendChild(btnF);
    wrap.appendChild(duo);
    feedback.clear();
    wrap.appendChild(feedback);
    clearNode(actionBox);
    wrap.appendChild(actionBox);
    function answer(pickTrue) {
      if (answered) return;
      answered = true;
      const ok = pickTrue === q.a;
      if (ok) correct++;
      session.addAnswer(ok);
      session.setScore(correct * 100);
      btnV.disabled = true; btnF.disabled = true;
      (q.a ? btnV : btnF).classList.add("good");
      if (!ok) (pickTrue ? btnV : btnF).classList.add("bad");
      feedback.show(ok ? "ok" : "ko", ok ? "Correct" : "Incorrect — la bonne réponse était : " + (q.a ? "Vrai" : "Faux"), "<p>" + escapeHtml(q.e) + "</p>");
      if (mode === "learn") {
        actionBox.appendChild(nextButton(idx + 1 >= qs.length ? "Terminer" : "Question suivante", next));
      } else {
        pendingAdvance = true;
        advanceTimer = setTimeout(() => { advanceTimer = null; pendingAdvance = false; next(); }, 1500);
        actionBox.appendChild(nextButton("Question suivante", () => { if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; } pendingAdvance = false; next(); }));
      }
    }
    btnV.addEventListener("click", () => answer(true));
    btnF.addEventListener("click", () => answer(false));
  }
  function next() {
    idx++;
    if (idx >= qs.length) { endGame(); return; }
    renderQuestion();
  }
  function endGame() {
    if (over) return;
    over = true;
    stopAllTimers();
    const completed = idx >= qs.length;
    session.finish({
      score: correct * 100 + (completed ? 100 : 0),
      win: correct >= 10,
      title: correct >= 10 ? "Série réussie" : "Série terminée",
      extras: [
        { label: "Bonnes réponses", value: correct + "/" + qs.length },
        { label: "Mode", value: mode === "eclair" ? "Éclair" : "Apprentissage" }
      ]
    });
  }
  return {
    start: () => chooseMode(),
    pause() {
      if (cdId) { clearInterval(cdId); cdId = null; }
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; pendingAdvance = true; }
    },
    resume() {
      if (mode === "eclair" && !over && !cdId) {
        cdId = setInterval(() => {
          countdown--;
          session.setExtra(Math.max(0, countdown) + " s");
          if (countdown <= 0) endGame();
        }, 1000);
      }
      if (pendingAdvance && !over) { pendingAdvance = false; next(); }
    },
    destroy() { stopAllTimers(); }
  };
};

    feedback.clear();
    wrap.appendChild(feedback);
    tree._validateBtn = validateBtn;
  }
  function refresh(tree, sc) {
    $$(".tree-node", tree).forEach(b => {
      const pos = path.findIndex(p => p.id === b.dataset.id);
      b.classList.toggle("selected", pos >= 0);
      b.classList.remove("visited");
      b.querySelector(".val").textContent = pos >= 0 ? "#" + (pos + 1) : "";
    });
  }
  function pick(sc, n, btn) {
    const tree = btn.parentElement;
    const last = path[path.length - 1];
    if (last && last.id === n.id) { path.pop(); }
    else if (!path.some(p => p.id === n.id)) { path.push(n); }
    refresh(tree, sc);
    tree._validateBtn.disabled = path.length === 0;
  }
  function validate(sc) {
    const ok = checkOrder(path.map(p => p.id), [sc.path]);
    if (!answered) { session.addAnswer(ok); answered = true; }
    if (!ok) {
      firstTry = false;
      feedback.show("ko", "Chemin incorrect", "<p>Le flux ne circule pas comme demandé. Repars de la donnée et suis le sens indiqué dans la consigne (props vers l'enfant, ou remontée pour les callbacks).</p>");
      return;
    }
    solved++;
    session.setScore(session.score + 100);
    const tree = $(".tree", wrap);
    path.forEach((p, i) => {
      animTimers.push(setTimeout(() => {
        const b = $$(".tree-node", tree).find(x => x.dataset.id === p.id);
        if (b) {
          b.classList.add("visited");
          b.querySelector(".val").textContent = sc.values[p.id] || "";
        }
      }, i * 350));
    });
    animTimers.push(setTimeout(() => {
      feedback.show("ok", "Chemin correct", "<p>" + escapeHtml(sc.explanation) + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Scénario suivant", () => {
        if (idx + 1 >= scenarios.length) {
          session.finish({
            score: session.score, win: solved >= 4,
            title: solved >= 4 ? "Circuit maîtrisé" : "Circuit terminé",
            extras: [{ label: "Scénarios réussis", value: solved + "/" + scenarios.length }]
          });
        } else load(idx + 1);
      }));
    }, path.length * 350 + 250));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { clearAnim(); } };
};

GAME_FACTORIES["arch-decision"] = function (session) {
  const scenarios = REACT_DECISIONS.slice();
  let idx = 0, score = 0, good = 0, answered = false;
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  const choicesBox = el("div", { class: "choices" });
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; answered = false;
    clearNode(wrap);
    const sc = scenarios[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("list") + "<span>Décision " + (i + 1) + "/" + scenarios.length + "</span>" })
    ]));
    const card = el("div", { class: "dec-card" }, [
      el("p", { style: "font-size:14.5px;font-weight:600;line-height:1.5", text: sc.scenario })
    ]);
    wrap.appendChild(card);
    wrap.appendChild(el("div", { class: "section-title", text: "Ta décision" }));
    wrap.appendChild(choicesBox);
    clearNode(actionBox);
    wrap.appendChild(actionBox);
    feedback.clear();
    wrap.appendChild(feedback);
    wrap.appendChild(el("p", { class: "swipe-hint", html: icon("hand") + "<span>Balayage facultatif : balaye à gauche / à droite pour choisir les deux premières options.</span>" }));

    const scCopy = sc;
    buildChoices(choicesBox, sc.options, (i2, item) => decide(scCopy, i2, item));
    /* balayage facultatif */
    let sx = 0, sy = 0, tracking = false;
    function onStart(e) { const t = e.changedTouches ? e.changedTouches[0] : e; sx = t.clientX; sy = t.clientY; tracking = true; }
    function onEnd(e) {
      if (!tracking || answered) return;
      tracking = false;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const btns = $$(".choice", choicesBox);
        const target = dx < 0 ? btns[0] : btns[1];
        if (target && !target.disabled) target.click();
      }
    }
    card.addEventListener("touchstart", onStart, { passive: true });
    card.addEventListener("touchend", onEnd, { passive: true });
    session.onCleanup(() => { card.removeEventListener("touchstart", onStart); card.removeEventListener("touchend", onEnd); });
  }
  function decide(sc, pickIndex, item) {
    if (answered) return;
    answered = true;
    const opt = sc.options.find(o => o.id === item.id) || sc.options[pickIndex];
    const correctIndex = sc.options.findIndex(o => o.verdict === "good");
    const isGood = opt.verdict === "good";
    session.addAnswer(isGood);
    if (isGood) good++;
    const gained = opt.verdict === "good" ? 100 : opt.verdict === "ok" ? 60 : 0;
    score += gained;
    session.setScore(score);
    const marks = $$(".choice", choicesBox);
    marks.forEach((b, i) => {
      b.disabled = true;
      const o = sc.options[i];
      if (o.verdict === "good") b.classList.add("good");
      else if (i === pickIndex) b.classList.add("bad");
    });
    const verdictLabel = opt.verdict === "good" ? "Solution solide" : opt.verdict === "ok" ? "Possible, avec des limites" : "Peu adaptée ici";
    feedback.show(opt.verdict === "good" ? "ok" : opt.verdict === "ok" ? "info" : "ko", verdictLabel + " (+" + gained + " pts)", "<p><b>Pourquoi :</b> " + escapeHtml(sc.feedback[item.id] || "") + "</p><p style='margin-top:6px'>" + escapeHtml(sc.explanation) + "</p>");
    clearNode(actionBox);
    actionBox.appendChild(nextButton(idx + 1 >= scenarios.length ? "Terminer" : "Scénario suivant", () => {
      if (idx + 1 >= scenarios.length) {
        session.finish({
          score, win: score >= 400,
          title: score >= 400 ? "Bon sens architectural" : "Série terminée",
          extras: [{ label: "Décisions solides", value: good + "/" + scenarios.length }]
        });
      } else load(idx + 1);
    }));
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};

GAME_FACTORIES["mvc-sort"] = function (session) {
  const rounds = MVC_ROUNDS.slice();
  let idx = 0, selected = null, validated = false, firstTry = true, solved = 0, answered = false, lockedItems = {};
  const wrap = el("div", { class: "stack" });
  const feedback = createFeedback();
  const actionBox = el("div");
  session.body.appendChild(wrap);
  session.setScore(0);

  function load(i) {
    idx = i; selected = null; validated = false; firstTry = true; answered = false; lockedItems = {};
    clearNode(wrap);
    const rd = rounds[i];
    wrap.appendChild(el("div", { class: "row" }, [
      el("span", { class: "chip", html: icon("layers") + "<span>Série " + (i + 1) + "/" + rounds.length + "</span>" })
    ]));
    wrap.appendChild(el("p", { class: "card-sub", text: rd.intro }));
    wrap.appendChild(el("p", { class: "meta", text: "Touche un élément, puis la zone où le classer." }));
    const pool = el("div", { class: "pool", id: "sort-pool" });
    const grid = el("div", { class: "class-grid", id: "sort-grid" });
    rd.zones.forEach(z => {
      const col = el("div", { class: "class-col", dataset: { zone: z.id } }, el("h4", { text: z.label }));
      col.addEventListener("click", () => place(col));
      grid.appendChild(col);
    });
    shuffle(rd.items).forEach(it => {
      const b = el("button", { class: "class-item", dataset: { id: it.id }, text: it.label, onclick: () => select(b) });
      pool.appendChild(b);
    });
    wrap.appendChild(el("div", { class: "section-title", text: "Éléments à classer" }));
    wrap.appendChild(pool);
    wrap.appendChild(el("div", { class: "section-title", text: "Zones" }));
    wrap.appendChild(grid);
    clearNode(actionBox);
    const validateBtn = el("button", { class: "btn btn-primary btn-block", disabled: true, onclick: () => validate(rd, grid) }, iconEl("check"), el("span", { text: "Valider le classement" }));
    actionBox.appendChild(validateBtn);
    wrap.appendChild(actionBox);
    wrap.appendChild(feedback);
    wrap._validateBtn = validateBtn;
    wrap._pool = pool;
    wrap._grid = grid;
  }
  function select(btn) {
    if (validated || btn.parentElement.id === "sort-grid" && lockedItems[btn.dataset.id]) return;
    $$(".class-item.sel", wrap).forEach(b => b.classList.remove("sel"));
    if (selected === btn) { selected = null; return; }
    btn.classList.add("sel");
    selected = btn;
  }
  function place(col) {
    if (!selected || validated) return;
    const id = selected.dataset.id;
    if (lockedItems[id]) return;
    col.appendChild(selected);
    selected.classList.remove("sel");
    selected = null;
    wrap._validateBtn.disabled = false;
  }
  function validate(rd, grid) {
    const items = $$(".class-item", grid);
    let allCorrect = true;
    if (!answered) {
      allCorrect = items.every(b => {
        const it = rd.items.find(x => x.id === b.dataset.id);
        return b.parentElement.dataset.zone === it.zone;
      });
      session.addAnswer(allCorrect);
      answered = true;
      if (!allCorrect) firstTry = false;
    }
    let wrongCount = 0;
    items.forEach(b => {
      const it = rd.items.find(x => x.id === b.dataset.id);
      const ok = b.parentElement.dataset.zone === it.zone;
      b.classList.remove("good", "bad");
      b.classList.add(ok ? "good" : "bad");
      if (!ok) wrongCount++;
    });
    validated = true;
    if (wrongCount === 0) {
      solved++;
      session.setScore(session.score + (firstTry ? 100 : 60));
      const whys = rd.items.map(it => "• " + it.label + " → " + it.why).join("<br>");
      feedback.show("ok", "Classement correct (+" + (firstTry ? 100 : 60) + " pts)", "<p>" + whys + "</p>");
      clearNode(actionBox);
      actionBox.appendChild(nextButton(idx + 1 >= rounds.length ? "Terminer" : "Série suivante", () => {
        if (idx + 1 >= rounds.length) {
          session.finish({
            score: session.score, win: solved === rounds.length,
            title: solved === rounds.length ? "Architecture rangée" : "Série terminée",
            extras: [{ label: "Séries réussies", value: solved + "/" + rounds.length }]
          });
        } else load(idx + 1);
      }));
    } else {
      items.forEach(b => {
        if (b.classList.contains("bad")) { b.classList.remove("bad"); wrap._pool.appendChild(b); }
        else lockedItems[b.dataset.id] = true;
      });
      feedback.show("ko", wrongCount + " élément(s) à corriger", "<p>Les éléments justes sont verrouillés. Replace les autres dans la bonne zone, puis revérifie.</p>");
      clearNode(actionBox);
      actionBox.appendChild(el("button", { class: "btn btn-primary btn-block", onclick: () => { feedback.clear(); wrap._validateBtn.disabled = false; } }, iconEl("rotate"), el("span", { text: "Corriger" })));
    }
  }
  return { start: () => load(0), pause() { }, resume() { }, destroy() { } };
};
